            <td style="text-align:right;" class="${r.result === 'win' ? 'res-win' : 'res-lose'}">${r.result === 'win' ? 'Vittoria' : 'Non vince'}</td></tr>`).join('')}
      </tbody></table>`));
  return panel;
}

/* =========================================================================
   13. SCHERMATA — richieste di pronostico (organizzatore)
   ========================================================================= */
async function pickTeamFor(p){
  return new Promise(resolve => {
    const ov = el(`<div class="overlay"></div>`);
    const box = el(`
      <div class="modal" style="width:min(560px,100%);">
        <h3>Pronostico per ${esc(p.name)}</h3>
        <p>Scegli tu la squadra: viene registrata subito come approvata.</p>
        <div class="btn-row" style="justify-content:flex-end;"><button class="btn btn-ghost" data-x>Annulla</button></div>
      </div>`);
    const picker = teamPicker(p, S.requests[p.id]?.teamId, id => { ov.remove(); resolve(id); });
    box.insertBefore(picker, box.querySelector('.btn-row'));
    picker.style.marginBottom = '14px';
    ov.appendChild(box); document.body.appendChild(ov);
    box.querySelector('[data-x]').onclick = () => { ov.remove(); resolve(null); };
    ov.onclick = e => { if(e.target === ov){ ov.remove(); resolve(null); } };
  });
}

function viewRequests(){
  const wrap = el(`<div class="stack"></div>`);
  const active = activePlayers();
  const pending = active.filter(p => S.requests[p.id]?.status === 'pending');
  const missing = active.filter(p => !S.requests[p.id] || S.requests[p.id].status === 'rejected');

  /* controlli di giornata */
  const ctl = el(`
    <div class="panel">
      <div class="panel-head"><div><span class="eyebrow">Giornata ${S.meta.round}</span><h2>Regole d'invio</h2></div></div>
      <div class="panel-body">
        <div class="form-grid">
          <label class="field"><span>Termine per l'invio</span><input type="datetime-local" id="dl" value="${toInputDT(S.meta.deadline)}"></label>
          <div style="display:flex; align-items:flex-end; gap:8px;">
            <button class="btn btn-ghost" id="dl-save">Salva termine</button>
            <button class="btn btn-ghost" id="dl-clear">Togli</button>
          </div>
        </div>
        <label class="checkline"><input type="checkbox" id="auto" ${S.meta.autoApprove ? 'checked' : ''}>
          <span>Approva da solo i pronostici validi. Lascialo spento se vuoi controllarli uno per uno.</span></label>
      </div>
    </div>`);
  ctl.querySelector('#dl-save').onclick = async () => {
    const v = ctl.querySelector('#dl').value;
    S.meta.deadline = v ? new Date(v).toISOString() : null;
    await saveMeta(); toast('Termine aggiornato.', 'ok'); render();
  };
  ctl.querySelector('#dl-clear').onclick = async () => { S.meta.deadline = null; await saveMeta(); toast('Termine rimosso.', 'ok'); render(); };
  ctl.querySelector('#auto').onchange = async (e) => { S.meta.autoApprove = e.target.checked; await saveMeta(); toast(e.target.checked ? 'Approvazione automatica attiva.' : 'Approvazione manuale attiva.', 'ok'); };
  wrap.appendChild(ctl);

  /* tabellone richieste */
  const panel = el(`
    <div class="panel">
      <div class="panel-head">
        <h2>Richieste ricevute</h2>
        <div class="btn-row">
          ${pending.length ? `<button class="btn btn-sm btn-ok" id="all-ok">Approva tutte (${pending.length})</button>` : ''}
          ${missing.length ? `<button class="btn btn-sm btn-ghost" id="copy">Copia promemoria</button>` : ''}
        </div>
      </div>
      <div class="panel-body"><div class="board"></div></div>
    </div>`);
  const board = panel.querySelector('.board');

  active.forEach(p => {
    const req = S.requests[p.id];
    const state = req ? req.status : 'missing';
    const t = req ? team(req.teamId) : null;
    const dup = req ? Object.entries(S.requests).filter(([id, r]) => r.teamId === req.teamId && r.status !== 'rejected').length : 0;
    const invalid = req && (p.usedTeamIds || []).includes(req.teamId);
    const row = el(`
      <div class="req ${state}">
        <div>
          <div class="p-name">${esc(p.name)}</div>
          <div class="p-sub">${req ? 'inviato ' + fmtDate(req.sentAt) + ' · da ' + esc(req.sentBy) : 'nessuna richiesta'}</div>
        </div>
        <div>
          ${req ? `<div class="p-team"><span class="dot" style="background:${t.color}"></span>${esc(t.name)}
                   ${dup > 1 ? `<span class="tag mute">in ${dup}</span>` : ''}</div>
                   ${invalid ? `<div class="warn-inline">Squadra già usata in una giornata precedente.</div>` : ''}
                   ${req.note ? `<div class="p-sub">nota: ${esc(req.note)}</div>` : ''}`
                 : `<span class="tag mute">in attesa di risposta</span>`}
        </div>
        <div class="p-actions"></div>
      </div>`);
    const acts = row.querySelector('.p-actions');

    if(state === 'pending'){
      const ok = el(`<button class="btn btn-sm btn-ok">Approva</button>`);
      ok.onclick = async () => { await decideRequest(p.id, 'approved'); toast('Approvato: ' + p.name + ' → ' + t.name, 'ok'); render(); };
      const ko = el(`<button class="btn btn-sm btn-ko">Respingi</button>`);
      ko.onclick = async () => {
        const note = await modal({ title:'Respingi il pronostico', message:'Scrivi il motivo: ' + p.name + ' lo vedrà e potrà rifare la scelta.', input:'text', placeholder:'es. squadra già usata', confirmText:'Respingi' });
        if(note === null) return;
        await decideRequest(p.id, 'rejected', note); toast('Richiesta respinta.', ''); render();
      };
      acts.append(ok, ko);
    } else if(state === 'approved'){
      acts.appendChild(el(`<span class="tag ok">registrato</span>`));
      const undo = el(`<button class="btn btn-sm btn-ghost">Annulla</button>`);
      undo.onclick = async () => { await decideRequest(p.id, 'pending'); render(); };
      acts.appendChild(undo);
    } else {
      acts.appendChild(el(`<span class="tag ${state === 'rejected' ? 'ko' : 'mute'}">${state === 'rejected' ? 'respinto' : 'manca'}</span>`));
    }
    const setBtn = el(`<button class="btn btn-sm btn-ghost">Scegli tu</button>`);
    setBtn.onclick = async () => {
      const tid = await pickTeamFor(p);
      if(!tid) return;
      try{ await submitRequest(p.id, tid, true); toast(p.name + ' → ' + team(tid).name, 'ok'); render(); }
      catch(e){ toast(e.message, 'err'); }
    };
    acts.appendChild(setBtn);
    board.appendChild(row);
  });

  const allOk = panel.querySelector('#all-ok');
  if(allOk) allOk.onclick = async () => {
    allOk.disabled = true;
    for(const p of pending) await decideRequest(p.id, 'approved');
    toast(pending.length + ' pronostici approvati.', 'ok'); render();
  };
  const copy = panel.querySelector('#copy');
  if(copy) copy.onclick = () => {
    const txt = `Minigioco — giornata ${S.meta.round}\nManca ancora il pronostico di: ${missing.map(p => p.name).join(', ')}.` +
      (S.meta.deadline ? `\nTermine: ${fmtDate(S.meta.deadline)}.` : '');
    navigator.clipboard?.writeText(txt).then(() => toast('Promemoria copiato.', 'ok'), () => toast('Copia non riuscita.', 'err'));
  };
  wrap.appendChild(panel);
  return wrap;
}

/* =========================================================================
   14. SCHERMATA — risultati e chiusura giornata (organizzatore)
   ========================================================================= */
function viewResults(){
  const wrap = el(`<div class="stack"></div>`);
  const ap = approvedPicks();
  const byTeam = new Map();
  Object.entries(ap).forEach(([pid, tid]) => { (byTeam.get(tid) || byTeam.set(tid, []).get(tid)).push(pid); });

  if(!allApproved())
    wrap.appendChild(el(`<div class="banner">Mancano ancora dei pronostici approvati: puoi già segnare i risultati delle squadre note, ma la giornata si chiude solo quando ci sono tutti.</div>`));

  const panel = el(`
    <div class="panel">
      <div class="panel-head"><div><span class="eyebrow">Giornata ${S.meta.round}</span><h2>Esito delle squadre</h2></div></div>
      <div class="panel-body"><p class="note">Segna se la squadra ha vinto: l'esito vale per tutti quelli che l'hanno scelta. Ricliccando togli il segno.</p><div class="board"></div></div>
    </div>`);
  const board = panel.querySelector('.board');

  if(byTeam.size === 0){
    board.appendChild(el(`<div class="empty">Nessun pronostico approvato per questa giornata.</div>`));
  } else {
    [...byTeam.entries()].sort((a,b) => team(a[0]).name.localeCompare(team(b[0]).name)).forEach(([tid, pids]) => {
      const t = team(tid), cur = S.results[tid];
      const row = el(`
        <div class="req ${cur === 'win' ? 'approved' : cur === 'lose' ? 'rejected' : 'pending'}">
          <div class="p-team"><span class="dot" style="background:${t.color}"></span><strong>${esc(t.name)}</strong></div>
          <div class="p-sub">${pids.map(id => esc(player(id)?.name || '?')).join(' · ')}</div>
          <div class="p-actions">
            <button class="btn btn-sm btn-ok ${cur === 'win' ? 'on' : ''}" data-r="win">Ha vinto</button>
            <button class="btn btn-sm btn-ko ${cur === 'lose' ? 'on' : ''}" data-r="lose">Non ha vinto</button>
          </div>
        </div>`);
      row.querySelectorAll('[data-r]').forEach(b => b.onclick = async () => {
        b.disabled = true;
        try{ await setResult(tid, b.dataset.r); render(); }catch(e){ toast('Salvataggio non riuscito.', 'err'); b.disabled = false; }
      });
      board.appendChild(row);
    });
  }
  wrap.appendChild(panel);

  const ready = allApproved() && allResulted();
  const outCount = Object.entries(ap).filter(([pid, tid]) => S.results[tid] === 'lose').length;
  const close = el(`
    <div class="panel"><div class="panel-body" style="display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;">
      <div>
        <h2 style="font-size:1rem;">Chiudi la giornata ${S.meta.round}</h2>
        <p class="note">${ready
          ? `Alla chiusura ${outCount === 0 ? 'nessuno viene eliminato' : outCount === 1 ? '1 partecipante viene eliminato' : outCount + ' partecipanti vengono eliminati'} e si passa alla giornata successiva.`
          : 'Servono tutti i pronostici approvati e tutti gli esiti segnati.'}</p>
      </div>
      <button class="btn btn-primary" id="close-round" ${ready ? '' : 'disabled'}>Chiudi la giornata</button>
    </div></div>`);
  close.querySelector('#close-round').onclick = async () => {
    if(!await confirmBox('Chiudo la giornata ' + S.meta.round + '. Gli esiti diventano definitivi e le squadre usate non saranno più scegliibili.')) return;
    await closeRound();
  };
  wrap.appendChild(close);
  return wrap;
}

/* =========================================================================
   15. SCHERMATA — partecipanti e account (organizzatore)
   ========================================================================= */
function viewPlayers(){
  const wrap = el(`<div class="stack"></div>`);
  const placeholders = S.meta.players.filter(p => isPlaceholder(p.name));
  wrap.appendChild(el(`<div class="banner">I codici di accesso sono in chiaro: puoi leggerli, copiarli e cambiarli tu. Ricordalo ai partecipanti — qui dentro non deve finire una password che usano altrove.</div>`));

  const add = el(`
    <div class="panel">
      <div class="panel-head"><h2>Aggiungi un partecipante</h2>
        ${placeholders.length ? `<button class="btn btn-sm btn-ghost" id="rm-ph">Rimuovi ${placeholders.length} segnaposto</button>` : ''}</div>
      <div class="panel-body"><div style="display:flex; gap:8px; flex-wrap:wrap;">
        <input type="text" id="np" placeholder="Nome e cognome" style="flex:1; min-width:200px;">
        <button class="btn btn-primary" id="np-go">Aggiungi</button>
      </div></div>
    </div>`);
  const doAdd = async () => {
    const name = add.querySelector('#np').value.trim();
    if(!name) return;
    let id = 'p-' + slug(name), n = 2;
    while(player(id)) id = 'p-' + slug(name) + '-' + (n++);
    S.meta.players.push({ id, name, usedTeamIds:[], eliminated:false, eliminatedRound:null, rowIndex:null });
    if(S.meta.phase === 'setup') S.meta.phase = 'playing';
    await saveMeta(); add.querySelector('#np').value = ''; toast(name + ' aggiunto.', 'ok'); render();
  };
  add.querySelector('#np-go').onclick = doAdd;
  add.querySelector('#np').onkeydown = e => { if(e.key === 'Enter') doAdd(); };
  const rmPh = add.querySelector('#rm-ph');
  if(rmPh) rmPh.onclick = async () => {
    if(!await confirmBox('Rimuovo i ' + placeholders.length + ' nomi segnaposto ("partecipante N")?')) return;
    S.meta.players = S.meta.players.filter(p => !isPlaceholder(p.name));
    await saveMeta(); toast('Segnaposto rimossi.', 'ok'); render();
  };
  wrap.appendChild(add);

  const panel = el(`
    <div class="panel">
      <div class="panel-head"><h2>Partecipanti e accessi</h2>
        <div class="btn-row">
          <button class="btn btn-sm btn-ghost" id="mk-all">Crea gli accessi mancanti</button>
          <button class="btn btn-sm btn-ghost" id="cp-all">Copia tutti</button>
          <button class="btn btn-sm btn-ghost" id="tg-all">Mostra i codici</button>
        </div></div>
      <div class="panel-body" style="padding:0;"><div class="table-scroll"><table>
        <thead><tr><th>Partecipante</th><th>Nome utente</th><th>Codice</th><th>Squadre usate</th><th style="text-align:right;">Azioni</th></tr></thead>
        <tbody></tbody></table></div></div>
    </div>`);
  const tb = panel.querySelector('tbody');
  S.meta.players.forEach(p => {
    const u = S.users.find(u => u.playerId === p.id);
    const tr = el(`
      <tr class="${p.eliminated ? 'out-row' : ''}">
        <td><strong>${esc(p.name)}</strong>${p.eliminated ? `<div class="p-sub">eliminato G${p.eliminatedRound}</div>` : ''}</td>
        <td><span class="mono" style="font-size:0.78rem;">${esc(u ? u.username : usernameFor(p))}</span>${u && u.role === 'admin' ? ' <span class="tag ok">organizzatore</span>' : ''}</td>
        <td>${u ? (u.password
              ? `<span class="code-cell mono" data-code="${esc(u.password)}">••••••</span>`
              : `<span class="note-dim">creato prima: illeggibile</span>`)
            : `<span class="tag mute">nessun accesso</span>`}</td>
        <td>${(p.usedTeamIds || []).length ? (p.usedTeamIds || []).map(t => `<span class="chip-mini"><span class="dot" style="background:${team(t).color}"></span>${esc(team(t).name)}</span>`).join('') : '<span class="note-dim">—</span>'}</td>
        <td style="text-align:right;"><div class="p-actions" style="justify-content:flex-end;"></div></td>
      </tr>`);
    const acts = tr.querySelector('.p-actions');
    if(u){
      const cp = el(`<button class="btn btn-sm btn-ghost">Copia</button>`);
      cp.onclick = () => copyText(`${p.name} — nome utente: ${u.username} · codice: ${u.password || '(illeggibile, rigeneralo)'}`);
      acts.appendChild(cp);
      const rp = el(`<button class="btn btn-sm btn-ghost">Cambia codice</button>`);
      rp.onclick = async () => {
        const np = await modal({ title:'Codice di ' + p.name, message:'Scrivi il nuovo codice, oppure lascia com\'è quello proposto.', input:'text', placeholder:'almeno 6 caratteri', confirmText:'Imposta', prefill: generateCode() });
        if(np === null) return;
        try{ await changePassword(u.username, np); await loadUsers(); toast('Codice aggiornato: ' + np, 'ok'); render(); }
        catch(e){ toast(e.message, 'err'); }
      };
      acts.appendChild(rp);
      const un = el(`<button class="btn btn-sm btn-ghost">Scollega</button>`);
      un.onclick = async () => {
        if(!await confirmBox('Scollego l\'account "' + u.username + '" da ' + p.name + '? L\'account viene eliminato e il nome torna libero.')) return;
        await Store.del(K.user(u.username)); await Store.del(K.claim(p.id));
        await loadUsers(); await loadClaims(); toast('Account eliminato.', 'ok'); render();
      };
      acts.appendChild(un);
    } else {
      const mk = el(`<button class="btn btn-sm btn-ok">Crea accesso</button>`);
      mk.onclick = async () => {
        const code = await modal({ title:'Accesso per ' + p.name, message:'Nome utente: ' + usernameFor(p) + '. Questo è il codice che gli comunicherai.', input:'text', confirmText:'Crea', prefill: generateCode() });
        if(code === null) return;
        try{
          await createUser({ username: usernameFor(p), password: code, role:'player', playerId: p.id, displayName: p.name });
          await loadUsers(); await loadClaims();
          copyText(`${p.name} — nome utente: ${usernameFor(p)} · codice: ${code}`);
          toast('Accesso creato e copiato.', 'ok'); render();
        }catch(e){ toast(e.message, 'err'); }
      };
      acts.appendChild(mk);
    }
    if(!u && !S.me.playerId){
      const link = el(`<button class="btn btn-sm btn-ghost">Sono io</button>`);
      link.onclick = async () => {
        S.me.playerId = p.id;
        await Store.set(K.user(S.me.username), S.me);
        await Store.set(K.claim(p.id), S.me.username);
        await loadUsers(); await loadClaims(); toast('Collegato a ' + p.name + '.', 'ok'); render();
      };
      acts.appendChild(link);
    }
    const del = el(`<button class="btn btn-sm btn-ko">Elimina</button>`);
    del.onclick = async () => {
      if(!await confirmBox('Elimino ' + p.name + ' dal minigioco? Sparisce anche dallo storico delle giornate future.')) return;
      S.meta.players = S.meta.players.filter(x => x.id !== p.id);
      await saveMeta();
      if(u){ await Store.del(K.user(u.username)); await Store.del(K.claim(p.id)); await loadUsers(); }
      toast('Partecipante eliminato.', 'ok'); render();
    };
    acts.appendChild(del);
    tb.appendChild(tr);
  });

  /* i codici restano coperti finché non li chiedi: capita di condividere lo schermo */
  let shown = false;
  const applyMask = () => {
    panel.querySelectorAll('.code-cell').forEach(c => {
      c.textContent = shown ? c.dataset.code : '••••••';
      c.classList.toggle('hidden-code', !shown);
    });
    panel.querySelector('#tg-all').textContent = shown ? 'Nascondi i codici' : 'Mostra i codici';
  };
  panel.querySelector('#tg-all').onclick = () => { shown = !shown; applyMask(); };
  panel.querySelectorAll('.code-cell').forEach(c => c.onclick = () => copyText(c.dataset.code));
  applyMask();

  panel.querySelector('#cp-all').onclick = () => {
    const lines = S.meta.players.map(p => {
      const u = S.users.find(u => u.playerId === p.id);
      return `${p.name} — utente: ${u ? u.username : usernameFor(p)} · codice: ${u ? (u.password || '(illeggibile)') : '(da creare)'}`;
    });
    copyText('Accessi al minigioco\n' + lines.join('\n'));
  };

  panel.querySelector('#mk-all').onclick = async () => {
    const missing = S.meta.players.filter(p => !S.users.find(u => u.playerId === p.id));
    if(!missing.length){ toast('Hanno già tutti un accesso.', ''); return; }
    if(!await confirmBox('Creo l\'accesso per ' + missing.length + ' partecipanti, con un codice generato per ciascuno?')) return;
    const created = [];
    for(const p of missing){
      const code = generateCode();
      try{
        await createUser({ username: usernameFor(p), password: code, role:'player', playerId: p.id, displayName: p.name });
        created.push(`${p.name} — utente: ${usernameFor(p)} · codice: ${code}`);
      }catch(e){ toast(p.name + ': ' + e.message, 'err'); }
    }
    await loadUsers(); await loadClaims();
    if(created.length) copyText('Accessi al minigioco\n' + created.join('\n'));
    toast(created.length + ' accessi creati e copiati.', 'ok');
    render();
  };

  wrap.appendChild(panel);
  return wrap;
}

/* =========================================================================
   16. SCHERMATA — lega e storico (tutti)
   ========================================================================= */
function viewLeague(){
  const wrap = el(`<div class="stack"></div>`);
  if(S.meta.phase === 'finished') wrap.appendChild(viewWinner());

  const alive = activePlayers(), out = S.meta.players.filter(p => p.eliminated);
  const hidePicks = !isAdmin() && !allApproved() && S.meta.phase === 'playing';

  const panel = el(`
    <div class="panel">
      <div class="panel-head"><h2>Chi è ancora in piedi</h2><span class="eyebrow">${alive.length} su ${S.meta.players.length}</span></div>
      <div class="panel-body" style="padding:0;"><table>
        <thead><tr><th>Partecipante</th><th>Giornate superate</th><th style="text-align:right;">Giornata ${S.meta.round}</th></tr></thead>
        <tbody></tbody></table></div>
    </div>`);
  const tb = panel.querySelector('tbody');
  const rank = [...alive].sort((a,b) => (b.usedTeamIds?.length || 0) - (a.usedTeamIds?.length || 0) || a.name.localeCompare(b.name));
  rank.forEach(p => {
    const r = S.requests[p.id];
    const cell = !r ? '<span class="tag mute">manca</span>'
      : hidePicks ? '<span class="tag ok">inviato</span>'
      : `<span class="chip-mini"><span class="dot" style="background:${team(r.teamId).color}"></span>${esc(team(r.teamId).name)}</span> <span class="tag ${r.status === 'approved' ? 'ok' : r.status === 'pending' ? 'pending' : 'ko'}">${r.status === 'approved' ? 'ok' : r.status === 'pending' ? 'attesa' : 'respinto'}</span>`;
    tb.appendChild(el(`<tr><td><strong>${esc(p.name)}</strong></td><td class="num">${(p.usedTeamIds || []).length}</td><td style="text-align:right;">${cell}</td></tr>`));
  });
  out.sort((a,b) => (b.eliminatedRound || 0) - (a.eliminatedRound || 0)).forEach(p => {
    tb.appendChild(el(`<tr class="out-row"><td><strong>${esc(p.name)}</strong></td><td class="num">${(p.usedTeamIds || []).length}</td><td style="text-align:right;"><span class="tag ko">fuori G${p.eliminatedRound}</span></td></tr>`));
  });
  if(hidePicks) panel.querySelector('.panel-body').appendChild(el(`<p class="note-dim" style="padding:12px 18px;">Le squadre scelte restano coperte finché non hanno inviato tutti.</p>`));
  wrap.appendChild(panel);

  const hist = el(`<div class="panel"><div class="panel-head"><h2>Giornate giocate</h2></div><div class="panel-body"></div></div>`);
  const hb = hist.querySelector('.panel-body');
  if(!S.meta.history.length){ hb.appendChild(el(`<div class="empty">Nessuna giornata chiusa finora.</div>`)); }
  else {
    [...S.meta.history].reverse().forEach(h => {
      const box = el(`
        <div class="panel" style="border-color:var(--line);">
          <div class="panel-head" style="background:transparent;"><h2 style="font-size:0.92rem;">Giornata ${h.round}</h2>
            <span class="eyebrow">${h.eliminatedIds.length ? h.eliminatedIds.length + ' eliminati' : 'nessun eliminato'}</span></div>
          <div class="panel-body" style="padding:0;"><table><tbody>${h.entries.map(e => `
            <tr><td>${esc(player(e.playerId)?.name || '—')}</td>
                <td><span class="chip-mini"><span class="dot" style="background:${team(e.teamId).color}"></span>${esc(team(e.teamId).name)}</span></td>
                <td style="text-align:right;" class="${e.result === 'win' ? 'res-win' : 'res-lose'}">${e.result === 'win' ? 'V' : 'NV'}</td></tr>`).join('')}
          </tbody></table></div>
        </div>`);
      hb.appendChild(box);
    });
  }
  wrap.appendChild(hist);
  return wrap;
}

function viewWinner(){
  const names = S.meta.winners.map(id => player(id)?.name || '—');
  return el(`
    <div class="panel" style="border-color:var(--amber);">
      <div class="panel-body" style="text-align:center; padding:40px 22px;">
        <div class="eyebrow">Minigioco concluso</div>
        <h2 style="font-size:clamp(1.8rem,6vw,2.8rem); color:var(--amber); margin:8px 0;">${names.length ? esc(names.join(' · ')) : 'Nessun vincitore'}</h2>
        <p class="note">${names.length > 1
          ? 'Eliminati nella stessa giornata: il montepremi si divide.'
          : names.length === 1 ? 'Ultimo in piedi. Montepremi suo.' : 'Tutti eliminati senza superstiti.'}</p>
      </div>
    </div>`);
}

/* =========================================================================
   17. SCHERMATA — file Excel (organizzatore)
   ========================================================================= */
function importPanel(compact){
  const panel = el(`
    <div class="panel">
      <div class="panel-head"><h2>${compact ? 'Ricarica il file' : 'Carica il file del minigioco'}</h2><span class="eyebrow">.xlsx</span></div>
      <div class="panel-body">
        <p class="note">Il file viene letto così: la colonna <strong>Partecipanti</strong> dà i nomi, le colonne delle squadre con la <strong>X</strong> le squadre già usate, le colonne <strong>Giornata N</strong> gli esiti nel formato <span class="mono">V (Inter)</span> o <span class="mono">NV (Inter)</span>. Il minigioco riparte dalla prima giornata libera.</p>
        <label class="checkline"><input type="checkbox" id="imp-ph" checked><span>Salta i nomi segnaposto ("partecipante 12", ecc.)</span></label>
        <label class="checkline"><input type="checkbox" id="imp-pay" checked><span>Tieni solo chi ha la x su "Quota MiniGiochi" nel foglio dei partecipanti</span></label>
        <input type="file" id="imp-file" accept=".xlsx,.xlsm">
        ${compact ? `<div class="banner err">Ricaricare il file sostituisce partecipanti, storico e giornata in corso. Gli account restano, ma solo se i nomi non cambiano.</div>` : ''}
      </div>
    </div>`);
  panel.querySelector('#imp-file').onchange = async (e) => {
    const f = e.target.files[0];
    if(!f) return;
    const opts = { skipPlaceholders: panel.querySelector('#imp-ph').checked, onlyPaying: panel.querySelector('#imp-pay').checked };
    try{
      const res = await importWorkbook(f, opts);
      toast(`Caricati ${res.players} partecipanti e ${res.teams} squadre dal foglio "${res.sheetName}". Si riparte dalla giornata ${res.round}.`, 'ok');
      S.tab = isAdmin() ? 'requests' : 'mine';
      render();
    }catch(err){ toast(err.message, 'err'); e.target.value = ''; }
  };
  return panel;
}

function viewExcel(){
  const wrap = el(`<div class="stack"></div>`);
  wrap.appendChild(el(`
    <div class="panel">
      <div class="panel-head"><h2>File collegato</h2>${S.meta.fileName ? `<span class="eyebrow mono">${esc(S.meta.fileName)}</span>` : ''}</div>
      <div class="panel-body">
        <p class="note">${S.meta.fileName
          ? `Il sito lavora sulla copia del file <strong>${esc(S.meta.fileName)}</strong> (foglio "${esc(S.meta.sheetName || '')}"). Scarica la versione aggiornata quando vuoi: contiene le X delle squadre usate e gli esiti di ogni giornata chiusa, con il resto del file intatto.`
          : 'Nessun file caricato: il download genera comunque un foglio con la stessa struttura.'}</p>
        <div class="btn-row" id="dl-row"></div>
      </div>
    </div>`));
  const dl = el(`<button class="btn btn-primary">Scarica il file aggiornato</button>`);
  dl.onclick = downloadWorkbook;
  wrap.querySelector('#dl-row').appendChild(dl);
  wrap.appendChild(importPanel(true));

  if(S.meta.history.length){
    const back = el(`
      <div class="panel"><div class="panel-body" style="display:flex; justify-content:space-between; gap:14px; align-items:center; flex-wrap:wrap;">
        <div><h2 style="font-size:1rem;">Riapri l'ultima giornata</h2>
          <p class="note">Annulla la chiusura della giornata ${S.meta.history[S.meta.history.length-1].round}: esiti ed eliminazioni tornano modificabili.</p></div>
        <button class="btn btn-ghost" id="reopen">Riapri G${S.meta.history[S.meta.history.length-1].round}</button>
      </div></div>`);
    back.querySelector('#reopen').onclick = async () => {
      if(!await confirmBox('Riapro l\'ultima giornata chiusa?')) return;
      await reopenRound();
    };
    wrap.appendChild(back);
  }
  return wrap;
}

/* =========================================================================
   18. SCHERMATA — impostazioni
   ========================================================================= */
function viewSettings(){
  const wrap = el(`<div class="stack"></div>`);
  const sb = el(`<div>${storageBanner()}</div>`);
  if(sb.firstElementChild){ wireStorageBanner(sb); wrap.appendChild(sb); }

  const acc = el(`
    <div class="panel">
      <div class="panel-head"><h2>Il tuo account</h2><span class="eyebrow mono">${esc(S.me.username)}</span></div>
      <div class="panel-body">
        <label class="field"><span>Nuovo codice di accesso</span><input type="password" id="pw1" autocomplete="new-password"></label>
        <label class="field"><span>Ripeti</span><input type="password" id="pw2" autocomplete="new-password"></label>
        <button class="btn btn-ghost" id="pw-go">Cambia codice</button>
      </div>
    </div>`);
  acc.querySelector('#pw-go').onclick = async () => {
    const a = acc.querySelector('#pw1').value, b = acc.querySelector('#pw2').value;
    if(a !== b){ toast('I due codici non coincidono.', 'err'); return; }
    try{ await changePassword(S.me.username, a); toast('Codice cambiato.', 'ok'); acc.querySelector('#pw1').value = acc.querySelector('#pw2').value = ''; }
    catch(e){ toast(e.message, 'err'); }
  };
  wrap.appendChild(acc);

  const info = el(`
    <div class="panel">
      <div class="panel-head"><h2>Dove finiscono i dati</h2></div>
      <div class="panel-body">
        <p class="note">Modalità archivio: <strong class="mono">${Store.mode()}</strong>${Store.mode() === 'supabase' ? ` · <span class="mono">${esc(Store.config().url)}</span>` : ''}.</p>
        <p class="note-dim">I codici di accesso sono salvati in chiaro, perché l'organizzatore deve poterli leggere e ridarli a chi li dimentica. Servono a evitare che qualcuno mandi il pronostico al posto di un altro, niente di più: <strong>non usare qui una password che usi altrove</strong>.</p>
        <div class="btn-row"><button class="btn btn-ghost" id="cfg-open">Cambia archivio</button></div>
      </div>
    </div>`);
  info.querySelector('#cfg-open').onclick = openBackendSetup;
  wrap.appendChild(info);

  if(isAdmin()){
    const admins = S.users.filter(u => u.role === 'admin');
    const co = el(`
      <div class="panel">
        <div class="panel-head"><h2>Altri organizzatori</h2><span class="eyebrow">${admins.length} attivi</span></div>
        <div class="panel-body">
          <p class="note">${admins.map(u => esc(u.username)).join(', ')}. Un secondo organizzatore serve se vuoi che qualcun altro possa approvare al posto tuo.</p>
          <div class="btn-row"><button class="btn btn-ghost" id="mk-admin">Promuovi un partecipante</button></div>
        </div>
      </div>`);
    co.querySelector('#mk-admin').onclick = async () => {
      const u = await modal({ title:'Promuovi a organizzatore', message:'Scrivi il nome utente di chi deve poter approvare i pronostici.', input:'text', placeholder:'nome utente', confirmText:'Promuovi' });
      if(!u) return;
      const rec = await findUser(u);
      if(!rec){ toast('Account non trovato.', 'err'); return; }
      rec.role = 'admin'; await Store.set(K.user(rec.username), rec); await loadUsers();
      toast(rec.username + ' ora è organizzatore.', 'ok'); render();
    };
    wrap.appendChild(co);

    const danger = el(`
      <div class="panel" style="border-color:rgba(242,99,95,0.4);">
        <div class="panel-head"><h2 style="color:var(--ko);">Azzera il minigioco</h2></div>
        <div class="panel-body">
          <p class="note">Cancella partecipanti, storico, pronostici e file collegato. Gli account restano: chi vuole rigiocare dovrà solo essere ricollegato al proprio nome.</p>
          <button class="btn btn-ko" id="wipe">Azzera tutto</button>
        </div>
      </div>`);
    danger.querySelector('#wipe').onclick = async () => {
      const c = await modal({ title:'Azzera il minigioco', message:'Scrivi AZZERA per confermare: l\'operazione non si annulla.', input:'text', placeholder:'AZZERA', confirmText:'Azzera' });
      if(c !== 'AZZERA') return;
      for(const h of S.meta.history){
        for(const e of h.entries) await Store.del(K.req(h.round, e.playerId));
      }
      for(const pid of Object.keys(S.requests)) await Store.del(K.req(S.meta.round, pid));
      for(const tid of Object.keys(S.results)) await Store.del(K.res(S.meta.round, tid));
      for(const p of S.meta.players) await Store.del(K.claim(p.id));
      S.meta = emptyMeta(); await saveMeta();
      S.me.playerId = null; await Store.set(K.user(S.me.username), S.me);
      await refresh(false); toast('Minigioco azzerato.', 'ok');
    };
    wrap.appendChild(danger);
  }
  return wrap;
}

/* =========================================================================
   19. RENDER PRINCIPALE
   ========================================================================= */
function renderWho(){
  const box = document.getElementById('who');
  box.innerHTML = '';
  if(!S.me){ box.appendChild(el(`<span class="note-dim">accesso riservato ai partecipanti</span>`)); return; }
  box.appendChild(el(`<span class="badge-user ${isAdmin() ? 'admin' : ''}">${esc(S.me.displayName || S.me.username)}${isAdmin() ? ' · organizzatore' : ''}</span>`));
  if(S.offline) box.appendChild(el(`<span class="tag ko">archivio irraggiungibile</span>`));
  const out = el(`<button class="btn-link">Esci</button>`);
  out.onclick = logout;
  box.appendChild(out);
}

function tabsFor(){
  if(isAdmin()){
    const pending = activePlayers().filter(p => S.requests[p.id]?.status === 'pending').length;
    const t = [{ k:'requests', l:'Richieste', c:pending }, { k:'results', l:'Risultati' },
               { k:'league', l:'Lega' }, { k:'players', l:'Partecipanti' },
               { k:'excel', l:'File Excel' }, { k:'settings', l:'Impostazioni' }];
    if(myPlayer()) t.unshift({ k:'mine', l:'La mia schedina' });
    return t;
  }
  return [{ k:'mine', l:'La mia schedina' }, { k:'league', l:'Lega' }, { k:'settings', l:'Impostazioni' }];
}

function render(){
  renderWho();
  const app = document.getElementById('app');
  app.innerHTML = '';
  document.getElementById('foot').textContent =
    'FantaList · minigioco a eliminazione' + (S.meta?.fileName ? ' · file ' + S.meta.fileName : '') + ' · archivio: ' + Store.mode();

  if(!S.me){ app.appendChild(renderGate()); return; }

  if(!S.meta || S.meta.players.length === 0){
    const wrap = el(`<div class="stack"></div>`);
    if(isAdmin()){
      wrap.appendChild(el(`
        <div class="panel"><div class="panel-body">
          <span class="eyebrow">passo 2 di 2</span>
          <h2 style="font-size:1.5rem; margin:4px 0 8px;">Apri il minigioco</h2>
          <p class="note">Carica il file Excel della lega: da lì escono partecipanti, squadre e le giornate già giocate. In alternativa aggiungi i nomi a mano dalla sezione Partecipanti.</p>
        </div></div>`));
      wrap.appendChild(importPanel(false));
      const manual = el(`<div class="panel"><div class="panel-body"><div style="display:flex; gap:8px; flex-wrap:wrap;">
          <input type="text" id="mp" placeholder="Nome partecipante" style="flex:1; min-width:200px;">
          <button class="btn btn-ghost" id="mp-go">Aggiungi a mano</button></div></div></div>`);
      const addManual = async () => {
        const name = manual.querySelector('#mp').value.trim();
        if(!name) return;
        if(!S.meta) S.meta = emptyMeta();
        S.meta.players.push({ id:'p-' + slug(name), name, usedTeamIds:[], eliminated:false, eliminatedRound:null, rowIndex:null });
        S.meta.phase = 'playing';
        await saveMeta(); toast(name + ' aggiunto.', 'ok'); S.tab = 'players'; render();
      };
      manual.querySelector('#mp-go').onclick = addManual;
      manual.querySelector('#mp').onkeydown = e => { if(e.key === 'Enter') addManual(); };
      wrap.appendChild(manual);
    } else {
      wrap.appendChild(el(`<div class="empty">L'organizzatore non ha ancora aperto il minigioco. Torna più tardi.</div>`));
    }
    app.appendChild(wrap);
    return;
  }

  const tabs = tabsFor();
  if(!S.tab || !tabs.find(t => t.k === S.tab)) S.tab = tabs[0].k;
  const bar = el(`<div class="tabs"></div>`);
  tabs.forEach(t => {
    const b = el(`<button class="tab ${S.tab === t.k ? 'on' : ''}">${t.l}${t.c ? `<span class="count">${t.c}</span>` : ''}</button>`);
    b.onclick = () => { S.tab = t.k; render(); };
    bar.appendChild(b);
  });
  app.appendChild(bar);
  if(isAdmin() && S.meta.phase !== 'setup') app.appendChild(scoreboard());

  const views = { mine: viewMine, requests: viewRequests, results: viewResults,
                  players: viewPlayers, league: viewLeague, excel: viewExcel, settings: viewSettings };
  app.appendChild((views[S.tab] || viewLeague)());
}

/* =========================================================================
   20. AVVIO
   ========================================================================= */
let poller = null;
async function boot(){
  Store.init();
  try{
    await loadUsers();
    await loadClaims();
    await restoreSession();
    await loadMeta();
    await loadRound();
  }catch(e){
    S.offline = true;
    document.getElementById('app').innerHTML =
      `<div class="banner err">Non riesco a leggere l'archivio: ${esc(e.message)}. Controlla la configurazione Supabase (URL, chiave e tabella) e ricarica la pagina.</div>`;
    return;
  }
  render();
  poller = setInterval(async () => {
    if(!S.me || document.hidden) return;
    if(document.querySelector('.overlay')) return;      // non ricaricare mentre una finestra è aperta
    const focus = document.activeElement;
    if(focus && ['INPUT','SELECT','TEXTAREA'].includes(focus.tagName)) return;
    await refresh(true);
  }, 8000);
}
boot();
</script>
