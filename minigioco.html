          ? `<div class="empty">L'organizzatore non ha ancora caricato l'elenco dei partecipanti. Riprova più tardi.</div>`
          : free.length === 0
            ? `<div class="empty">Tutti i partecipanti hanno già un account. Se non riesci ad accedere, chiedi all'organizzatore di azzerarti la password.</div>`
            : `
        <label class="field"><span>Chi sei</span>
          <select id="rg-player">${free.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>
        <label class="field"><span>Il tuo nome utente</span>
          <input type="text" id="rg-user" value="${usernameFor(free[0])}" readonly autocomplete="username"></label>
        <label class="field"><span>Codice di accesso</span><input type="password" id="rg-pass" placeholder="almeno 6 caratteri" autocomplete="new-password"></label>
        <button class="btn btn-primary" id="rg-go" style="width:100%;">Crea il mio accesso</button>
        <p class="note-dim">Il nome utente non si sceglie: è il tuo nome come compare nel file della lega. L'organizzatore vede i codici di accesso di tutti, quindi usane uno solo per il minigioco.</p>`}
      </div></div>`);
    const sel = box.querySelector('#rg-player');
    if(sel) sel.onchange = () => { box.querySelector('#rg-user').value = usernameFor(player(sel.value)); };
    const go = box.querySelector('#rg-go');
    if(go) go.onclick = async () => {
      const pid = sel.value;
      const u = usernameFor(player(pid));
      const p = box.querySelector('#rg-pass').value;
      go.disabled = true; go.innerHTML = '<span class="spinner"></span> Creo l\'accesso…';
      try{
        await loadClaims();
        if(S.claims[pid]) throw new Error('Questo nome è appena stato collegato da qualcun altro.');
        await createUser({ username:u, password:p, role:'player', playerId:pid, displayName: player(pid).name });
        await login(u, p);
        await loadUsers(); await loadClaims();
        await refresh(false);
        toast('Accesso creato. Buon minigioco!', 'ok');
      }catch(e){ toast(e.message, 'err'); go.disabled = false; go.textContent = 'Crea il mio accesso'; }
    };
    wrap.appendChild(box);
  }
  return wrap;
}


/* =========================================================================
   11. PEZZI RIUTILIZZABILI
   ========================================================================= */
function scoreboard(){
  const open = openGames();
  const pending = totalPending();
  const missing = open.reduce((n,g) => n + missingIn(g.key).length, 0);
  return el(`
    <div class="panel"><div class="scoreboard">
      <div class="sb-cell"><div class="k">Giornata</div><div class="v">${String(S.core.round).padStart(2,'0')}<span style="font-size:1rem; color:var(--chalk-mute);">/${SEASON_ROUNDS}</span></div></div>
      <div class="sb-cell"><div class="k">In corso</div><div class="v small">${open.length ? open.map(g => g.short).join('<br>') : 'nessuno'}</div></div>
      <div class="sb-cell ${pending ? 'alert' : ''}"><div class="k">Da approvare</div><div class="v">${pending}</div></div>
      <div class="sb-cell ${missing ? 'alert' : ''}"><div class="k">Non pervenuti</div><div class="v">${missing}</div></div>
      <div class="sb-cell"><div class="k">Termine</div><div class="v small mono">${S.core.deadline ? fmtDate(S.core.deadline) : 'libero'}</div></div>
    </div></div>`);
}

function teamPickerFor(gameKey, p, selected, onPick){
  const wrap = el(`<div class="team-grid"></div>`);
  availableIn(gameKey, p).forEach(t => {
    const badge = t.max > 1 ? ` <span class="uses ${t.full ? 'full' : ''}">${t.count}/${t.max}</span>` : '';
    const b = el(`<button class="team-btn ${t.full ? 'used' : ''} ${t.id === selected ? 'on' : ''}" data-team="${t.id}" ${t.full ? 'disabled' : ''}>
        <span class="dot" style="background:${t.color}"></span>${esc(t.name)}${badge}</button>`);
    if(!t.full) b.onclick = () => onPick(t.id);
    wrap.appendChild(b);
  });
  return wrap;
}

function historyTable(gameKey, pid){
  const m = gmeta(gameKey);
  const rows = (m?.history || []).map(h => {
    const e = h.entries.find(x => x.playerId === pid);
    return e ? { round: h.round, ...e } : null;
  }).filter(Boolean);
  if(!rows.length) return el(`<div class="empty">Nessuna giornata giocata finora.</div>`);
  return el(`
    <table><thead><tr><th>G</th><th>Squadra</th><th style="text-align:right;">Esito</th></tr></thead>
      <tbody>${rows.map(r => `
        <tr><td class="num">G${String(r.round).padStart(2,'0')}</td>
            <td>${r.teamId
              ? `<span class="chip-mini"><span class="dot" style="background:${team(r.teamId).color}"></span>${esc(team(r.teamId).name)}</span>`
              : '<span class="tag mute">nessun pronostico</span>'}</td>
            <td style="text-align:right;" class="${r.result === 'win' ? 'res-win' : 'res-lose'}">${
              r.result === 'win' ? 'Vittoria' : r.result === 'absent' ? 'Assente' : 'Non vince'}</td></tr>`).join('')}
      </tbody></table>`);
}

/* =========================================================================
   12. SCHERMATA — i miei pronostici (uno per minigioco)
   ========================================================================= */
function myPanel(gameKey){
  const g = G(gameKey);
  const p = myPlayer();
  const m = gmeta(gameKey);
  const st = p ? gstate(gameKey, p.id) : null;

  const head = (tag, tagClass) => `
    <div class="panel-head">
      <div><span class="eyebrow">${esc(g.short)} · giornate ${g.first}–${g.last}</span><h2>${esc(g.name)}</h2></div>
      <span class="tag ${tagClass}">${tag}</span>
    </div>`;

  if(!m) return el(`<div class="panel">${head('non avviato','mute')}<div class="panel-body"><div class="empty">L'organizzatore non ha ancora avviato questo minigioco.</div></div></div>`);
  if(!p)  return el(`<div class="panel">${head('non iscritto','mute')}<div class="panel-body"><div class="empty">Il tuo account non è collegato a nessun partecipante. Chiedi all'organizzatore di collegarlo.</div></div></div>`);

  if(S.core.round < g.first)
    return el(`<div class="panel">${head('non ancora iniziato','mute')}<div class="panel-body">
      <div class="empty">Comincia alla giornata ${g.first}. Mancano ${g.first - S.core.round} giornate.</div></div></div>`);

  if(m.phase === 'finished' || S.core.round > g.last){
    const won = (m.winners || []).includes(p.id);
    const wrap = el(`<div class="panel">${head('concluso', won ? 'ok' : 'mute')}<div class="panel-body"></div></div>`);
    const body = wrap.querySelector('.panel-body');
    body.appendChild(el(g.kind === 'lms'
      ? `<div style="text-align:center; padding:16px 0;">
           <h2 style="font-size:1.3rem; color:${won ? 'var(--amber)' : 'var(--chalk-mute)'};">${won ? '🏆 Sei arrivato in fondo' : 'Minigioco concluso'}</h2>
           <p class="note">${(m.winners || []).length ? 'Vincitori: ' + m.winners.map(id => esc(player(id)?.name || '?')).join(', ') : 'Nessun vincitore.'}</p>
         </div>`
      : `<div style="text-align:center; padding:16px 0;">
           <h2 style="font-size:1.3rem;">Stagione conclusa</h2>
           <p class="note">Hai totalizzato <strong class="mono" style="color:var(--amber);">${winsIn(gameKey, p.id)}</strong> vittorie su ${g.last} giornate.</p>
         </div>`));
    body.appendChild(historyTable(gameKey, p.id));
    return wrap;
  }

  if(st.eliminated){
    const others = GAMES.filter(x => x.key !== gameKey && gameOpen(x.key)).map(x => x.short);
    const wrap = el(`<div class="panel out">${head('eliminato G' + st.eliminatedRound,'ko')}<div class="panel-body"></div></div>`);
    const body = wrap.querySelector('.panel-body');
    body.appendChild(el(`
      <div style="text-align:center; padding:14px 0 18px;">
        <h2 style="font-size:1.25rem; color:var(--ko);">Eliminato alla giornata ${st.eliminatedRound}${st.eliminatedReason === 'assente' ? ' (assente)' : ''}</h2>
        <p class="note">${others.length
          ? 'Qui finisce, ma continui a giocare a <strong>' + others.map(esc).join('</strong> e <strong>') + '</strong>.'
          : 'Qui il tuo percorso finisce.'}</p>
      </div>`));
    body.appendChild(historyTable(gameKey, p.id));
    return wrap;
  }

  /* --- minigioco in corso: schedina --- */
  const req = S.reqs[gameKey]?.[p.id];
  let selected = req ? req.teamId : null;
  const closed = deadlinePassed();
  const status = req ? (req.status === 'approved' ? 'registrato' : req.status === 'pending' ? 'in attesa' : 'respinto') : 'da inviare';
  const statusClass = req ? (req.status === 'approved' ? 'ok' : req.status === 'pending' ? 'pending' : 'ko') : 'mute';

  const wrap = el(`<div class="panel">${head(status, statusClass)}<div class="panel-body"></div></div>`);
  const body = wrap.querySelector('.panel-body');

  const t = req ? team(req.teamId) : null;
  const fixtures = matchesForRound(S.core.round);
  body.appendChild(el(`
    <div class="slip on-pitch">
      <div class="slip-head"><span class="who-slip">${esc(p.name)}</span><span class="code mono">G${String(S.core.round).padStart(2,'0')}</span></div>
      ${fixtures.length ? `<div class="slip-fixtures">${fixtures.map(m => {
          const h = teamByName(m.home), a = teamByName(m.away);
          return `<div class="fx-row"><span class="fx-team"><span class="dot" style="background:${h.color}"></span>${esc(m.home)}</span>
                  <span class="fx-vs">–</span>
                  <span class="fx-team right"><span class="dot" style="background:${a.color}"></span>${esc(m.away)}</span>${m.date ? `<span class="fx-date">${esc(m.date)}</span>` : ''}</div>`;
        }).join('')}</div>`
        : `<div class="slip-fixtures empty-fx">Calendario di questa giornata non ancora caricato.</div>`}
      ${req
        ? `<div class="slip-pick"><span class="dot" style="background:${t.color}"></span>${esc(t.name)}</div>
           <div class="slip-meta">Inviato ${fmtDate(req.sentAt)} da ${esc(req.sentBy)}</div>
           <div class="stamp ${statusClass}">${status}</div>`
        : `<div class="slip-pick" style="opacity:0.35;">— — —</div>
           <div class="slip-meta">Nessun pronostico inviato per questa giornata.</div>`}
    </div>`));

  if(req && req.status === 'rejected' && req.note)
    body.appendChild(el(`<div class="banner err">Respinto dall'organizzatore: ${esc(req.note)}. Scegline un altro qui sotto.</div>`));
  if(closed)
    body.appendChild(el(`<div class="banner err">Termine scaduto (${fmtDate(S.core.deadline)}). Per cambiare, scrivi all'organizzatore.</div>`));

  if(!closed){
    body.appendChild(el(`<p class="note">${g.maxUses === 1
      ? 'Scegli la squadra: quelle sbarrate le hai già usate in questo minigioco.'
      : `Ogni squadra vale fino a ${g.maxUses} volte in stagione: il contatore dice quante ne hai già usate.`}</p>`));
    const picker = teamPickerFor(gameKey, p, selected, id => {
      selected = id;
      picker.querySelectorAll('.team-btn').forEach(b => b.classList.toggle('on', b.dataset.team === id));
      send.disabled = false;
    });
    body.appendChild(picker);
    var send = el(`<button class="btn btn-primary" style="width:100%;" ${selected ? '' : 'disabled'}>${req ? 'Aggiorna il pronostico' : 'Invia il pronostico'}</button>`);
    send.onclick = async () => {
      if(!selected) return;
      send.disabled = true; send.innerHTML = '<span class="spinner"></span> Invio…';
      try{
        await submitPick(gameKey, p.id, selected);
        toast(S.core.autoApprove ? 'Pronostico registrato.' : 'Pronostico inviato: aspetta l\'approvazione.', 'ok');
        render();
      }catch(e){ toast(e.message, 'err'); send.disabled = false; send.textContent = 'Invia il pronostico'; }
    };
    body.appendChild(send);
  }
  const det = el(`<details class="mini-hist"><summary>Il tuo percorso in ${esc(g.short)}</summary></details>`);
  det.appendChild(historyTable(gameKey, p.id));
  body.appendChild(det);
  return wrap;
}

function viewMine(){
  const wrap = el(`<div class="stack"></div>`);
  if(!S.core || !S.core.players.length){
    wrap.appendChild(el(`<div class="empty">L'organizzatore non ha ancora caricato i partecipanti. Torna più tardi.</div>`));
    return wrap;
  }
  wrap.appendChild(el(`<div class="banner">Giornata <strong class="mono">${S.core.round}</strong> di ${SEASON_ROUNDS}. Ogni minigioco ha le sue squadre disponibili: puoi scegliere la stessa squadra in più minigiochi.${S.core.deadline ? ` Termine: <strong class="mono">${fmtDate(S.core.deadline)}</strong>.` : ''}</div>`));
  const grid = el(`<div class="games-grid"></div>`);
  GAMES.forEach(g => grid.appendChild(myPanel(g.key)));
  wrap.appendChild(grid);
  return wrap;
}

/* =========================================================================
   13. SCHERMATA — richieste (organizzatore), un pannello per minigioco
   ========================================================================= */
async function pickForModal(gameKey, p){
  return new Promise(resolve => {
    const ov = el(`<div class="overlay"></div>`);
    const box = el(`
      <div class="modal" style="width:min(620px,100%);">
        <h3>${esc(G(gameKey).short)} — pronostico per ${esc(p.name)}</h3>
        <p>Scegli tu la squadra: viene registrata subito come approvata.</p>
        <div class="btn-row" style="justify-content:flex-end;"><button class="btn btn-ghost" data-x>Annulla</button></div>
      </div>`);
    const picker = teamPickerFor(gameKey, p, S.reqs[gameKey]?.[p.id]?.teamId, id => { ov.remove(); resolve(id); });
    picker.style.marginBottom = '14px';
    box.insertBefore(picker, box.querySelector('.btn-row'));
    ov.appendChild(box); document.body.appendChild(ov);
    box.querySelector('[data-x]').onclick = () => { ov.remove(); resolve(null); };
    ov.onclick = e => { if(e.target === ov){ ov.remove(); resolve(null); } };
  });
}

function requestsPanel(gameKey){
  const g = G(gameKey);
  const alive = aliveIn(gameKey);
  const pending = pendingIn(gameKey);
  const missing = missingIn(gameKey);
  const out = (S.core.players || []).filter(p => gstate(gameKey, p.id).eliminated);
  const absentNow = out.filter(p => gstate(gameKey, p.id).eliminatedRound === S.core.round && gstate(gameKey, p.id).eliminatedReason === 'assente');

  const panel = el(`
    <div class="panel">
      <div class="panel-head">
        <div><span class="eyebrow">giornate ${g.first}–${g.last}</span><h2>${esc(g.name)}</h2></div>
        <div class="btn-row">
          ${pending.length ? `<button class="btn btn-sm btn-ok" data-all>Approva tutte (${pending.length})</button>` : ''}
          ${missing.length && g.kind === 'lms' ? `<button class="btn btn-sm btn-ko" data-abs>Elimina i ${missing.length} assenti</button>` : ''}
          ${missing.length ? `<button class="btn btn-sm btn-ghost" data-copy>Promemoria</button>` : ''}
        </div>
      </div>
      <div class="panel-body"><div class="board"></div></div>
    </div>`);
  const board = panel.querySelector('.board');

  if(!gameOpen(gameKey)){
    board.appendChild(el(`<div class="empty">${
      S.core.round < g.first ? 'Comincia alla giornata ' + g.first + '.' :
      gmeta(gameKey)?.phase === 'finished' ? 'Minigioco concluso.' : 'Non in corso.'}</div>`));
    return panel;
  }

  alive.forEach(p => {
    const req = S.reqs[gameKey]?.[p.id];
    const state = req ? req.status : 'missing';
    const t = req ? team(req.teamId) : null;
    const row = el(`
      <div class="req ${state}">
        <div>
          <div class="p-name">${esc(p.name)}</div>
          <div class="p-sub">${req ? 'inviato ' + fmtDate(req.sentAt) : 'nessuna richiesta'}</div>
        </div>
        <div>${req
          ? `<div class="p-team"><span class="dot" style="background:${t.color}"></span>${esc(t.name)}</div>
             ${req.note ? `<div class="p-sub">nota: ${esc(req.note)}</div>` : ''}`
          : `<span class="tag mute">in attesa di risposta</span>`}</div>
        <div class="p-actions"></div>
      </div>`);
    const acts = row.querySelector('.p-actions');
    if(state === 'pending'){
      const ok = el(`<button class="btn btn-sm btn-ok">Approva</button>`);
      ok.onclick = async () => { await decidePick(gameKey, p.id, 'approved'); toast('Approvato: ' + p.name + ' → ' + t.name, 'ok'); render(); };
      const ko = el(`<button class="btn btn-sm btn-ko">Respingi</button>`);
      ko.onclick = async () => {
        const note = await modal({ title:'Respingi il pronostico', message:'Scrivi il motivo: ' + p.name + ' lo vedrà e potrà rifare la scelta.', input:'text', placeholder:'es. squadra non più disponibile', confirmText:'Respingi' });
        if(note === null) return;
        await decidePick(gameKey, p.id, 'rejected', note); toast('Richiesta respinta.', ''); render();
      };
      acts.append(ok, ko);
    } else if(state === 'approved'){
      acts.appendChild(el(`<span class="tag ok">registrato</span>`));
      const undo = el(`<button class="btn btn-sm btn-ghost">Annulla</button>`);
      undo.onclick = async () => { await decidePick(gameKey, p.id, 'pending'); render(); };
      acts.appendChild(undo);
    } else {
      acts.appendChild(el(`<span class="tag ${state === 'rejected' ? 'ko' : 'mute'}">${state === 'rejected' ? 'respinto' : 'manca'}</span>`));
    }
    const set = el(`<button class="btn btn-sm btn-ghost">Scegli tu</button>`);
    set.onclick = async () => {
      const tid = await pickForModal(gameKey, p);
      if(!tid) return;
      try{ await submitPick(gameKey, p.id, tid, true); toast(p.name + ' → ' + team(tid).name, 'ok'); render(); }
      catch(e){ toast(e.message, 'err'); }
    };
    acts.appendChild(set);
    board.appendChild(row);
  });

  if(absentNow.length){
    board.appendChild(el(`<div class="sub-head">Eliminati per assenza in questa giornata — ancora ripescabili</div>`));
    absentNow.forEach(p => {
      const row = el(`<div class="req missing"><div class="p-name">${esc(p.name)}</div>
        <div><span class="tag ko">eliminato per assenza</span></div>
        <div class="p-actions"><button class="btn btn-sm btn-ghost">Ripesca</button></div></div>`);
      row.querySelector('button').onclick = () => readmit(gameKey, p.id);
      board.appendChild(row);
    });
  }
  if(!alive.length) board.appendChild(el(`<div class="empty">Nessun partecipante ancora in gioco.</div>`));

  const all = panel.querySelector('[data-all]');
  if(all) all.onclick = async () => { all.disabled = true; for(const p of pending) await decidePick(gameKey, p.id, 'approved'); toast(pending.length + ' approvati.', 'ok'); render(); };
  const abs = panel.querySelector('[data-abs]');
  if(abs) abs.onclick = () => eliminateAbsent(gameKey);
  const cp = panel.querySelector('[data-copy]');
  if(cp) cp.onclick = () => copyText(`${g.name} — giornata ${S.core.round}\nManca il pronostico di: ${missing.map(p => p.name).join(', ')}.` +
    (S.core.deadline ? `\nTermine: ${fmtDate(S.core.deadline)}.` : ''));
  return panel;
}

function viewRequests(){
  const wrap = el(`<div class="stack"></div>`);
  const ctl = el(`
    <div class="panel">
      <div class="panel-head"><div><span class="eyebrow">giornata ${S.core.round} / ${SEASON_ROUNDS}</span><h2>Regole d'invio</h2></div></div>
      <div class="panel-body">
        <p class="note">Il termine e l'approvazione automatica valgono per tutti i minigiochi in corso.</p>
        <div class="form-grid">
          <label class="field"><span>Termine per l'invio</span><input type="datetime-local" id="dl" value="${toInputDT(S.core.deadline)}"></label>
          <div style="display:flex; align-items:flex-end; gap:8px;">
            <button class="btn btn-ghost" id="dl-save">Salva</button>
            <button class="btn btn-ghost" id="dl-clear">Togli</button>
          </div>
        </div>
        <label class="checkline"><input type="checkbox" id="auto" ${S.core.autoApprove ? 'checked' : ''}>
          <span>Approva da solo i pronostici validi, in tutti i minigiochi.</span></label>
      </div>

/* =========================================================================
   14. SCHERMATA — esiti condivisi e chiusura della giornata
   ========================================================================= */
function viewResults(){
  const wrap = el(`<div class="stack"></div>`);
  const picked = pickedTeamsThisRound();

  wrap.appendChild(el(`<div class="banner">L'esito di ogni squadra si segna <strong>una volta sola</strong> e vale per tutti i minigiochi: se il Milan vince, la vittoria va sia a chi l'ha scelto in Last Man Standing sia a chi l'ha scelto in WhoWin?.</div>`));

  const panel = el(`
    <div class="panel">
      <div class="panel-head"><div><span class="eyebrow">giornata ${S.core.round} / ${SEASON_ROUNDS}</span><h2>Esito delle squadre</h2></div>
        <span class="eyebrow">${picked.size} squadre pronosticate</span></div>
      <div class="panel-body"><div class="board"></div></div>
    </div>`);
  const board = panel.querySelector('.board');

  if(!picked.size){
    board.appendChild(el(`<div class="empty">Nessun pronostico approvato per questa giornata.</div>`));
  } else {
    [...picked.entries()].sort((a,b) => team(a[0]).name.localeCompare(team(b[0]).name)).forEach(([tid, uses]) => {
      const t = team(tid), cur = S.results[tid];
      const byGame = {};
      uses.forEach(u => { (byGame[u.gameKey] = byGame[u.gameKey] || []).push(player(u.playerId)?.name || '?'); });
      const row = el(`
        <div class="req ${cur === 'win' ? 'approved' : cur === 'lose' ? 'rejected' : 'pending'}">
          <div class="p-team"><span class="dot" style="background:${t.color}"></span><strong>${esc(t.name)}</strong></div>
          <div class="p-sub">${Object.entries(byGame).map(([k,names]) =>
            `<span class="tag mute">${esc(G(k).short)}</span> ${esc(names.join(', '))}`).join('<br>')}</div>
          <div class="p-actions">
            <button class="btn btn-sm btn-ok ${cur === 'win' ? 'on' : ''}" data-r="win">Ha vinto</button>
            <button class="btn btn-sm btn-ko ${cur === 'lose' ? 'on' : ''}" data-r="lose">Non ha vinto</button>
          </div>
        </div>`);
      row.querySelectorAll('[data-r]').forEach(b => b.onclick = async () => {
        b.disabled = true;
        try{ await setTeamResult(tid, b.dataset.r); render(); }
        catch(e){ toast('Salvataggio non riuscito.', 'err'); b.disabled = false; }
      });
      board.appendChild(row);
    });
  }
  wrap.appendChild(panel);

  const ready = openGames().length && allResultsIn();
  const summary = closeSummary();
  const close = el(`
    <div class="panel"><div class="panel-body" style="display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;">

          ? summary.map(r => `${esc(r.g.short)}: ${r.withPick}/${r.alive} pronostici` + (r.noPick.length ? ` — ${r.noPick.length} senza` : '')).join(' · ')

      </div>
      <button class="btn btn-primary" id="close-r" ${ready ? '' : 'disabled'}>Chiudi la giornata</button>
    </div></div>`);
  close.querySelector('#close-r').onclick = closeGiornata;
  wrap.appendChild(close);

  const lastRound = Math.max(...GAMES.map(g => { const h = gmeta(g.key)?.history || []; return h.length ? h[h.length-1].round : 0; }), 0);
  if(lastRound){
    const back = el(`
      <div class="panel"><div class="panel-body" style="display:flex; justify-content:space-between; gap:14px; align-items:center; flex-wrap:wrap;">
        <div><h2 style="font-size:1rem;">Riapri l'ultima giornata</h2>

}

function viewBoard(){
  const wrap = el(`<div class="stack"></div>`);
  if(!GAMES.some(g => gmeta(g.key))){
    wrap.appendChild(el(`<div class="empty">Nessun minigioco avviato.</div>`));
    return wrap;
  }
  const sw = el(`<div class="switcher"></div>`);
  GAMES.forEach(g => {
    const b = el(`<button class="${S.boardGame === g.key ? 'on' : ''}">${esc(g.short)}</button>`);
    b.onclick = () => { S.boardGame = g.key; render(); };
    sw.appendChild(b);
  });
  wrap.appendChild(sw);

  const key = S.boardGame, g = G(key), m = gmeta(key);
  if(!m){ wrap.appendChild(el(`<div class="empty">Minigioco non ancora avviato.</div>`)); return wrap; }

  const rows = (S.core.players || []).map(p => {
    const st = gstate(key, p.id);
    return { p, wins: winsIn(key, p.id), played: playedIn(key, p.id),
             used: (st.used || []).length, eliminated: st.eliminated, elimRound: st.eliminatedRound };
  });
  const dir = S.boardDir === 'asc' ? 1 : -1;
  const sorters = {
    wins:   (a,b) => (a.wins - b.wins) * dir || a.p.name.localeCompare(b.p.name),
    played: (a,b) => (a.played - b.played) * dir || a.p.name.localeCompare(b.p.name),
    name:   (a,b) => a.p.name.localeCompare(b.p.name) * dir,
    status: (a,b) => ((a.eliminated ? 1 : 0) - (b.eliminated ? 1 : 0)) * dir || b.wins - a.wins
  };
  rows.sort(sorters[S.boardSort] || sorters.wins);
  const best = Math.max(1, ...rows.map(r => r.wins));
  const me = myPlayer();

  const panel = el(`
    <div class="panel">
      <div class="panel-head">
        <div><span class="eyebrow">${g.kind === 'season' ? 'vittorie in stagione' : 'giornate superate'}</span><h2>Classifica — ${esc(g.short)}</h2></div>
        <span class="eyebrow">giornata ${S.core.round} / ${SEASON_ROUNDS}${m.phase === 'finished' ? ' · conclusa' : ''}</span>
      </div>
      <div class="panel-body" style="padding:0;">
        <div class="table-scroll"><table class="board-table">
          <thead><tr>
            <th style="width:38px;">#</th>
            <th data-s="name" class="sortable">Partecipante</th>
            <th data-s="wins" class="sortable num">Vittorie</th>
            <th data-s="played" class="sortable num">Giornate</th>
            ${g.kind === 'lms' ? `<th data-s="status" class="sortable" style="text-align:right;">Stato</th>` : ''}
          </tr></thead>
          <tbody></tbody>
        </table></div>
        <p class="note" style="padding:10px 16px 14px; margin:0;">Tocca l'intestazione di una colonna per riordinare, tocca una riga per vedere giornata per giornata.</p>
      </div>
    </div>`);
  panel.querySelectorAll('.sortable').forEach(th => {
    if(th.dataset.s === S.boardSort) th.classList.add('on', S.boardDir);
    th.onclick = () => {
      if(S.boardSort === th.dataset.s) S.boardDir = S.boardDir === 'desc' ? 'asc' : 'desc';
      else { S.boardSort = th.dataset.s; S.boardDir = th.dataset.s === 'name' ? 'asc' : 'desc'; }
      render();
    };
  });

  const tb = panel.querySelector('tbody');
  if(!rows.length) tb.appendChild(el(`<tr><td colspan="5" class="note" style="padding:14px;">Nessun partecipante.</td></tr>`));
  rows.forEach((r,i) => {
    const isMe = me && r.p.id === me.id;
    const open = !!S.boardOpen[key + ':' + r.p.id];
    const tr = el(`
      <tr class="rank-row ${isMe ? 'me' : ''} ${r.eliminated ? 'out' : ''} ${open ? 'open' : ''}">
        <td class="mono">${i+1}</td>
        <td><strong>${esc(r.p.name)}</strong>${isMe ? ' <span class="tag mute">tu</span>' : ''}
            <div class="bar"><span style="width:${Math.round(r.wins / best * 100)}%"></span></div></td>
        <td class="num wins">${r.wins}</td>
        <td class="num">${r.played}</td>
        ${g.kind === 'lms' ? `<td style="text-align:right;">${r.eliminated
          ? `<span class="tag ko">fuori G${r.elimRound}</span>`
          : `<span class="tag ok">in gioco</span>`}</td>` : ''}
      </tr>`);
    tr.onclick = () => { S.boardOpen[key + ':' + r.p.id] = !open; render(); };
    tb.appendChild(tr);
    if(open){
      const det = el(`<tr class="rank-detail"><td colspan="${g.kind === 'lms' ? 5 : 4}"></td></tr>`);
      det.querySelector('td').appendChild(historyTable(key, r.p.id));
      tb.appendChild(det);
    }
  });
  wrap.appendChild(panel);
  return wrap;
}

function fixturesListEl(round, editable){
  const list = matchesForRound(round);
  const box = el(`<div class="fixtures-list"></div>`);
  if(!list.length){
    box.appendChild(el(`<div class="empty">Nessuna partita caricata per questa giornata.</div>`));
  } else {
    list.forEach((m,i) => {
      const h = teamByName(m.home), a = teamByName(m.away);
      const rh = round === S.core.round ? S.results[h.id] : null;
      const ra = round === S.core.round ? S.results[a.id] : null;
      const esito = rh === 'win' ? `${esc(m.home)} ha vinto` : ra === 'win' ? `${esc(m.away)} ha vinto` : (rh || ra) ? 'nessuna delle due ha vinto' : null;
      const row = el(`
        <div class="fixture-row">
          <span class="fx-team"><span class="dot" style="background:${h.color}"></span>${esc(m.home)}</span>
          <span class="fx-vs">vs</span>
          <span class="fx-team"><span class="dot" style="background:${a.color}"></span>${esc(m.away)}</span>
          ${m.date ? `<span class="fx-date mono">${esc(m.date)}</span>` : ''}
          ${esito ? `<span class="tag ok">${esc(esito)}</span>` : ''}
          ${editable ? `<button class="btn btn-sm btn-ghost fx-rm">Rimuovi</button>` : ''}
        </div>`);
      if(editable){
        row.querySelector('.fx-rm').onclick = async () => {
          const idx = S.core.calendar.findIndex(x => x === m);
          if(idx >= 0) S.core.calendar.splice(idx, 1);
          await saveCore(); render();
        };
      }
      box.appendChild(row);
    });
  }
  return box;
}

        <div class="panel-head"><h2>Aggiungi una partita alla giornata ${shown}</h2></div>

          <div class="form-grid">
            <label class="field"><span>Squadra in casa</span>
              <select id="fx-home"><option value="">Scegli…</option>${S.core.teams.map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('')}</select>
            </label>
            <label class="field"><span>Squadra in trasferta</span>
              <select id="fx-away"><option value="">Scegli…</option>${S.core.teams.map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('')}</select>
            </label>
          </div>
          <label class="field"><span>Data/ora (opzionale)</span><input type="text" id="fx-date" placeholder="es. 23/08 15:00"></label>
          <button class="btn btn-primary" id="fx-add">Aggiungi partita</button>
          <p class="note-dim" style="margin-top:10px;">Più comodo per tutta la stagione: importa un foglio "Calendario" dal file Excel (colonne Giornata, Casa, Trasferta, Data) dalla scheda File Excel.</p>

function viewPlayers(){
  const wrap = el(`<div class="stack"></div>`);

  const add = el(`
    <div class="panel">
      <div class="panel-head"><h2>Aggiungi un partecipante</h2></div>
      <div class="panel-body">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <input type="text" id="np" placeholder="Nome e cognome" style="flex:1; min-width:200px;">
          <button class="btn btn-primary" id="np-go">Aggiungi</button>
        </div>
        <p class="note-dim" style="margin-top:10px;">Entra subito in tutti e tre i minigiochi, da questa giornata in poi.</p>
      </div>
    </div>`);
  const doAdd = async () => {
    const name = add.querySelector('#np').value.trim();
    if(!name) return;
    if(!S.core) S.core = emptyCore();
    let id = 'p-' + slug(name), n = 2;
    while(player(id)) id = 'p-' + slug(name) + '-' + (n++);
    S.core.players.push({ id, name });
    await saveCore();
    for(const g of GAMES){
      if(!S.games[g.key]) S.games[g.key] = emptyGame();
      gstate(g.key, id);
      await saveGame(g.key);
    }
    add.querySelector('#np').value = '';
    toast(name + ' aggiunto.', 'ok'); render();
  };
  add.querySelector('#np-go').onclick = doAdd;
  add.querySelector('#np').onkeydown = e => { if(e.key === 'Enter') doAdd(); };
  wrap.appendChild(add);

  const withUser = (S.core?.players || []).filter(p => S.claims[p.id]);
  const without  = (S.core?.players || []).filter(p => !S.claims[p.id]);

  const bulk = el(`
    <div class="panel">
      <div class="panel-head"><h2>Accessi</h2>
        <div class="btn-row">
          ${without.length ? `<button class="btn btn-sm btn-primary" id="mk">Crea i ${without.length} accessi mancanti</button>` : ''}
          ${withUser.length ? `<button class="btn btn-sm btn-ghost" id="show">${S.showCodes ? 'Nascondi' : 'Mostra'} i codici</button>
                               <button class="btn btn-sm btn-ghost" id="cpall">Copia elenco</button>` : ''}
        </div>
      </div>
      <div class="panel-body" style="padding:0;"><div class="table-scroll"><table>
        <thead><tr><th>Partecipante</th><th>Nome utente</th><th>Codice</th><th style="text-align:right;">Azioni</th></tr></thead>
        <tbody></tbody></table></div></div>
    </div>`);
  const tb = bulk.querySelector('tbody');
  (S.core?.players || []).forEach(p => {
    const uname = S.claims[p.id];
    const u = uname ? S.users.find(x => x.username === uname) : null;
    const tr = el(`
      <tr>
        <td><strong>${esc(p.name)}</strong></td>
        <td class="mono">${uname ? esc(uname) : '<span class="tag mute">nessun accesso</span>'}</td>
        <td class="mono">${u ? (S.showCodes ? esc(u.password || '—') : '••••••') : '—'}</td>
        <td style="text-align:right;"><div class="btn-row" style="justify-content:flex-end;"></div></td>
      </tr>`);
    const acts = tr.querySelector('.btn-row');
    if(u){
      const cp = el(`<button class="btn btn-sm btn-ghost">Copia</button>`);
      cp.onclick = () => copyText(`${p.name}\nSito: ${location.href}\nNome utente: ${u.username}\nCodice: ${u.password}`);
      const ch = el(`<button class="btn btn-sm btn-ghost">Cambia codice</button>`);
      ch.onclick = async () => {
        const np = await modal({ title:'Nuovo codice per ' + p.name, input:'text', prefill: generateCode(), confirmText:'Salva' });
        if(!np) return;
        try{ await changePassword(u.username, np); await loadUsers(); toast('Codice aggiornato.', 'ok'); render(); }
        catch(e){ toast(e.message, 'err'); }
      };
      acts.append(cp, ch);
    } else {
      const mk = el(`<button class="btn btn-sm btn-primary">Crea accesso</button>`);
      mk.onclick = async () => {
        const code = generateCode();
        try{
          await createUser({ username: p.id.replace(/^p-/,''), password: code, role:'player', playerId: p.id, displayName: p.name });
          await loadUsers(); await loadClaims();
          toast('Accesso creato per ' + p.name + '.', 'ok'); render();
        }catch(e){ toast(e.message, 'err'); }
      };
      acts.appendChild(mk);
    }
    const rm = el(`<button class="btn btn-sm btn-ko">Rimuovi</button>`);
    rm.onclick = async () => {
      if(!await confirmBox('Rimuovo ' + p.name + ' da tutti e tre i minigiochi? Lo storico di questo partecipante andrà perso.')) return;
      S.core.players = S.core.players.filter(x => x.id !== p.id);
      await saveCore();
      for(const g of GAMES){
        const m = gmeta(g.key); if(!m) continue;
        delete m.st[p.id];
        m.history.forEach(h => { h.entries = h.entries.filter(e => e.playerId !== p.id); });
        await saveGame(g.key);
      }
      await Store.del(K.claim(p.id));
      toast(p.name + ' rimosso.', ''); render();
    };
    acts.appendChild(rm);
    tb.appendChild(tr);
  });

  const mk = bulk.querySelector('#mk');
  if(mk) mk.onclick = async () => {
    mk.disabled = true;
    const lines = [];
    for(const p of without){
      const code = generateCode();
      try{
        await createUser({ username: p.id.replace(/^p-/,''), password: code, role:'player', playerId: p.id, displayName: p.name });
        lines.push(`${p.name} — utente: ${p.id.replace(/^p-/,'')} — codice: ${code}`);
      }catch(e){}
    }
    await loadUsers(); await loadClaims();
    if(lines.length) copyText(`FantaList — accessi al minigioco\nSito: ${location.href}\n\n` + lines.join('\n'));
    toast(lines.length + ' accessi creati e copiati negli appunti.', 'ok');
    render();
  };
  const sh = bulk.querySelector('#show');
  if(sh) sh.onclick = () => { S.showCodes = !S.showCodes; render(); };
  const cpall = bulk.querySelector('#cpall');
  if(cpall) cpall.onclick = () => {
    const lines = (S.core?.players || []).map(p => {
      const u = S.users.find(x => x.username === S.claims[p.id]);
      return u ? `${p.name} — utente: ${u.username} — codice: ${u.password}` : null;
    }).filter(Boolean);
    copyText(`FantaList — accessi al minigioco\nSito: ${location.href}\n\n` + lines.join('\n'));
  };
  wrap.appendChild(bulk);
  return wrap;
}

function viewHelp(){
  const wrap = el(`<div class="stack"></div>`);

  wrap.appendChild(el(`
    <div class="panel"><div class="panel-body">
      <span class="eyebrow">come funziona la lega</span>
      <h2 style="font-size:1.6rem; margin:4px 0 10px;">Regolamento e guida al sito</h2>
      <p class="note">Tre minigiochi paralleli, tutti sulle stesse 20 squadre di Serie A: due <strong>Last Man Standing</strong> a eliminazione (andata e ritorno) e un <strong>WhoWin?</strong> che copre l'intera stagione. Puoi partecipare a tutti e tre insieme: le squadre disponibili sono indipendenti da un minigioco all'altro.</p>
    </div></div>`));

  /* ---- REGOLAMENTO ---- */
  const reg = el(`<div class="panel"><div class="panel-head"><h2>Regolamento</h2></div><div class="panel-body"></div></div>`);
  const rb = reg.querySelector('.panel-body');

  rb.appendChild(ruleItem('meccanica comune', 'Come funzionano gli esiti', `
    <p>Ogni giornata, l'organizzatore segna l'esito di ogni squadra pronosticata <strong>una volta sola</strong>: "ha vinto" oppure "non ha vinto" (che vale anche in caso di pareggio). Quell'esito conta per <strong>tutti</strong> i minigiochi in cui quella squadra è stata scelta — se il Milan vince, la vittoria va sia a chi l'ha giocato in Last Man Standing sia a chi l'ha giocato in WhoWin?.</p>
    <p>La giornata si chiude tutta insieme, per tutti i minigiochi ancora in corso: quando l'organizzatore ha gli esiti di tutte le squadre pronosticate, un solo pulsante fa avanzare la lega alla giornata successiva.</p>`, true));

  rb.appendChild(ruleItem('giornate 1–19', 'Last Man Standing — Andata', `
    <p>Ogni giornata scegli <strong>una squadra</strong> tra le 20 di Serie A.</p>
    <ul>
      <li>Ogni squadra si può usare <strong>una sola volta</strong> in tutto il girone di andata.</li>
      <li>Se la squadra che hai scelto non vince, sei <strong>eliminato</strong>.</li>
      <li>Se non mandi il pronostico entro il termine, l'organizzatore può eliminarti per assenza — ma resti ripescabile finché non chiude la giornata.</li>
      <li>Si va avanti così fino a quando resta un solo partecipante, oppure fino alla giornata 19: chi resta in piedi vince. Se l'ultima eliminazione lascia più partecipanti fuori nella stessa giornata, vincono a pari merito.</li>
    </ul>`));

  rb.appendChild(ruleItem('giornate 20–38', 'Last Man Standing — Ritorno', `
    <p>Stesse identiche regole dell'andata, ma è un torneo a sé stante: si riparte da zero, e le squadre già usate nel girone di andata tornano tutte disponibili.</p>
    <p>Si apre da solo quando la lega arriva alla giornata 20, qualsiasi cosa sia successa nell'andata — puoi essere già stato eliminato lì e giocare comunque il ritorno.</p>`));

  rb.appendChild(ruleItem('giornate 1–38', 'WhoWin?', `
    <p>Ogni giornata scegli la squadra che secondo te vince — per l'intera stagione, dalla prima all'ultima giornata.</p>
    <ul>
      <li>Ogni squadra si può scegliere fino a <strong>3 volte</strong> in tutta la stagione, non una sola.</li>
      <li>Non c'è eliminazione: continui a giocare comunque vada, fino alla giornata 38.</li>
      <li>La classifica si basa sul <strong>numero totale di vittorie</strong> indovinate durante l'anno — la trovi nella scheda Classifiche.</li>
    </ul>`));

  rb.appendChild(ruleItem('per tutti', 'Termine di invio e approvazione', `
    <p>L'organizzatore può fissare un <strong>termine unico</strong> per l'invio, valido per tutti i minigiochi in corso: dopo la scadenza non si può più mandare né cambiare un pronostico.</p>
    <p>Ogni pronostico va confermato dall'organizzatore prima di contare (a meno che non abbia attivato l'approvazione automatica). Finché è "in attesa" puoi ancora cambiare scelta; se viene respinto, ne scegli un'altra.</p>`));

  wrap.appendChild(reg);

  /* ---- GUIDA PER I PARTECIPANTI ---- */
  const guide = el(`<div class="panel"><div class="panel-head"><h2>Guida — per chi partecipa</h2></div><div class="panel-body"></div></div>`);
  const gb = guide.querySelector('.panel-body');

  gb.appendChild(ruleItem(null, 'Accedere al sito', `
    <div class="step"><span class="n">1</span><p>Il tuo nome utente è il tuo nome come registrato dall'organizzatore (es. "Peppe Verbaro" → <span class="mono">peppe-verbaro</span>) — puoi scriverlo anche con maiuscole e spazi, il sito lo capisce comunque.</p></div>
    <div class="step"><span class="n">2</span><p>Il codice di accesso te lo dà l'organizzatore. Se lo dimentichi, chiediglielo: lui lo vede sempre.</p></div>
    <div class="step"><span class="n">3</span><p>Il pulsante in alto a destra è cliccabile: da sloggato porta al modulo di accesso, da loggato ti fa uscire.</p></div>`));

  gb.appendChild(ruleItem(null, 'Inviare un pronostico', `
    <p>Nella scheda <strong>"I miei pronostici"</strong> trovi una schedina per ciascun minigioco a cui partecipi, affiancate. Ognuna ha le sue squadre disponibili e il proprio stato — puoi scegliere la stessa squadra in minigiochi diversi.</p>
    <div class="step"><span class="n">1</span><p>Guarda le partite di Serie A di quella giornata, mostrate in cima alla schedina.</p></div>
    <div class="step"><span class="n">2</span><p>Tocca la squadra su cui punti: quelle sbarrate o disabilitate le hai già usate (o esaurite, in WhoWin? dopo 3 scelte).</p></div>
    <div class="step"><span class="n">3</span><p>Premi "Invia il pronostico". Finché non è approvato puoi ancora cambiarlo.</p></div>`));

  gb.appendChild(ruleItem(null, 'Calendario, classifiche e storico', `
    <p>La scheda <strong>Calendario</strong> mostra le partite di Serie A di ogni giornata, con l'esito se già segnato.</p>
    <p>La scheda <strong>Classifiche</strong> ha un selettore per passare da un minigioco all'altro: nei Last Man Standing vedi chi è ancora in gioco, in WhoWin? l'ordine per vittorie totali. Tocca l'intestazione di una colonna per riordinare, tocca una riga per vedere il tuo percorso giornata per giornata.</p>
    <p>Da <strong>Impostazioni</strong> puoi cambiare il tuo codice di accesso in qualsiasi momento.</p>`));

  wrap.appendChild(guide);

  /* ---- GUIDA PER L'ORGANIZZATORE ---- */
  if(isAdmin()){
    const admin = el(`<div class="panel"><div class="panel-head"><h2>Guida — per l'organizzatore</h2></div><div class="panel-body"></div></div>`);
    const ab = admin.querySelector('.panel-body');

    ab.appendChild(ruleItem(null, 'Avviare i minigiochi', `
      <p>Dalla scheda <strong>File Excel</strong> carichi il file della lega: da lì escono partecipanti, squadre e le giornate già giocate di tutti e tre i minigiochi in un colpo solo. I fogli riconosciuti sono quelli il cui nome contiene "LastManStanding", "Ritorno" o "Stagionale" — quelli mancanti vengono creati automaticamente al primo download.</p>
      <p>Il <strong>Calendario</strong> delle partite di Serie A è un file a parte, con le colonne Giornata, Casa, Trasferta e, se vuoi, Risultato: se compili il risultato di una partita della giornata in corso, l'esito delle due squadre si segna da solo, senza doverlo rifare a mano.</p>`));

    ab.appendChild(ruleItem(null, 'Gestire le richieste', `
      <p>Nella scheda <strong>Richieste</strong> vedi un pannello per ciascun minigioco: chi ha inviato, chi manca, chi è in attesa di approvazione. Puoi approvare tutte insieme, respingere con una nota, o scegliere tu la squadra al posto di qualcuno che scrive in chat.</p>
      <p>Puoi fissare un <strong>termine di invio</strong> valido per tutti i minigiochi in corso, e attivare l'approvazione automatica se non vuoi controllare ogni pronostico uno per uno. Dopo la scadenza, per i Last Man Standing compare un pulsante per eliminare chi non ha risposto — resta ripescabile finché non chiudi la giornata.</p>`));

    ab.appendChild(ruleItem(null, 'Segnare gli esiti e chiudere la giornata', `
      <p>Nella scheda <strong>Esiti</strong> trovi l'elenco delle squadre pronosticate quella giornata, con sotto chi le ha scelte e in quale minigioco. Segni "ha vinto" una volta sola per squadra — vale per tutti i minigiochi coinvolti.</p>
      <p>Quando tutte le squadre hanno un esito, il pulsante "Chiudi la giornata" diventa attivo: chiudendola, la lega passa alla giornata successiva per tutti i minigiochi in corso insieme. Se sbagli, "Riapri l'ultima giornata" annulla la chiusura.</p>`));

    ab.appendChild(ruleItem(null, 'Partecipanti, accessi e azzeramenti', `
      <p>Dalla scheda <strong>Partecipanti</strong> aggiungi o rimuovi qualcuno (entra subito in tutti e tre i minigiochi), crei gli accessi in blocco o singolarmente, e vedi/copi i codici.</p>
      <p>Da <strong>Impostazioni</strong> puoi azzerare un solo minigioco, solo i risultati (tenendo partecipanti e accessi), oppure tutto — sempre con una parola di conferma da scrivere, per evitare azzeramenti per sbaglio.</p>`));

    wrap.appendChild(admin);
  }

  return wrap;
}

/* =========================================================================
   18. SCHERMATA — impostazioni
   ========================================================================= */
function viewSettings(){
  const wrap = el(`<div class="stack"></div>`);
  const me = S.me;

  const acc = el(`
    <div class="panel">
      <div class="panel-head"><h2>Il tuo accesso</h2><span class="eyebrow">${esc(me.role === 'admin' ? 'organizzatore' : 'partecipante')}</span></div>
      <div class="panel-body">
        <p class="note">Nome utente <span class="mono">${esc(me.username)}</span>.</p>
        <div class="btn-row">
          <button class="btn btn-ghost" id="chg">Cambia il mio codice</button>
          <button class="btn btn-ghost" id="out">Esci</button>
        </div>
      </div>
    </div>`);
  acc.querySelector('#chg').onclick = async () => {
    const np = await modal({ title:'Nuovo codice di accesso', message:'Almeno 6 caratteri.', input:'password', confirmText:'Salva' });
    if(!np) return;
    try{ await changePassword(me.username, np); toast('Codice aggiornato.', 'ok'); }
    catch(e){ toast(e.message, 'err'); }
  };
  acc.querySelector('#out').onclick = logout;
  wrap.appendChild(acc);

  const sb = el(`<div>${storageBanner()}</div>`);
  if(sb.firstElementChild){ wireStorageBanner(sb); wrap.appendChild(sb); }

  if(!isAdmin()) return wrap;

  const zone = el(`
    <div class="panel" style="border-color:rgba(242,99,95,0.4);">
      <div class="panel-head"><h2 style="color:var(--ko);">Azzeramenti</h2></div>
      <div class="panel-body">
        <p class="note">Puoi azzerare un solo minigioco, oppure tutto insieme. Gli account dei partecipanti restano sempre.</p>
        <div class="reset-list"></div>
      </div>
    </div>`);
  const list = zone.querySelector('.reset-list');
  GAMES.forEach(g => {
    const m = gmeta(g.key);
    const done = m ? m.history.length : 0;
    const row = el(`
      <div class="reset-row">
        <div><strong>${esc(g.name)}</strong>
          <div class="p-sub">${done ? done + ' giornate chiuse' : 'nessuna giornata chiusa'} · giornate ${g.first}–${g.last}</div></div>
        <button class="btn btn-sm btn-ko" ${m ? '' : 'disabled'}>Azzera</button>
      </div>`);
    row.querySelector('button').onclick = () => wipeGame(g.key);
    list.appendChild(row);
  });
  const rowRes = el(`
    <div class="reset-row">
      <div><strong>Solo i risultati</strong>
        <div class="p-sub">Cancella storico ed esiti di tutti e tre, ma tiene partecipanti, accessi e file. Si riparte dalla giornata 1.</div></div>
      <button class="btn btn-sm btn-ko">Azzera i risultati</button>
    </div>`);
  rowRes.querySelector('button').onclick = wipeResultsOnly;
  list.appendChild(rowRes);

  const rowAll = el(`
    <div class="reset-row danger">
      <div><strong>Tutto</strong>
        <div class="p-sub">Cancella anche partecipanti e file collegato: il sito torna come appena installato.</div></div>
      <button class="btn btn-sm btn-ko">Azzera tutto</button>
    </div>`);
  rowAll.querySelector('button').onclick = wipeAll;
  list.appendChild(rowAll);
  wrap.appendChild(zone);
  return wrap;
}

/* =========================================================================
   19. RENDER PRINCIPALE
   ========================================================================= */
function renderWho(){
  const box = document.getElementById('who');
  box.innerHTML = '';

  if(!S.me){
    const btn = el(`<button class="who-login-btn">Accedi</button>`);
    btn.onclick = () => {
      S.gateTab = 'login';
      render();
      document.getElementById('li-user')?.focus();
    };
    box.appendChild(btn);
    return;
  }

  const btn = el(`
    <button class="who-btn" title="Clicca per uscire">
      <span class="badge-user ${S.me.role === 'admin' ? 'admin' : ''}">${esc(S.me.displayName || S.me.username)} · ${S.me.role === 'admin' ? 'organizzatore' : 'partecipante'}</span>
      <span class="logout-hint">esci ↦</span>
    </button>`);
  btn.onclick = logout;
  box.appendChild(btn);
  if(S.offline) box.appendChild(el(`<span class="who-role" style="color:var(--ko); font-size:0.75rem;">archivio offline</span>`));
}
function tabsFor(){
  if(isAdmin()){
    const t = [{ k:'requests', l:'Richieste', c: totalPending() }, { k:'results', l:'Esiti' },
               { k:'board', l:'Classifiche' }, { k:'calendar', l:'Calendario' }, { k:'players', l:'Partecipanti' },
               { k:'excel', l:'File Excel' }, { k:'help', l:'Regolamento' }, { k:'settings', l:'Impostazioni' }];
    if(myPlayer()) t.unshift({ k:'mine', l:'I miei pronostici' });
    return t;
  }
  return [{ k:'mine', l:'I miei pronostici' }, { k:'board', l:'Classifiche' }, { k:'calendar', l:'Calendario' },
           { k:'help', l:'Regolamento' }, { k:'settings', l:'Impostazioni' }];
}
function render(){
  renderWho();
  const app = document.getElementById('app');
  app.innerHTML = '';
  document.getElementById('foot').textContent =
    'FantaList · 2 Last Man Standing + WhoWin?' + (S.core?.fileName ? ' · ' + S.core.fileName : '') + ' · archivio: ' + Store.mode();

  if(!S.me){ app.appendChild(renderGate()); return; }

  const tabs = tabsFor();
  if(!S.tab || !tabs.find(t => t.k === S.tab)) S.tab = tabs[0].k;
  const bar = el(`<div class="tabs"></div>`);
  tabs.forEach(t => {
    const b = el(`<button class="tab ${S.tab === t.k ? 'on' : ''}">${t.l}${t.c ? `<span class="count">${t.c}</span>` : ''}</button>`);
    b.onclick = () => { S.tab = t.k; render(); };
    bar.appendChild(b);
  });
  app.appendChild(bar);

  const empty = !S.core || !S.core.players.length;
  if(empty && S.tab !== 'settings' && S.tab !== 'calendar' && S.tab !== 'help'){
    const w = el(`<div class="stack"></div>`);
    if(isAdmin()){
      w.appendChild(el(`
        <div class="panel"><div class="panel-body">
          <span class="eyebrow">passo 2 di 2</span>
          <h2 style="font-size:1.5rem; margin:4px 0 8px;">Apri i minigiochi</h2>
          <p class="note">Carica il file Excel della lega: da lì escono partecipanti, squadre e le giornate già giocate di tutti e tre i minigiochi.</p>
        </div></div>`));
      w.appendChild(importPanel(false));
    } else {
      w.appendChild(el(`<div class="empty">L'organizzatore non ha ancora aperto i minigiochi. Torna più tardi.</div>`));
    }
    app.appendChild(w);
    return;
  }

  if(isAdmin() && !empty && S.tab !== 'settings') app.appendChild(scoreboard());

  const views = { mine: viewMine, requests: viewRequests, results: viewResults,
                  board: viewBoard, calendar: viewCalendar, players: viewPlayers, excel: viewExcel, help: viewHelp, settings: viewSettings };
  app.appendChild((views[S.tab] || viewMine)());
}

/* =========================================================================
   20. AVVIO
   ========================================================================= */
async function boot(){
  Store.init();
  try{
    await loadUsers();
    await loadClaims();
    await restoreSession();
    await loadCore();
    await loadGames();
    await loadRound();
  }catch(e){
    S.offline = true;
    toast('Archivio non raggiungibile: ' + e.message, 'err');
  }
  if(!S.core && S.me) { S.core = emptyCore(); }
  render();
  setInterval(async () => {
    const a = document.activeElement;
    if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    if(document.querySelector('.overlay')) return;
    if(S.me) await refresh(true);
  }, 8000);
}
boot();

</script>
