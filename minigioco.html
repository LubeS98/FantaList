<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FantaList — Minigiochi</title>
<meta name="theme-color" content="#0A2A20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minigioco">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Gestione del minigioco della lega: pronostici dei partecipanti, approvazioni e risultati di giornata.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   FANTALIST — MINIGIOCO
   Identità visiva ereditata dal sito "La Lega": verde campo, rosa Gazzetta,
   ambra da tabellone. Anton per i titoli, Work Sans per il testo,
   Space Mono per numeri, orari e codici.
   ========================================================================= */
:root{
  --pitch:oklch(21% 0.025 260);
  --pitch-dark:oklch(14% 0.02 260);
  --pitch-light:oklch(29% 0.03 260);
  --ink:oklch(18% 0.02 258);
  --chalk:oklch(97% 0.008 90);
  --chalk-soft:rgba(245,243,240,0.72);
  --chalk-mute:rgba(245,243,240,0.45);
  --gazzetta:oklch(66% 0.19 35);
  --gazzetta-dark:oklch(56% 0.19 35);
  --amber:oklch(78% 0.13 195);
  --amber-soft:oklch(85% 0.1 195);
  --line:rgba(245,243,240,0.12);
  --line-strong:rgba(245,242,234,0.22);
  --ok:oklch(72% 0.15 150);
  --ko:oklch(62% 0.19 25);
  --radius:14px;
  --radius-sm:8px;
  --radius-pill:999px;
  --shadow-card:0 1px 2px rgba(0,0,0,0.2), 0 12px 32px -12px rgba(0,0,0,0.55);
  --shadow-pop:0 24px 64px -16px rgba(0,0,0,0.6);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(94,200,210,0.08), transparent 60%),
    linear-gradient(180deg, var(--pitch-dark) 0%, var(--pitch) 45%, var(--pitch) 100%);
  background-attachment:fixed;
  color:var(--chalk);
  font-family:'Work Sans',system-ui,sans-serif;
  line-height:1.5;
  min-height:100vh;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,0.02) 0 2px,transparent 2px 64px);
}
.panel,.slip{transition:box-shadow .3s var(--ease), border-color .2s var(--ease);}
h1,h2,h3,.display{font-family:'Anton',sans-serif; text-transform:uppercase; letter-spacing:0.02em; font-weight:400;}
.mono{font-family:'Space Mono',monospace;}
a{color:var(--amber); text-decoration-thickness:1px;}
a:hover{color:var(--amber-soft);}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}

/* ---------- SMARTPHONE ---------- */
@media (max-width:820px){
  input[type=text],input[type=password],input[type=datetime-local],input[type=number],select,textarea{font-size:16px;}
  .btn{padding:13px 20px;}
  .btn-sm{padding:9px 14px; font-size:0.8rem;}
  .team-btn{padding:12px 11px;}
  .btn-link{padding:6px 2px;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  .topbar-inner{padding:12px 16px;}
}
@media (max-width:420px){
  .team-grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));}
}

/* ---------- TOPBAR ---------- */
.topbar{
  position:sticky; top:0; z-index:60;
  background:rgba(8,31,24,0.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,182,39,0.25), 0 12px 30px -18px rgba(0,0,0,0.8);
}
.topbar-inner{
  max-width:1080px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px; font-family:'Anton',sans-serif; font-size:1.25rem; letter-spacing:0.03em;}
.brand .dot{width:10px; height:10px; border-radius:50%; background:var(--gazzetta); box-shadow:0 0 0 4px rgba(232,84,140,0.18), 0 0 14px rgba(232,84,140,0.55);}
.brand small{display:block; font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:0.16em; color:var(--chalk-mute); text-transform:uppercase; margin-top:2px;}
.who{display:flex; align-items:center; gap:10px; font-size:0.85rem;}
.who-btn{
  display:flex; align-items:center; gap:9px; background:transparent; border:none; padding:4px 4px 4px 8px;
  border-radius:var(--radius-pill); cursor:pointer; transition:background .15s var(--ease);
}
.who-btn:hover{background:rgba(245,242,234,0.06);}
.who-btn .who-name{color:var(--chalk); font-weight:600; font-size:0.88rem;}
.who .badge-user{
  font-family:'Space Mono',monospace; font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase;
  background:rgba(255,182,39,0.12); color:var(--amber); border:1px solid rgba(255,182,39,0.35);
  padding:5px 10px; border-radius:var(--radius-pill);
}
.who .badge-user.admin{background:rgba(232,84,140,0.14); color:var(--gazzetta); border-color:rgba(232,84,140,0.4);}
.who-btn .logout-hint{
  font-family:'Space Mono',monospace; font-size:0.62rem; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--chalk-mute); opacity:0; transition:opacity .15s var(--ease);
}
.who-btn:hover .logout-hint{opacity:1;}
.who-login-btn{
  font-family:'Space Mono',monospace; font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase;
  background:var(--gazzetta); color:var(--chalk); border:none; padding:8px 16px; border-radius:var(--radius-pill);
  font-weight:700; box-shadow:0 6px 16px -6px rgba(232,84,140,0.6); transition:filter .15s var(--ease), transform .15s var(--ease);
}
.who-login-btn:hover{filter:brightness(1.08); transform:translateY(-1px);}

/* ---------- LAYOUT ---------- */
.shell{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:28px 20px 96px;}
.stack{display:flex; flex-direction:column; gap:18px;}
.grid-2{display:grid; grid-template-columns:1.15fr 0.85fr; gap:18px; align-items:start;}
@media (max-width:860px){.grid-2{grid-template-columns:1fr;}}

.panel{
  background:linear-gradient(180deg, rgba(245,242,234,0.035), rgba(245,242,234,0.015)), var(--ink);
  border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  box-shadow:var(--shadow-card);
  transition:border-color .2s var(--ease);
}
.panel-head{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:15px 20px; border-bottom:1px solid var(--line); background:rgba(245,242,234,0.03);
}
.panel-head h2{font-size:1.02rem;}
.panel-head .eyebrow{font-family:'Space Mono',monospace; font-size:0.68rem; letter-spacing:0.14em; color:var(--amber); text-transform:uppercase;}
.panel-body{padding:20px;}
.panel-body > * + *{margin-top:14px;}
.note{font-size:0.87rem; color:var(--chalk-soft);}
.note-dim{font-size:0.8rem; color:var(--chalk-mute);}
.empty{
  border:1px dashed var(--line-strong); border-radius:var(--radius); padding:26px 18px; text-align:center;
  color:var(--chalk-mute); font-size:0.88rem;
}

/* ---------- TABS ---------- */
.tabs{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:18px; border-bottom:1px solid var(--line); padding-bottom:10px;}
.tab{
  font-family:'Space Mono',monospace; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase;
  padding:10px 16px; border-radius:var(--radius-pill); border:1px solid transparent; background:transparent;
  color:var(--chalk-mute); cursor:pointer; transition:all .18s var(--ease);
}
.tab:hover{color:var(--chalk); background:rgba(245,242,234,0.07);}
.tab.on{color:var(--ink); background:linear-gradient(180deg, var(--amber-soft), var(--amber)); font-weight:700; box-shadow:0 6px 18px -6px rgba(255,182,39,0.55);}
.tab .count{
  display:inline-block; margin-left:7px; background:var(--gazzetta); color:var(--chalk);
  border-radius:10px; padding:0 6px; font-size:0.66rem;
}
.tab.on .count{background:var(--ink); color:var(--amber);}

/* ---------- BUTTONS ---------- */
button{font-family:'Work Sans',sans-serif; cursor:pointer; border:none; border-radius:var(--radius-sm); transition:filter .15s var(--ease), background .15s var(--ease), color .15s var(--ease), transform .15s var(--ease), box-shadow .15s var(--ease);}
button:disabled{opacity:0.4; cursor:not-allowed; transform:none !important;}
.btn{padding:12px 20px; font-size:0.92rem; font-weight:600;}
.btn-primary{background:linear-gradient(180deg, var(--amber-soft), var(--amber)); color:var(--ink); box-shadow:0 8px 20px -8px rgba(255,182,39,0.55);}
.btn-primary:hover:not(:disabled){filter:brightness(1.05); transform:translateY(-1px); box-shadow:0 10px 24px -8px rgba(255,182,39,0.65);}
.btn-primary:active:not(:disabled){transform:translateY(0);}
.btn-pink{background:linear-gradient(180deg, var(--gazzetta), var(--gazzetta-dark)); color:var(--chalk); box-shadow:0 8px 20px -8px rgba(232,84,140,0.5);}
.btn-pink:hover:not(:disabled){filter:brightness(1.06); transform:translateY(-1px);}
.btn-ghost{background:rgba(245,242,234,0.03); border:1px solid var(--line-strong); color:var(--chalk-soft); padding:11px 18px; font-size:0.88rem;}
.btn-ghost:hover:not(:disabled){border-color:var(--amber); color:var(--amber); background:rgba(255,182,39,0.06);}
.btn-sm{padding:8px 13px; font-size:0.78rem; font-weight:600; border-radius:var(--radius-sm);}
.btn-ok{background:rgba(87,201,138,0.12); border:1px solid rgba(87,201,138,0.4); color:var(--ok);}
.btn-ok:hover:not(:disabled){background:var(--ok); color:var(--ink); transform:translateY(-1px);}
.btn-ko{background:rgba(242,99,95,0.1); border:1px solid rgba(242,99,95,0.38); color:var(--ko);}
.btn-ko:hover:not(:disabled){background:var(--ko); color:var(--ink); transform:translateY(-1px);}
.btn-ok.on{background:var(--ok); color:var(--ink);}
.btn-ko.on{background:var(--ko); color:var(--ink);}
.btn-row{display:flex; gap:9px; flex-wrap:wrap;}
.btn-link{background:none; border:none; color:var(--amber); font-size:0.8rem; text-decoration:underline; padding:2px;}

/* ---------- FORMS ---------- */
label.field{display:block;}
label.field span{
  display:block; font-family:'Space Mono',monospace; font-size:0.66rem; letter-spacing:0.12em;
  text-transform:uppercase; color:var(--chalk-mute); margin-bottom:7px;
}
input[type=text],input[type=password],input[type=datetime-local],input[type=number],select,textarea{
  width:100%; background:rgba(8,31,24,0.6); border:1px solid var(--line-strong); color:var(--chalk);
  padding:12px 14px; border-radius:var(--radius-sm); font-size:0.95rem; font-family:'Work Sans',sans-serif;
  transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
}
input::placeholder,textarea::placeholder{color:rgba(245,242,234,0.28);}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--amber); box-shadow:0 0 0 3px rgba(255,182,39,0.2);}
input[type=file]{color:var(--chalk-soft); font-size:0.85rem; max-width:100%;}
input[type=file]::file-selector-button{
  background:var(--amber); color:var(--ink); border:none; padding:9px 14px; border-radius:var(--radius-sm);
  font-weight:700; font-family:'Work Sans',sans-serif; cursor:pointer; margin-right:10px;
}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:620px){.form-grid{grid-template-columns:1fr;}}
.checkline{display:flex; align-items:flex-start; gap:9px; font-size:0.88rem; color:var(--chalk-soft);}
.checkline input{margin-top:3px; accent-color:var(--amber); width:auto;}

/* ---------- GATE (login / registrazione / setup) ---------- */
.gate{max-width:460px; margin:48px auto 0;}
.gate .lead{text-align:center; margin-bottom:26px;}
.gate .lead h1{font-size:clamp(2rem,7vw,2.9rem); line-height:0.98;}
.gate .lead h1 em{font-style:normal; color:var(--gazzetta);}
.gate .lead p{color:var(--chalk-soft); margin-top:10px; font-size:0.94rem;}
.switcher{display:flex; gap:3px; border:1px solid var(--line); border-radius:var(--radius-pill); overflow:hidden; margin-bottom:18px; padding:3px; background:rgba(0,0,0,0.15);}
.switcher button{flex:1; padding:11px; background:transparent; color:var(--chalk-mute); font-family:'Space Mono',monospace; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; border-radius:var(--radius-pill);}
.switcher button.on{background:var(--gazzetta); color:var(--chalk); font-weight:700; box-shadow:0 6px 16px -6px rgba(232,84,140,0.6);}

/* ---------- SCHEDINA (elemento firma) ---------- */
.slip{
  position:relative; background:var(--chalk); color:var(--ink);
  border-radius:var(--radius-sm); padding:24px 22px 22px; margin-top:8px; overflow:hidden;
  box-shadow:0 20px 44px -18px rgba(0,0,0,0.65);
}
.slip::before{
  content:""; position:absolute; top:-1px; left:0; right:0; height:9px;
  background-image:radial-gradient(circle at 8px 0, var(--ink) 5px, transparent 5.5px);
  background-size:16px 9px; background-repeat:repeat-x;
}
.slip.on-pitch::before{background-image:radial-gradient(circle at 8px 0, var(--pitch) 5px, transparent 5.5px);}
.slip-head{
  display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;
  border-bottom:2px solid var(--ink); padding-bottom:9px; margin-bottom:14px;
}
.slip-head .who-slip{font-family:'Anton',sans-serif; font-size:1.25rem; text-transform:uppercase;}
.slip-head .code{font-family:'Space Mono',monospace; font-size:0.7rem; letter-spacing:0.1em; color:rgba(11,36,28,0.6);}
.slip-pick{display:flex; align-items:center; gap:11px; font-family:'Anton',sans-serif; font-size:1.6rem; text-transform:uppercase;}
.slip-pick .dot{width:15px; height:15px; border-radius:50%; flex:none; box-shadow:0 0 0 1px rgba(11,36,28,0.35);}
.slip-meta{font-family:'Space Mono',monospace; font-size:0.72rem; color:rgba(11,36,28,0.62); margin-top:6px;}
.slip-fixtures{
  border-bottom:1px dashed rgba(11,36,28,0.25); padding-bottom:12px; margin-bottom:14px;
  display:flex; flex-direction:column; gap:5px;
}
.slip-fixtures.empty-fx{
  color:rgba(11,36,28,0.5); font-size:0.78rem; font-style:italic; border-bottom:none; padding-bottom:0;
}
.slip-fixtures .fx-row{display:flex; align-items:center; gap:8px; font-size:0.8rem; color:rgba(11,36,28,0.85);}
.slip-fixtures .fx-team{display:flex; align-items:center; gap:6px; flex:1; min-width:0;}
.slip-fixtures .fx-team.right{justify-content:flex-end; text-align:right;}
.slip-fixtures .fx-team .dot{width:8px; height:8px; border-radius:50%; flex:none;}
.slip-fixtures .fx-vs{font-family:'Space Mono',monospace; font-size:0.7rem; color:rgba(11,36,28,0.4); flex:none;}
.slip-fixtures .fx-date{font-family:'Space Mono',monospace; font-size:0.66rem; color:rgba(11,36,28,0.45); flex:none; margin-left:6px;}

/* ---------- CALENDARIO SERIE A (scheda dedicata, su sfondo scuro) ---------- */
.fixtures-list{display:flex; flex-direction:column; gap:8px;}
.fixture-row{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  background:rgba(8,31,24,0.5); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:11px 14px; font-size:0.9rem;
}
.fixture-row .fx-team{display:flex; align-items:center; gap:7px; flex:1; min-width:120px;}
.fixture-row .fx-team .dot{width:9px; height:9px; border-radius:50%; flex:none;}
.fixture-row .fx-vs{font-family:'Space Mono',monospace; font-size:0.68rem; color:var(--chalk-mute); text-transform:uppercase; flex:none;}
.fixture-row .fx-date{font-family:'Space Mono',monospace; font-size:0.7rem; color:var(--chalk-mute); flex:none;}
.fixture-row .fx-rm{margin-left:auto;}
.stamp{
  position:absolute; right:14px; bottom:14px; transform:rotate(-11deg);
  font-family:'Anton',sans-serif; font-size:0.9rem; letter-spacing:0.16em; text-transform:uppercase;
  border:3px double currentColor; border-radius:5px; padding:5px 12px; opacity:0.85;
}
.stamp.ok{color:#1E7F4E;}
.stamp.pending{color:#B07600;}
.stamp.ko{color:#B3312D;}
.stamp.win{color:#1E7F4E;}
.stamp.lose{color:#B3312D;}

/* ---------- SELETTORE SQUADRE ---------- */
.team-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:9px;}
.team-btn{
  display:flex; align-items:center; gap:9px; text-align:left;
  background:rgba(8,31,24,0.55); border:1px solid var(--line); color:var(--chalk);
  padding:11px 12px; font-size:0.86rem; font-weight:500; border-radius:var(--radius-sm);
  transition:all .15s var(--ease);
}
.team-btn .dot{width:11px; height:11px; border-radius:50%; flex:none; box-shadow:0 0 0 3px rgba(255,255,255,0.05);}
.team-btn:hover:not(:disabled){border-color:var(--amber); transform:translateY(-1px); background:rgba(255,182,39,0.06);}
.team-btn.on{background:linear-gradient(180deg, var(--amber-soft), var(--amber)); color:var(--ink); border-color:var(--amber); font-weight:700; box-shadow:0 8px 20px -8px rgba(255,182,39,0.55);}
.team-btn.used{opacity:0.3; text-decoration:line-through; cursor:not-allowed;}

/* ---------- RIGHE RICHIESTA (tabellone) ---------- */
.board{display:flex; flex-direction:column; gap:9px;}
.req{
  display:grid; grid-template-columns:1.1fr 1fr auto; gap:12px; align-items:center;
  background:rgba(8,31,24,0.5); border:1px solid var(--line); border-left:3px solid var(--line);
  border-radius:var(--radius-sm); padding:13px 15px; transition:border-color .15s var(--ease);
}
.req.pending{border-left-color:var(--amber);}
.req.approved{border-left-color:var(--ok);}
.req.rejected{border-left-color:var(--ko);}
.req.missing{border-left-color:rgba(245,242,234,0.18); opacity:0.7;}
.req .p-name{font-weight:600; font-size:0.95rem;}
.req .p-sub{font-family:'Space Mono',monospace; font-size:0.68rem; color:var(--chalk-mute); letter-spacing:0.06em;}
.req .p-team{display:flex; align-items:center; gap:9px; font-size:0.95rem;}
.req .p-team .dot{width:11px; height:11px; border-radius:50%; flex:none;}
.req .p-actions{display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap;}
@media (max-width:700px){
  .req{grid-template-columns:1fr; align-items:flex-start;}
  .req .p-actions{justify-content:flex-start;}
}
.tag{
  font-family:'Space Mono',monospace; font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase;
  padding:3px 8px; border-radius:var(--radius-pill); border:1px solid currentColor; white-space:nowrap;
}
.tag.ok{color:var(--ok);} .tag.pending{color:var(--amber);} .tag.ko{color:var(--ko);} .tag.mute{color:var(--chalk-mute);}
.warn-inline{color:var(--ko); font-size:0.76rem; font-family:'Space Mono',monospace;}

/* ---------- TABELLE / STORICO ---------- */
.table-scroll{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:0.88rem;}
.code-cell{letter-spacing:0.08em; color:var(--amber); cursor:pointer; user-select:all;}
.code-cell.hidden-code{letter-spacing:0.16em; color:var(--chalk-mute); cursor:pointer; user-select:none;}
th{
  text-align:left; font-family:'Space Mono',monospace; font-size:0.66rem; letter-spacing:0.1em;
  text-transform:uppercase; color:var(--chalk-mute); padding:10px 12px; border-bottom:1px solid var(--line);
}
td{padding:11px 12px; border-bottom:1px solid var(--line);}
tr{transition:background .12s var(--ease);}
tr:hover td{background:rgba(245,242,234,0.02);}
tr:last-child td{border-bottom:none;}
td.num{font-family:'Space Mono',monospace; color:var(--chalk-mute);}
.out-row{opacity:0.5;}
.chip-mini{
  display:inline-flex; align-items:center; gap:5px; font-family:'Space Mono',monospace; font-size:0.66rem;
  background:rgba(245,242,234,0.06); padding:4px 8px; border-radius:var(--radius-pill); margin:2px 3px 2px 0;
}
.chip-mini .dot{width:8px; height:8px; border-radius:50%;}
.res-win{color:var(--ok); font-weight:700;}
.res-lose{color:var(--ko); font-weight:700;}

/* ---------- SCOREBOARD ---------- */
.scoreboard{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1px; background:var(--line); border-radius:var(--radius); overflow:hidden;}

<script>
/* =========================================================================
   1. CONFIGURAZIONE — L'UNICO BLOCCO DA MODIFICARE A MANO
   -------------------------------------------------------------------------
   Per far funzionare il sito online (più persone, più dispositivi) serve un
   archivio condiviso. Il modo più semplice e gratuito è Supabase:
   crea un progetto, esegui la query SQL che trovi nel README, poi incolla
   qui sotto l'URL del progetto e la chiave "anon public".
   Finché restano vuoti il sito funziona lo stesso, ma i dati restano
   solo su questo dispositivo (utile per provarlo).
   ========================================================================= */
const CONFIG = {
  supabaseUrl:     "https://blnrucninethpwvhlcsc.supabase.co",           // es. "https://abcdefgh.supabase.co"
  supabaseAnonKey: "sb_publishable_89xr7FlglRmI6xWdsbmEwQ_Yrkc1lDF",           // la chiave "anon public" del progetto
  tableName:       "fantalist_kv"
};


/* =========================================================================
   2. ARCHIVIO — un semplice magazzino chiave/valore con tre modalità
   ========================================================================= */
const Store = (() => {
  let mode = 'local', sb = null;

  function readLocalCfg(){
    try { return JSON.parse(localStorage.getItem('fantalist.backend') || 'null'); } catch(e){ return null; }
  }
  function writeLocalCfg(cfg){
    if(cfg) localStorage.setItem('fantalist.backend', JSON.stringify(cfg));
    else localStorage.removeItem('fantalist.backend');
  }
  function init(){
    const cfg = (CONFIG.supabaseUrl && CONFIG.supabaseAnonKey) ? CONFIG : readLocalCfg();
    if(cfg && cfg.supabaseUrl && cfg.supabaseAnonKey){
      sb = { url: String(cfg.supabaseUrl).trim().replace(/\/+$/,'').replace(/\/rest\/v1$/i,''), key: cfg.supabaseAnonKey, table: cfg.tableName || 'fantalist_kv' };
      mode = 'supabase';
    } else if(typeof window.storage === 'object' && window.storage && typeof window.storage.get === 'function'){
      mode = 'artifact';
    } else {
      mode = 'local';
    }
    return mode;
  }
  const H = () => ({ apikey: sb.key, Authorization: 'Bearer ' + sb.key, 'Content-Type': 'application/json' });
  async function sbFetch(path, opts){
    const r = await fetch(sb.url + '/rest/v1/' + sb.table + path, opts);
    if(!r.ok){
      let msg = 'HTTP ' + r.status;
      try { const j = await r.json(); msg = j.message || j.hint || msg; } catch(e){}
      throw new Error(msg);
    }
    return r;
  }

  const LP = 'fl:';
  return {
    init, mode: () => mode, config: () => sb,
    setConfig(cfg){ writeLocalCfg(cfg); },
    clearConfig(){ writeLocalCfg(null); },

    async get(key){
      try{
        if(mode === 'supabase'){
          const r = await sbFetch('?k=eq.' + encodeURIComponent(key) + '&select=v', { headers: H() });
          const j = await r.json();
          return j.length ? JSON.parse(j[0].v) : null;
        }
        if(mode === 'artifact'){
          const r = await window.storage.get(key, true);
          return (r && r.value) ? JSON.parse(r.value) : null;
        }
        const raw = localStorage.getItem(LP + key);
        return raw ? JSON.parse(raw) : null;
      }catch(e){
        if(mode === 'supabase') throw e;
        return null;   // chiave inesistente: le altre modalità lanciano eccezione
      }
    },

    async set(key, value){
      const s = JSON.stringify(value);
      if(mode === 'supabase'){
        await sbFetch('', { method:'POST', headers:{ ...H(), Prefer:'resolution=merge-duplicates,return=minimal' },
                            body: JSON.stringify({ k:key, v:s }) });
        return;
      }
      if(mode === 'artifact'){ await window.storage.set(key, s, true); return; }
      localStorage.setItem(LP + key, s);
    },

    async del(key){
      if(mode === 'supabase'){ await sbFetch('?k=eq.' + encodeURIComponent(key), { method:'DELETE', headers:H() }); return; }
      if(mode === 'artifact'){ try{ await window.storage.delete(key, true); }catch(e){} return; }
      localStorage.removeItem(LP + key);
    },

    /* restituisce [{key, value}] per tutte le chiavi che iniziano con "prefix" */
    async list(prefix){
      if(mode === 'supabase'){
        const r = await sbFetch('?k=like.' + encodeURIComponent(prefix + '*') + '&select=k,v', { headers:H() });
        const j = await r.json();
        return j.map(row => { try{ return { key: row.k, value: JSON.parse(row.v) }; }catch(e){ return null; } }).filter(Boolean);
      }
      if(mode === 'artifact'){
        let keys = [];
        try{ const res = await window.storage.list(prefix, true); keys = (res && res.keys) ? res.keys : []; }catch(e){ keys = []; }
        const out = [];
        for(const k of keys){
          try{ const r = await window.storage.get(k, true); if(r && r.value) out.push({ key:k, value: JSON.parse(r.value) }); }catch(e){}
        }
        return out;
      }
      const out = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(LP + prefix)){
          try{ out.push({ key:k.slice(LP.length), value: JSON.parse(localStorage.getItem(k)) }); }catch(e){}
        }
      }
      return out;
    }
  };
})();

/* Chiavi usate nell'archivio (niente spazi, slash o virgolette) */
/* =========================================================================
   3. PASSWORD — PBKDF2 (SHA-256, 150.000 giri) con sale casuale per utente
   ========================================================================= */
const toHex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
const fromHex = hex => new Uint8Array(hex.match(/.{1,2}/g).map(b => parseInt(b,16)));
function randomHex(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return toHex(a); }

async function derive(password, saltHex, iterations = 150000){
  if(!crypto.subtle) throw new Error('Il browser non supporta la cifratura richiesta: apri il sito su https.');
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name:'PBKDF2', salt: fromHex(saltHex), iterations, hash:'SHA-256' }, key, 256);
  return toHex(bits);
}

/* =========================================================================

   ========================================================================= */
const TEAM_COLORS = {
  atalanta:'#1B5EA6', bologna:'#8E1B2E', cagliari:'#A3122B', como:'#0B4DA2', cremonese:'#8B1F2E',

const DEFAULT_TEAMS = ['Atalanta','Bologna','Cagliari','Como','Fiorentina','Frosinone','Genoa','Inter','Juventus','Lazio',

const DEFAULT_CALENDAR = [

  { round:1, home:'Frosinone', away:'Juventus' }, { round:1, home:'Genoa', away:'Napoli' },

const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
const teamColor = (name, i) => TEAM_COLORS[slug(name).replace(/-/g,'')] || FALLBACK[i % FALLBACK.length];
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const isPlaceholder = n => /^partecipante\s*\d+$/i.test(String(n).trim());

/* Codice di accesso facile da dettare al telefono: niente caratteri ambigui. */
function generateCode(){
  const A = 'abcdefghijkmnpqrstuvwxyz', N = '23456789';
  const pick = set => set[Math.floor(Math.random() * set.length)];
  let out = '';
  for(let i=0;i<4;i++) out += pick(A);
  for(let i=0;i<3;i++) out += pick(N);
  return out;
}

function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  return d.toLocaleString('it-IT', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function toInputDT(iso){
  if(!iso) return '';
  const d = new Date(iso); if(isNaN(d)) return '';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function copyText(text){
  const done = () => toast('Copiato negli appunti.', 'ok');
  if(navigator.clipboard?.writeText){ navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); }
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('Copia non riuscita: seleziona il testo a mano.', 'err'); }
  ta.remove();
}

function toast(message, kind = ''){
  const box = el(`<div class="toast ${kind}">${esc(message)}</div>`);
  document.getElementById('toasts').appendChild(box);
  setTimeout(() => box.remove(), 4200);
}
function modal({ title, message, input = null, placeholder = '', prefill = '', confirmText = 'Conferma', cancelText = 'Annulla' }){
  return new Promise(resolve => {
    const ov = el(`<div class="overlay"></div>`);
    const box = el(`
      <div class="modal" role="dialog" aria-modal="true">
        <h3>${esc(title)}</h3>
        ${message ? `<p>${esc(message)}</p>` : ''}
        ${input ? `<input type="${input}" placeholder="${esc(placeholder)}" value="${esc(prefill)}">` : ''}
        <div class="btn-row">
          <button class="btn btn-ghost" data-x>${esc(cancelText)}</button>
          <button class="btn btn-primary" data-y>${esc(confirmText)}</button>
        </div>
      </div>`);
    ov.appendChild(box); document.body.appendChild(ov);
    const inp = box.querySelector('input');
    if(inp) setTimeout(() => { inp.focus(); inp.select(); }, 40);
    const done = v => { ov.remove(); resolve(v); };
    box.querySelector('[data-x]').onclick = () => done(input ? null : false);
    box.querySelector('[data-y]').onclick = () => done(input ? inp.value : true);
    if(inp) inp.onkeydown = e => { if(e.key === 'Enter') done(inp.value); if(e.key === 'Escape') done(null); };
    ov.onclick = e => { if(e.target === ov) done(input ? null : false); };
  });
}
const confirmBox = message => modal({ title:'Confermi?', message, confirmText:'Sì, procedi' });
const alertBox   = message => modal({ title:'Attenzione', message, confirmText:'Ho capito', cancelText:'Chiudi' });


/* =========================================================================
   5. I TRE MINIGIOCHI
   -------------------------------------------------------------------------
   Due "Last Man Standing" (andata: giornate 1-19, ritorno: giornate 20-38) e
   un "WhoWin?" che copre tutte le 38 giornate. Le giornate sono numerate in

   in corso in quella giornata.
   ========================================================================= */
const SEASON_ROUNDS = 38;

const GAMES = [
  { key:'lms_a',  name:'Last Man Standing — Andata',  short:'LMS Andata',  kind:'lms',
    first:1,  last:19, maxUses:1, sheet:'Minigioco_LastManStanding', table:'MG_A',
    match:/lastmanstanding|last man standing|\blms\b|minigioco.*andata/i, exclude:/ritorno|stagional|whowin/i },
  /* Il nome del foglio deve stare in 31 caratteri: è il limite di Excel. */
  { key:'lms_r',  name:'Last Man Standing — Ritorno', short:'LMS Ritorno', kind:'lms',
    first:20, last:38, maxUses:1, sheet:'Minigioco_LMS_Ritorno', table:'MG_R',
    match:/ritorno/i, exclude:/stagional|whowin/i },
  { key:'whowin', name:'WhoWin?',                     short:'WhoWin?',     kind:'season',
    first:1,  last:38, maxUses:3, sheet:'Minigioco_Stagionale',              table:'MG_S',
    match:/stagional|whowin|mg[_ ]?s\b/i, exclude:null }
];
const G = key => GAMES.find(g => g.key === key);

const K = {
  core:  'core',
  user:  u => 'user-' + u,
  claim: pid => 'claim-' + pid,
  gmeta: g => 'gmeta-' + g,
  req:       (g, r, pid) => `req-${g}-r${r}-${pid}`,
  reqPrefix: (g, r)      => `req-${g}-r${r}-`,

};

/* =========================================================================
   6. STATO
   ========================================================================= */
function emptyCore(){
  return {
    createdAt: new Date().toISOString(),
    teams: DEFAULT_TEAMS.map((n,i) => ({ id: slug(n), name: n, color: teamColor(n,i) })),
    players: [],          // [{id, name}] — gli stessi per tutti e tre i minigiochi
    round: 1,             // giornata corrente della lega (1..38)
    deadline: null,       // termine unico d'invio per la giornata corrente
    autoApprove: false,
    fileName: null,
    originalB64: null,
    sheetNames: {},        // gameKey -> nome del foglio da cui è stato letto
    calendar: DEFAULT_CALENDAR.slice()   // [{round, home, away}] — calendario Serie A
  };
}
function emptyGame(){
  return { phase:'playing', history:[], st:{} };
}

const S = {
  core: null,
  games: {},      // gameKey -> { phase, history, st }
  reqs: {},       // gameKey -> { playerId: richiesta della giornata corrente }
  results: {},    // teamId -> 'win' | 'lose'   (CONDIVISI: valgono per tutti i minigiochi)
  users: [], claims: {}, me: null,
  tab: null, gameTab: 'lms_a', boardGame: 'whowin',
  boardSort: 'wins', boardDir: 'desc', boardOpen: {},
  gateTab: 'login', offline: false
};

/* ---- helper derivati ---- */
const isAdmin   = () => S.me?.role === 'admin';
const player    = id => (S.core?.players || []).find(p => p.id === id) || null;
const myPlayer  = () => S.me?.playerId ? player(S.me.playerId) : null;
const team      = id => (S.core?.teams || []).find(t => t.id === id) || { id, name: id || '—', color:'#8A8A8A' };
const deadlinePassed = () => !!(S.core?.deadline && new Date(S.core.deadline) < new Date());
function matchesForRound(round){
  return (S.core?.calendar || []).filter(m => m.round === round);
}
/* Prova a collegare il nome della squadra in calendario (testo libero,
   può venire da un Excel esterno) alla squadra vera per colore/coerenza. */
function teamByName(name){
  const s = slug(name);
  return (S.core?.teams || []).find(t => t.id === s) || { id:s, name, color:'#8A8A8A' };
}
const gmeta     = key => S.games[key];

function gstate(key, pid){
  const m = gmeta(key);
  if(!m) return { used:[], eliminated:false, eliminatedRound:null, eliminatedReason:null };
  if(!m.st[pid]) m.st[pid] = { used:[], eliminated:false, eliminatedRound:null, eliminatedReason:null };
  return m.st[pid];
}
/* Un minigioco è "in corso" se la giornata della lega rientra nel suo
   intervallo e non si è già concluso (nel Last Man Standing può finire prima,
   quando resta un solo partecipante in piedi). */
function gameOpen(key){
  const g = G(key), m = gmeta(key);
  if(!m || m.phase === 'finished') return false;
  return S.core.round >= g.first && S.core.round <= g.last;
}
function gameStarted(key){
  const g = G(key);
  return !!gmeta(key) && S.core.round >= g.first;
}
const openGames = () => GAMES.filter(g => gameOpen(g.key));
function aliveIn(key){
  return (S.core?.players || []).filter(p => !gstate(key, p.id).eliminated);
}
function usesOf(key, pid, tid){
  return gstate(key, pid).used.filter(t => t === tid).length;
}
function availableIn(key, p){
  const max = G(key).maxUses;
  return (S.core.teams || []).map(t => {
    const count = usesOf(key, p.id, t.id);
    return { ...t, count, max, full: count >= max };
  });
}
function winsIn(key, pid){
  return (gmeta(key)?.history || []).reduce((s,h) => {
    const e = h.entries.find(x => x.playerId === pid);
    return s + (e && e.result === 'win' ? 1 : 0);
  }, 0);
}
function playedIn(key, pid){
  return (gmeta(key)?.history || []).filter(h => h.entries.some(e => e.playerId === pid && e.teamId)).length;
}
function approvedIn(key){
  const out = {};
  for(const [pid, r] of Object.entries(S.reqs[key] || {})) if(r.status === 'approved') out[pid] = r.teamId;
  return out;
}
/* Tutte le squadre pronosticate (e approvate) in questa giornata, in qualunque
   minigioco: è su queste che l'organizzatore segna l'esito, una volta sola. */
function pickedTeamsThisRound(){
  const map = new Map();   // teamId -> [{gameKey, playerId}]
  openGames().forEach(g => {
    const ap = approvedIn(g.key);
    Object.entries(ap).forEach(([pid, tid]) => {
      if(!map.has(tid)) map.set(tid, []);
      map.get(tid).push({ gameKey: g.key, playerId: pid });
    });
  });
  return map;
}
function allResultsIn(){
  const ids = [...pickedTeamsThisRound().keys()];
  return ids.length > 0 && ids.every(t => S.results[t]);
}
function missingIn(key){
  return aliveIn(key).filter(p => !S.reqs[key]?.[p.id] || S.reqs[key][p.id].status === 'rejected');
}
function pendingIn(key){
  return aliveIn(key).filter(p => S.reqs[key]?.[p.id]?.status === 'pending');
}
const totalPending = () => openGames().reduce((n,g) => n + pendingIn(g.key).length, 0);

/* =========================================================================
   7. CARICAMENTO E SALVATAGGIO
   ========================================================================= */
async function saveCore(){
  S.core.updatedAt = new Date().toISOString();
  await Store.set(K.core, S.core);
}
async function saveGame(key){
  await Store.set(K.gmeta(key), S.games[key]);
}
async function loadCore(){
  const c = await Store.get(K.core);
  S.core = c ? { ...emptyCore(), ...c } : null;
}
async function loadGames(){
  S.games = {};
  for(const g of GAMES){
    const m = await Store.get(K.gmeta(g.key));
    if(m) S.games[g.key] = { ...emptyGame(), ...m };
  }
}
async function loadRound(){
  S.reqs = {}; S.results = {};
  if(!S.core) return;
  const r = S.core.round;
  for(const g of GAMES){
    S.reqs[g.key] = {};
    if(!S.games[g.key]) continue;
    const pfx = K.reqPrefix(g.key, r);
    (await Store.list(pfx)).forEach(({ key, value }) => { S.reqs[g.key][key.slice(pfx.length)] = value; });
  }
  const rpfx = K.resPrefix(r);
  (await Store.list(rpfx)).forEach(({ key, value }) => { S.results[key.slice(rpfx.length)] = value; });
}
async function loadClaims(){
  S.claims = {};
  (await Store.list('claim-')).forEach(({ key, value }) => { S.claims[key.slice('claim-'.length)] = value; });
}
async function loadUsers(){
  S.users = (await Store.list('user-')).map(x => x.value);
}
async function refresh(silent = true){
  try{
    await loadCore();
    await loadGames();
    await loadRound();
    S.offline = false;
    if(isAdmin()) await loadUsers();
  }catch(e){
    S.offline = true;
    if(!silent) toast('Archivio non raggiungibile: ' + e.message, 'err');
  }
  render();
}

/* =========================================================================
   8. RICHIESTE DI PRONOSTICO
   ========================================================================= */
async function submitPick(gameKey, playerId, teamId, byAdmin = false){
  const g = G(gameKey);
  const p = player(playerId);
  if(!p) throw new Error('Partecipante non trovato.');
  if(!gameOpen(gameKey)) throw new Error(g.name + ' non è in corso in questa giornata.');
  if(gstate(gameKey, playerId).eliminated) throw new Error(p.name + ' è già fuori da ' + g.name + '.');
  const used = usesOf(gameKey, playerId, teamId);
  if(used >= g.maxUses){
    throw new Error(g.maxUses === 1
      ? 'Questa squadra è già stata usata da ' + p.name + ' in ' + g.short + '.'
      : 'Questa squadra è già stata scelta ' + g.maxUses + ' volte da ' + p.name + ' in ' + g.short + '.');
  }
  if(!byAdmin && deadlinePassed()) throw new Error('Il termine per questa giornata è scaduto: scrivi all\'organizzatore.');

  const prev = S.reqs[gameKey]?.[playerId];
  const auto = byAdmin || S.core.autoApprove;
  const rec = {
    teamId,
    status: auto ? 'approved' : 'pending',
    note: '',
    sentAt: new Date().toISOString(),
    sentBy: S.me ? S.me.username : 'sistema',
    decidedAt: auto ? new Date().toISOString() : null,
    decidedBy: auto ? (S.me ? S.me.username : 'sistema') : null
  };
  await Store.set(K.req(gameKey, S.core.round, playerId), rec);
  if(!S.reqs[gameKey]) S.reqs[gameKey] = {};
  S.reqs[gameKey][playerId] = rec;
}
async function decidePick(gameKey, playerId, status, note = ''){
  const rec = S.reqs[gameKey]?.[playerId];
  if(!rec) return;
  rec.status = status; rec.note = note;
  rec.decidedAt = new Date().toISOString();
  rec.decidedBy = S.me ? S.me.username : 'organizzatore';
  await Store.set(K.req(gameKey, S.core.round, playerId), rec);
  S.reqs[gameKey][playerId] = rec;
}

/* ---- ESITI DELLE SQUADRE: UNICI PER TUTTA LA LEGA ----
   Segnare "Milan ha vinto" vale nello stesso momento per chi l'ha scelto nel
   Last Man Standing e per chi l'ha scelto in WhoWin?. */
async function writeTeamResult(teamId, result, round = S.core.round){
  await Store.set(K.res(round, teamId), result);
  if(round === S.core.round) S.results[teamId] = result;
}
async function setTeamResult(teamId, result){
  const r = S.core.round;
  if(S.results[teamId] === result){
    await Store.del(K.res(r, teamId));
    delete S.results[teamId];
  } else {
    await writeTeamResult(teamId, result);
  }
}

/* ---- ELIMINAZIONE PER ASSENZA (solo Last Man Standing) ---- */
async function eliminateAbsent(gameKey){
  const missing = missingIn(gameKey);
  if(!missing.length) return;
  const ok = await confirmBox(
    `Elimino da ${G(gameKey).name} ${missing.length === 1 ? 'il partecipante' : 'i ' + missing.length + ' partecipanti'} ` +
    `che non ${missing.length === 1 ? 'ha' : 'hanno'} inviato il pronostico: ${missing.map(p => p.name).join(', ')}. ` +
    `Restano ripescabili finché non chiudi la giornata.`);
  if(!ok) return;
  missing.forEach(p => {
    const st = gstate(gameKey, p.id);
    st.eliminated = true; st.eliminatedRound = S.core.round; st.eliminatedReason = 'assente';
  });
  await saveGame(gameKey);
  toast('Eliminati per assenza: ' + missing.length + '.', 'ok');
  render();
}
async function readmit(gameKey, pid){
  const st = gstate(gameKey, pid);
  st.eliminated = false; st.eliminatedRound = null; st.eliminatedReason = null;
  await saveGame(gameKey);
  toast(player(pid).name + ' ripescato.', 'ok');
  render();
}

/* ---- CHIUSURA DELLA GIORNATA (una sola, per tutti i minigiochi) ---- */
function closeSummary(){
  const rows = [];
  openGames().forEach(g => {
    const ap = approvedIn(g.key);
    const alive = aliveIn(g.key);
    const withPick = alive.filter(p => ap[p.id]).length;
    const noPick = alive.filter(p => !ap[p.id]);
    rows.push({ g, withPick, noPick, alive: alive.length });
  });
  return rows;
}
async function closeGiornata(){
  if(!openGames().length || !allResultsIn()) return;
  const summary = closeSummary();
  const absLines = summary.filter(r => r.noPick.length).map(r =>
    `${r.g.short}: ${r.noPick.map(p => p.name).join(', ')} senza pronostico` +
    (r.g.kind === 'lms' ? ' → eliminati' : ' → giornata persa'));
  const ok = await confirmBox(
    `Chiudo la giornata ${S.core.round} per ${summary.length === 1 ? 'il minigioco in corso' : 'tutti i minigiochi in corso'}. ` +
    `Gli esiti diventano definitivi.` + (absLines.length ? '\n\n' + absLines.join('\n') : ''));
  if(!ok) return;

  for(const g of openGames()){
    const m = gmeta(g.key);
    const ap = approvedIn(g.key);
    const entries = [];
    aliveIn(g.key).forEach(p => {
      const st = gstate(g.key, p.id);
      const teamId = ap[p.id];
      if(teamId){
        const result = S.results[teamId];
        entries.push({ playerId: p.id, teamId, result });
        st.used = [ ...(st.used || []), teamId ];
        if(result === 'lose' && g.kind === 'lms'){
          st.eliminated = true; st.eliminatedRound = S.core.round; st.eliminatedReason = null;
        }
      } else {
        /* nessun pronostico: nel Last Man Standing è un'eliminazione, in
           WhoWin? semplicemente una giornata senza vittoria. */
        entries.push({ playerId: p.id, teamId: null, result: 'absent' });
        if(g.kind === 'lms'){
          st.eliminated = true; st.eliminatedRound = S.core.round;
          st.eliminatedReason = st.eliminatedReason || 'assente';
        }
      }
    });
    m.history.push({ round: S.core.round, entries, closedAt: new Date().toISOString() });

    if(g.kind === 'lms'){
      const still = aliveIn(g.key);
      if(still.length <= 1 || S.core.round >= g.last){
        m.phase = 'finished';
        m.winners = still.map(p => p.id);
        if(!m.winners.length){
          /* tutti eliminati nella stessa giornata: vincono a pari merito */
          m.winners = entries.filter(e => e.result === 'lose' || e.result === 'absent').map(e => e.playerId);
        }
      }
    } else if(S.core.round >= g.last){
      m.phase = 'finished';
    }
    await saveGame(g.key);
  }

  if(S.core.round < SEASON_ROUNDS) S.core.round += 1;
  S.core.deadline = null;
  await saveCore();
  await loadRound();
  toast('Giornata chiusa. Si passa alla ' + S.core.round + '.', 'ok');
  render();
}
async function reopenGiornata(){
  const last = Math.max(...GAMES.map(g => {
    const h = gmeta(g.key)?.history || [];
    return h.length ? h[h.length-1].round : 0;
  }), 0);
  if(!last) return;
  if(!await confirmBox('Riapro la giornata ' + last + ': esiti ed eliminazioni tornano modificabili in tutti i minigiochi.')) return;

  for(const g of GAMES){
    const m = gmeta(g.key);
    if(!m || !m.history.length) continue;
    const h = m.history[m.history.length - 1];
    if(h.round !== last) continue;
    h.entries.forEach(e => {
      const st = gstate(g.key, e.playerId);
      if(e.teamId){
        const i = (st.used || []).lastIndexOf(e.teamId);
        if(i >= 0) st.used.splice(i, 1);
      }
      if(st.eliminatedRound === last){ st.eliminated = false; st.eliminatedRound = null; st.eliminatedReason = null; }
    });
    m.history.pop();
    if(m.phase === 'finished'){ m.phase = 'playing'; m.winners = []; }
    await saveGame(g.key);
  }
  S.core.round = last;
  await saveCore();
  await loadRound();
  toast('Giornata ' + last + ' riaperta.', 'ok');
  render();
}

/* =========================================================================
   7. ACCOUNT
   ========================================================================= */
const SESSION_KEY = 'fantalist.session';

async function findUser(username){
  return await Store.get(K.user(slug(username)));
}
/* Il nome utente di un partecipante non si sceglie: è il suo nome nel file Excel,
   normalizzato (Peppe Verbaro -> peppe-verbaro). Così l'organizzatore sa sempre
   con quale nome accede ciascuno. */
function usernameFor(p){ return String(p.id).replace(/^p-/, ''); }

async function createUser({ username, password, role, playerId, displayName }){
  const u = slug(username);
  if(u.length < 3) throw new Error('Il nome utente deve avere almeno 3 caratteri.');
  if(password.length < 6) throw new Error('Il codice di accesso deve avere almeno 6 caratteri.');
  if(await findUser(u)) throw new Error('Questo nome utente è già stato preso.');
  const salt = randomHex(16);
  const rec = {
    username: u, displayName: displayName || username, role: role || 'player',
    playerId: playerId || null, salt, hash: await derive(password, salt),
    password,                                  // leggibile: serve all'organizzatore
    createdAt: new Date().toISOString()
  };
  await Store.set(K.user(u), rec);
  if(playerId) await Store.set(K.claim(playerId), u);
  return rec;
}
async function login(username, password){
  const rec = await findUser(username);
  if(!rec) throw new Error('Nome utente o password non validi.');
  const h = await derive(password, rec.salt);
  if(h !== rec.hash) throw new Error('Nome utente o password non validi.');
  localStorage.setItem(SESSION_KEY, JSON.stringify({ username: rec.username, verifier: h }));
  S.me = rec;
  return rec;
}
async function restoreSession(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }catch(e){}
  if(!s) return null;
  const rec = await findUser(s.username);
  if(rec && rec.hash === s.verifier){ S.me = rec; return rec; }
  localStorage.removeItem(SESSION_KEY);
  return null;
}
function logout(){
  localStorage.removeItem(SESSION_KEY);
  S.me = null; S.tab = null;
  render();
}
async function changePassword(username, newPassword){
  const rec = await findUser(username);
  if(!rec) throw new Error('Account non trovato.');
  if(newPassword.length < 6) throw new Error('Il codice di accesso deve avere almeno 6 caratteri.');
  rec.salt = randomHex(16);
  rec.hash = await derive(newPassword, rec.salt);
  rec.password = newPassword;
  await Store.set(K.user(rec.username), rec);
  if(S.me && S.me.username === rec.username){
    localStorage.setItem(SESSION_KEY, JSON.stringify({ username: rec.username, verifier: rec.hash }));
    S.me = rec;
  }
  return rec;
}


/* =========================================================================
   9. FOGLIO EXCEL — un solo file comanda tutti e tre i minigiochi
   -------------------------------------------------------------------------
   Fogli attesi (i nomi possono variare, vengono riconosciuti dal contenuto):
     · "Partecipanti e Premi"            — elenco iscritti e quota minigiochi
     · "Minigioco_LastManStanding" (MG_A) — LMS andata,  Giornata 1..19
     · "Minigioco_..._Ritorno"     (MG_R) — LMS ritorno, Giornata 20..38
     · "Minigioco_Stagionale"      (MG_S) — WhoWin?,     Giornata 1..38 + Totale Vittorie
   Nelle colonne delle squadre: "X" (Last Man Standing) o un numero da 1 a 3
   (WhoWin?, quante volte quella squadra è stata usata). Nelle colonne
   Giornata: "V (Inter)", "NV (Inter)" oppure "ASSENTE".
   ========================================================================= */
function b64FromBuffer(buffer){
  let bin = ''; const bytes = new Uint8Array(buffer), chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  return btoa(bin);
}

/* Trova la riga di intestazione (nelle prime 3 righe) e mappa le colonne. */
function parseGrid(ws){
  if(!ws || !ws['!ref']) return null;
  const range = XLSX.utils.decode_range(ws['!ref']);
  for(let hr = range.s.r; hr <= Math.min(range.s.r + 2, range.e.r); hr++){
    let partCol = null; const teams = [], giornate = []; let winsCol = null;
    for(let c = range.s.c; c <= range.e.c; c++){
      const cell = ws[XLSX.utils.encode_cell({ r: hr, c })];
      if(!cell || cell.v == null || cell.v === '') continue;
      const label = String(cell.v).trim();
      /* "Partecipanti" può comparire più volte sulla stessa riga (nel foglio
         dei premi c'è anche nei riepiloghi a destra): vale la prima. */
      if(/^partecipant/i.test(label)){ if(partCol == null) partCol = c; }
      else if(/^giornata\s*\d+/i.test(label)) giornate.push({ col:c, num: parseInt(label.match(/\d+/)[0], 10) });
      else if(/^totale/i.test(label)) winsCol = c;
      else teams.push({ col:c, name: label });
    }
    if(partCol != null && teams.length){
      giornate.sort((a,b) => a.num - b.num);
      return { range, headerRow: hr, firstDataRow: hr + 1, partCol, teams, giornate, winsCol };
    }
  }
  return null;
}
function findSheet(wb, game){
  const byName = wb.SheetNames.find(n =>
    game.match.test(n) && !(game.exclude && game.exclude.test(n)));
  return byName || null;
}
/* Chi ha la x su "Quota MiniGiochi" nel foglio dei partecipanti. */
function readEligible(wb){
  const name = wb.SheetNames.find(n => /partecipanti/i.test(n));
  if(!name) return null;
  const ws = wb.Sheets[name];
  const grid = parseGrid(ws);
  if(!grid) return null;
  const quotaCol = grid.teams.find(t => /quota\s*minigioch/i.test(t.name));
  if(!quotaCol) return null;
  const out = new Set();
  for(let r = grid.firstDataRow; r <= grid.range.e.r; r++){
    const n = ws[XLSX.utils.encode_cell({ r, c: grid.partCol })];
    const q = ws[XLSX.utils.encode_cell({ r, c: quotaCol.col })];
    if(!n || n.v == null) continue;
    if(q && String(q.v).trim().toLowerCase() === 'x') out.add(String(n.v).trim().toLowerCase());
  }
  return out;
}

async function importWorkbook(file, opts){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:'array' });
  const eligible = opts.onlyPaying ? readEligible(wb) : null;

  /* --- 1. elenco partecipanti: dal foglio "Partecipanti e Premi" se c'è,
         altrimenti dal primo foglio di minigioco disponibile --- */
  let names = [];
  const partSheet = wb.SheetNames.find(n => /partecipanti/i.test(n));
  const sourceSheets = partSheet ? [partSheet] : [];
  GAMES.forEach(g => { const s = findSheet(wb, g); if(s) sourceSheets.push(s); });
  for(const sn of sourceSheets){
    const grid = parseGrid(wb.Sheets[sn]);
    if(!grid) continue;
    for(let r = grid.firstDataRow; r <= grid.range.e.r; r++){
      const c = wb.Sheets[sn][XLSX.utils.encode_cell({ r, c: grid.partCol })];
      if(!c || c.t === 'e' || c.v == null) continue;
      const nm = String(c.v).trim();
      if(!nm) continue;
      if(opts.skipPlaceholders && isPlaceholder(nm)) continue;
      if(eligible && !eligible.has(nm.toLowerCase())) continue;
      if(!names.includes(nm)) names.push(nm);
    }
    if(names.length) break;
  }
  if(!names.length) throw new Error('Non trovo nessun partecipante nel file. Controlla il foglio "Partecipanti e Premi" e le due spunte qui sopra.');

  const seen = new Set();
  const players = names.map(nm => {
    let id = 'p-' + slug(nm), n = 2;
    while(seen.has(id)) id = 'p-' + slug(nm) + '-' + (n++);
    seen.add(id);
    return { id, name: nm };
  });
  const byName = {}; players.forEach(p => { byName[p.name.toLowerCase()] = p.id; });

  /* --- 2. squadre: dal primo foglio di minigioco che le contiene --- */
  let teams = null, sheetNames = {};
  for(const g of GAMES){
    const sn = findSheet(wb, g);
    if(!sn) continue;
    sheetNames[g.key] = sn;
    if(!teams){
      const grid = parseGrid(wb.Sheets[sn]);
      if(grid) teams = grid.teams.map((t,i) => ({ id: slug(t.name), name: t.name, color: teamColor(t.name, i) }));
    }
  }
  if(!teams) teams = DEFAULT_TEAMS.map((n,i) => ({ id: slug(n), name: n, color: teamColor(n,i) }));

  /* --- 3. stato di ciascun minigioco --- */
  const games = {}; let maxDone = 0;
  for(const g of GAMES){
    const m = emptyGame();
    players.forEach(p => { m.st[p.id] = { used:[], eliminated:false, eliminatedRound:null, eliminatedReason:null }; });
    const sn = sheetNames[g.key];
    if(sn){
      const ws = wb.Sheets[sn], grid = parseGrid(ws);
      if(grid){
        const histByRound = {};
        for(let r = grid.firstDataRow; r <= grid.range.e.r; r++){
          const nc = ws[XLSX.utils.encode_cell({ r, c: grid.partCol })];
          if(!nc || nc.t === 'e' || nc.v == null) continue;
          const pid = byName[String(nc.v).trim().toLowerCase()];
          if(!pid) continue;
          const st = m.st[pid];
          const entries = [];
          grid.giornate.forEach(gi => {
            if(gi.num < g.first || gi.num > g.last) return;
            const cell = ws[XLSX.utils.encode_cell({ r, c: gi.col })];
            if(!cell || cell.v == null) return;
            const raw = String(cell.v).trim();
            if(/^assente$/i.test(raw)){ entries.push({ round: gi.num, teamId: null, result: 'absent' }); return; }
            const mt = raw.match(/^(V|NV)\s*\(([^)]+)\)$/i);
            if(!mt) return;
            const label = mt[2].trim();
            const t = teams.find(x => x.name.toLowerCase() === label.toLowerCase()) || teams.find(x => x.id === slug(label));
            if(!t) return;
            entries.push({ round: gi.num, teamId: t.id, result: mt[1].toUpperCase() === 'V' ? 'win' : 'lose' });
          });
          entries.sort((a,b) => a.round - b.round);
          st.used = entries.filter(e => e.teamId).map(e => e.teamId);
          if(g.kind === 'lms'){
            const out = entries.find(e => e.result === 'lose' || e.result === 'absent');
            if(out){
              st.eliminated = true; st.eliminatedRound = out.round;
              if(out.result === 'absent') st.eliminatedReason = 'assente';
            }
          }
          entries.forEach(e => {
            (histByRound[e.round] = histByRound[e.round] || []).push({ playerId: pid, teamId: e.teamId, result: e.result });
            if(e.round > maxDone) maxDone = e.round;
          });
        }
        m.history = Object.keys(histByRound).map(k => ({ round: parseInt(k,10), entries: histByRound[k] }))
          .sort((a,b) => a.round - b.round);
      }
    }
    if(g.kind === 'lms'){
      const alive = players.filter(p => !m.st[p.id].eliminated);
      const lastPlayed = m.history.length ? m.history[m.history.length-1].round : 0;
      if(m.history.length && (alive.length <= 1 || lastPlayed >= g.last)){
        m.phase = 'finished'; m.winners = alive.map(p => p.id);
      }
    } else if(m.history.length && m.history[m.history.length-1].round >= g.last){
      m.phase = 'finished';
    }
    games[g.key] = m;
  }

  const round = Math.min(maxDone + 1, SEASON_ROUNDS);
  const calendar = parseCalendarSheet(wb) || DEFAULT_CALENDAR.slice();
  S.core = { ...emptyCore(), teams, players, round, calendar,
    fileName: file.name, originalB64: b64FromBuffer(buf), sheetNames };
  S.games = games;
  await saveCore();
  for(const g of GAMES) await saveGame(g.key);
  await loadRound();
  return { players: players.length, teams: teams.length, round,
           sheets: GAMES.filter(g => sheetNames[g.key]).map(g => g.short) };
}

/* ---- CALENDARIO SERIE A ----
   Foglio "Calendario": colonne Giornata, Casa, Trasferta (e opzionalmente
   Data). Un foglio semplice, non nel formato a griglia degli altri —
   basta trovare l'intestazione nelle prime righe. */
function parseCalendarSheet(wb){
  const sn = wb.SheetNames.find(n => /calendario/i.test(n));
  if(!sn) return null;
  const ws = wb.Sheets[sn];
  if(!ws || !ws['!ref']) return null;
  const range = XLSX.utils.decode_range(ws['!ref']);
  let headerRow = null, roundCol = null, homeCol = null, awayCol = null, dateCol = null, resCol = null;
  for(let r = range.s.r; r <= Math.min(range.s.r + 2, range.e.r); r++){
    let rc=null, hc=null, ac=null, dc=null, sc=null;
    for(let c = range.s.c; c <= range.e.c; c++){
      const cell = ws[XLSX.utils.encode_cell({ r, c })];
      if(!cell || cell.v == null) continue;
      const label = String(cell.v).trim().toLowerCase();
      if(/^giornata$/.test(label)) rc = c;
      else if(/^(casa|squadra casa)$/.test(label)) hc = c;
      else if(/^(trasferta|squadra trasferta|ospite)$/.test(label)) ac = c;
      else if(/^data$/.test(label)) dc = c;
      else if(/^(risultato|esito|score)$/.test(label)) sc = c;
    }
    if(rc != null && hc != null && ac != null){ headerRow = r; roundCol = rc; homeCol = hc; awayCol = ac; dateCol = dc; resCol = sc; break; }
  }
  if(headerRow == null) return null;
  const matches = [];
  for(let r = headerRow + 1; r <= range.e.r; r++){
    const rc = ws[XLSX.utils.encode_cell({ r, c: roundCol })];
    const hc = ws[XLSX.utils.encode_cell({ r, c: homeCol })];
    const ac = ws[XLSX.utils.encode_cell({ r, c: awayCol })];
    if(!rc || rc.v == null || !hc || hc.v == null || !ac || ac.v == null) continue;
    const round = parseInt(rc.v, 10);
    if(!round) continue;
    const dc = dateCol != null ? ws[XLSX.utils.encode_cell({ r, c: dateCol })] : null;
    const sc = resCol != null ? ws[XLSX.utils.encode_cell({ r, c: resCol })] : null;
    matches.push({
      round, home: String(hc.v).trim(), away: String(ac.v).trim(),
      date: dc && dc.v != null ? String(dc.v).trim() : '',
      result: sc && sc.v != null ? String(sc.v).trim() : ''
    });
  }
  return matches.length ? matches : null;
}
/* "2-1", "2 - 1", "2:1" → chi ha vinto. Pareggio: nessuna delle due squadre
   ha vinto (coerente con "ha vinto"/"non ha vinto" usato negli esiti). */
function parseScore(raw){
  const m = String(raw || '').trim().match(/^(\d+)\s*[-:]\s*(\d+)$/);
  if(!m) return null;
  const h = parseInt(m[1],10), a = parseInt(m[2],10);
  if(h === a) return { home:'lose', away:'lose', draw:true };
  return h > a ? { home:'win', away:'lose', draw:false } : { home:'lose', away:'win', draw:false };
}
/* Importa SOLO il calendario da un file a parte (foglio "Calendario" con
   Giornata, Casa, Trasferta, e opzionalmente Risultato). Se una partita ha
   il risultato compilato ed è della giornata in corso, l'esito delle due
   squadre viene scritto subito — così non serve più segnarlo a mano nella
   scheda Esiti. Le giornate diverse da quella in corso aggiornano solo il
   calendario mostrato: gli esiti si applicano solo quando tocca a loro. */
async function importCalendarOnly(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:'array' });
  const matches = parseCalendarSheet(wb);
  if(!matches) throw new Error('Non trovo un foglio "Calendario" con le colonne Giornata, Casa, Trasferta.');
  if(!S.core) S.core = emptyCore();
  S.core.calendar = matches.map(m => ({ round:m.round, home:m.home, away:m.away, date:m.date }));
  await saveCore();

  let applied = 0;
  for(const m of matches){
    if(m.round !== S.core.round || !m.result) continue;
    const outcome = parseScore(m.result);
    if(!outcome) continue;
    const th = teamByName(m.home), ta = teamByName(m.away);
    await writeTeamResult(th.id, outcome.home, m.round);
    await writeTeamResult(ta.id, outcome.away, m.round);
    applied++;
  }
  return { matches: matches.length, applied };
}
function writeCalendarSheet(wb){
  const sn = wb.SheetNames.find(n => /calendario/i.test(n)) || 'Calendario';
  const aoa = [['Giornata','Casa','Trasferta','Data']];
  (S.core.calendar || []).forEach(m => aoa.push([m.round, m.home, m.away, m.date || '']));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  if(!wb.SheetNames.includes(sn)) wb.SheetNames.push(sn);
  wb.Sheets[sn] = ws;
}

/* ---- SCRITTURA ---- */
function ensureSheet(wb, game){
  let sn = S.core.sheetNames?.[game.key] && wb.Sheets[S.core.sheetNames[game.key]]
    ? S.core.sheetNames[game.key] : findSheet(wb, game);
  if(sn && parseGrid(wb.Sheets[sn])) return sn;

  /* foglio assente (tipico del ritorno la prima volta): lo creo da zero */
  const header = ['Partecipanti', ...S.core.teams.map(t => t.name)];
  for(let n = game.first; n <= game.last; n++) header.push('Giornata ' + n);
  if(game.kind === 'season') header.push('Totale Vittorie');
  const aoa = [ ['Tabella ' + game.name + ' - disponibilità'], header, ...S.core.players.map(p => [p.name]) ];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  sn = game.sheet;
  if(!wb.SheetNames.includes(sn)) wb.SheetNames.push(sn);
  wb.Sheets[sn] = ws;
  return sn;
}
function writeGameSheet(wb, game){
  const sn = ensureSheet(wb, game);
  const ws = wb.Sheets[sn];
  const grid = parseGrid(ws);
  if(!grid) return;
  const m = gmeta(game.key) || emptyGame();

  let lastCol = Math.max(grid.partCol, ...grid.teams.map(t => t.col),
    ...(grid.giornate.length ? grid.giornate.map(g => g.col) : [-1]),
    grid.winsCol == null ? -1 : grid.winsCol);
  const have = new Set(grid.giornate.map(g => g.num));
  for(let n = game.first; n <= game.last; n++){
    if(!have.has(n)){
      lastCol += 1;
      ws[XLSX.utils.encode_cell({ r: grid.headerRow, c: lastCol })] = { t:'s', v:'Giornata ' + n };
      grid.giornate.push({ col: lastCol, num: n });
    }
  }
  grid.giornate.sort((a,b) => a.num - b.num);
  let winsCol = grid.winsCol;
  if(game.kind === 'season' && winsCol == null){
    lastCol += 1; winsCol = lastCol;
    ws[XLSX.utils.encode_cell({ r: grid.headerRow, c: winsCol })] = { t:'s', v:'Totale Vittorie' };
  }

  const rowOf = {};
  for(let r = grid.firstDataRow; r <= grid.range.e.r; r++){
    const c = ws[XLSX.utils.encode_cell({ r, c: grid.partCol })];
    if(c && c.v != null) rowOf[String(c.v).trim().toLowerCase()] = r;
  }
  let appendRow = Math.max(grid.range.e.r, grid.firstDataRow - 1);

  S.core.players.forEach(p => {
    let row = rowOf[p.name.toLowerCase()];
    if(row == null){ row = ++appendRow; ws[XLSX.utils.encode_cell({ r: row, c: grid.partCol })] = { t:'s', v: p.name }; }
    const st = m.st[p.id] || { used:[] };

    const counts = {};
    (st.used || []).forEach(tid => { counts[tid] = (counts[tid] || 0) + 1; });
    grid.teams.forEach(t => {
      const addr = XLSX.utils.encode_cell({ r: row, c: t.col });
      const n = counts[slug(t.name)] || 0;
      if(!n) delete ws[addr];
      else if(game.kind === 'lms') ws[addr] = { t:'s', v:'X' };
      else ws[addr] = { t:'n', v: n };
    });

    grid.giornate.forEach(gi => {
      const addr = XLSX.utils.encode_cell({ r: row, c: gi.col });
      const h = m.history.find(x => x.round === gi.num);
      const e = h && h.entries.find(x => x.playerId === p.id);
      if(!e) delete ws[addr];
      else if(e.result === 'absent') ws[addr] = { t:'s', v:'ASSENTE' };
      else ws[addr] = { t:'s', v: (e.result === 'win' ? 'V' : 'NV') + ' (' + team(e.teamId).name + ')' };
    });

    if(winsCol != null) ws[XLSX.utils.encode_cell({ r: row, c: winsCol })] = { t:'n', v: winsIn(game.key, p.id) };
  });

  const maxRow = Math.max(grid.range.e.r, appendRow);
  const maxCol = Math.max(grid.range.e.c, lastCol, winsCol == null ? -1 : winsCol);
  ws['!ref'] = XLSX.utils.encode_range({ s:{ r: grid.range.s.r, c: grid.range.s.c }, e:{ r: maxRow, c: maxCol } });
}
function buildWorkbook(){
  if(!S.core || !S.core.players.length) throw new Error('Nessun partecipante caricato: non c\'è nulla da esportare.');
  let wb;
  if(S.core.originalB64) wb = XLSX.read(S.core.originalB64, { type:'base64' });
  else { wb = XLSX.utils.book_new(); }
  GAMES.forEach(g => writeGameSheet(wb, g));
  writeCalendarSheet(wb);
  return wb;
}
function downloadWorkbook(){
  try{
    const wb = buildWorkbook();
    const base = (S.core.fileName || 'FantaList.xlsx').replace(/\.xlsx?$/i, '');
    XLSX.writeFile(wb, base + '_G' + S.core.round + '.xlsx');
    toast('File Excel scaricato: contiene tutti e tre i minigiochi aggiornati.', 'ok');
  }catch(e){ toast('Non riesco a generare il file: ' + e.message, 'err'); }
}

function storageBanner(){
  const m = Store.mode();
  if(m === 'supabase') return '';
  if(m === 'artifact') return `<div class="banner">Stai usando l'anteprima: i dati sono condivisi tra chi apre questa stessa anteprima. Per il sito pubblico collega un archivio Supabase (istruzioni nel README).</div>`;
  return `<div class="banner err">Archivio non collegato: quello che salvi resta <strong>solo su questo dispositivo</strong>. Per far giocare tutti serve un archivio condiviso — <button class="btn-link" data-cfg>collega Supabase</button>.</div>`;
}
function wireStorageBanner(root){
  const b = root.querySelector('[data-cfg]');
  if(b) b.onclick = openBackendSetup;
}
async function openBackendSetup(){
  const ov = el(`<div class="overlay"></div>`);
  ov.appendChild(el(`
    <div class="modal">
      <h3>Collega l'archivio condiviso</h3>
      <p>Incolla i due valori del tuo progetto Supabase (li trovi in Project settings → API). Restano salvati su questo dispositivo; per il sito pubblico incollali anche nel blocco CONFIG in cima al file.</p>
      <label class="field" style="margin-bottom:12px;"><span>URL del progetto</span><input type="text" id="cfg-url" placeholder="https://xxxx.supabase.co"></label>
      <label class="field"><span>Chiave anon public</span><input type="text" id="cfg-key" placeholder="eyJhbGciOi…"></label>
      <div class="btn-row"><button class="btn btn-ghost" data-x>Annulla</button><button class="btn btn-primary" data-y>Collega</button></div>
    </div>`));
  document.body.appendChild(ov);
  const cfg = Store.config();
  if(cfg){ ov.querySelector('#cfg-url').value = cfg.url; ov.querySelector('#cfg-key').value = cfg.key; }
  ov.querySelector('[data-x]').onclick = () => ov.remove();
  ov.querySelector('[data-y]').onclick = () => {
    const url = ov.querySelector('#cfg-url').value.trim();
    const key = ov.querySelector('#cfg-key').value.trim();
    if(!url || !key){ toast('Servono entrambi i valori.', 'err'); return; }
    Store.setConfig({ supabaseUrl:url, supabaseAnonKey:key, tableName: CONFIG.tableName });
    location.reload();
  };
}
