<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FantaList — Minigioco</title>
<meta name="theme-color" content="#0A2A20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minigioco">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Gestione del minigioco della lega: pronostici dei partecipanti, approvazioni e risultati di giornata.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   FANTALIST — MINIGIOCO
   Identità visiva ereditata dal sito "La Lega": verde campo, rosa Gazzetta,
   ambra da tabellone. Anton per i titoli, Work Sans per il testo,
   Space Mono per numeri, orari e codici.
   ========================================================================= */
:root{
  --pitch:#0F3D2E;
  --pitch-dark:#0A2A20;
  --ink:#0B241C;
  --chalk:#F5F2EA;
  --chalk-soft:rgba(245,242,234,0.72);
  --chalk-mute:rgba(245,242,234,0.45);
  --gazzetta:#E8548C;
  --gazzetta-dark:#C93E70;
  --amber:#FFB627;
  --line:rgba(245,242,234,0.14);
  --ok:#57C98A;
  --ko:#F2635F;
  --radius:4px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--pitch);
  color:var(--chalk);
  font-family:'Work Sans',system-ui,sans-serif;
  line-height:1.5;
  min-height:100vh;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,0.025) 0 2px,transparent 2px 64px);
}
h1,h2,h3,.display{font-family:'Anton',sans-serif; text-transform:uppercase; letter-spacing:0.02em; font-weight:400;}
.mono{font-family:'Space Mono',monospace;}
a{color:var(--amber);}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}

/* ---------- SMARTPHONE ----------
   iOS Safari ingrandisce la pagina quando si tocca un campo con testo
   sotto i 16px: qui li portiamo a 16px per evitarlo. In più diamo aria
   sotto la barra di navigazione e bersagli grandi abbastanza per il dito. */
@media (max-width:820px){
  input[type=text],input[type=password],input[type=datetime-local],input[type=number],select,textarea{font-size:16px;}
  .btn{padding:13px 18px;}
  .btn-sm{padding:9px 13px; font-size:0.8rem;}
  .team-btn{padding:12px 11px;}
  .btn-link{padding:6px 2px;}
  body{padding-bottom:env(safe-area-inset-bottom);}
  .topbar-inner{padding:12px 16px;}
}
@media (max-width:420px){
  .team-grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));}
}

/* ---------- TOPBAR ---------- */
.topbar{
  position:sticky; top:0; z-index:60;
  background:var(--pitch-dark); border-bottom:2px solid var(--gazzetta);
}
.topbar-inner{
  max-width:1080px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px; font-family:'Anton',sans-serif; font-size:1.25rem; letter-spacing:0.03em;}
.brand .dot{width:10px; height:10px; border-radius:50%; background:var(--gazzetta); box-shadow:0 0 0 3px rgba(232,84,140,0.25);}
.brand small{display:block; font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:0.16em; color:var(--chalk-mute); text-transform:uppercase; margin-top:2px;}
.who{display:flex; align-items:center; gap:10px; font-size:0.85rem;}
.who .badge-user{
  font-family:'Space Mono',monospace; font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase;
  background:rgba(255,182,39,0.12); color:var(--amber); border:1px solid rgba(255,182,39,0.35);
  padding:4px 9px; border-radius:2px;
}
.who .badge-user.admin{background:rgba(232,84,140,0.14); color:var(--gazzetta); border-color:rgba(232,84,140,0.4);}

/* ---------- LAYOUT ---------- */
.shell{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:26px 20px 90px;}
.stack{display:flex; flex-direction:column; gap:18px;}
.grid-2{display:grid; grid-template-columns:1.15fr 0.85fr; gap:18px; align-items:start;}
@media (max-width:860px){.grid-2{grid-template-columns:1fr;}}

.panel{background:var(--ink); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
.panel-head{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:13px 18px; border-bottom:1px solid var(--line); background:rgba(245,242,234,0.03);
}
.panel-head h2{font-size:1.02rem;}
.panel-head .eyebrow{font-family:'Space Mono',monospace; font-size:0.68rem; letter-spacing:0.14em; color:var(--amber); text-transform:uppercase;}
.panel-body{padding:18px;}
.panel-body > * + *{margin-top:14px;}
.note{font-size:0.87rem; color:var(--chalk-soft);}
.note-dim{font-size:0.8rem; color:var(--chalk-mute);}
.empty{
  border:1px dashed var(--line); border-radius:var(--radius); padding:22px 18px; text-align:center;
  color:var(--chalk-mute); font-size:0.88rem;
}

/* ---------- TABS ---------- */
.tabs{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:18px; border-bottom:1px solid var(--line); padding-bottom:10px;}
.tab{
  font-family:'Space Mono',monospace; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase;
  padding:9px 14px; border-radius:2px; border:1px solid transparent; background:transparent;
  color:var(--chalk-mute); cursor:pointer;
}
.tab:hover{color:var(--chalk); background:rgba(245,242,234,0.06);}
.tab.on{color:var(--ink); background:var(--amber); font-weight:700;}
.tab .count{
  display:inline-block; margin-left:7px; background:var(--gazzetta); color:var(--chalk);
  border-radius:10px; padding:0 6px; font-size:0.66rem;
}
.tab.on .count{background:var(--ink); color:var(--amber);}

/* ---------- BUTTONS ---------- */
button{font-family:'Work Sans',sans-serif; cursor:pointer; border:none; border-radius:2px; transition:filter .15s, background .15s, color .15s;}
button:disabled{opacity:0.42; cursor:not-allowed;}
.btn{padding:11px 18px; font-size:0.92rem; font-weight:600;}
.btn-primary{background:var(--amber); color:var(--ink);}
.btn-primary:hover:not(:disabled){filter:brightness(1.08);}
.btn-pink{background:var(--gazzetta); color:var(--chalk);}
.btn-pink:hover:not(:disabled){background:var(--gazzetta-dark);}
.btn-ghost{background:transparent; border:1px solid var(--line); color:var(--chalk-soft); padding:10px 16px; font-size:0.88rem;}
.btn-ghost:hover:not(:disabled){border-color:var(--amber); color:var(--amber);}
.btn-sm{padding:7px 12px; font-size:0.78rem; font-weight:600;}
.btn-ok{background:rgba(87,201,138,0.14); border:1px solid rgba(87,201,138,0.45); color:var(--ok);}
.btn-ok:hover:not(:disabled){background:var(--ok); color:var(--ink);}
.btn-ko{background:rgba(242,99,95,0.12); border:1px solid rgba(242,99,95,0.42); color:var(--ko);}
.btn-ko:hover:not(:disabled){background:var(--ko); color:var(--ink);}
.btn-ok.on{background:var(--ok); color:var(--ink);}
.btn-ko.on{background:var(--ko); color:var(--ink);}
.btn-row{display:flex; gap:8px; flex-wrap:wrap;}
.btn-link{background:none; border:none; color:var(--amber); font-size:0.8rem; text-decoration:underline; padding:2px;}

/* ---------- FORMS ---------- */
label.field{display:block;}
label.field span{
  display:block; font-family:'Space Mono',monospace; font-size:0.66rem; letter-spacing:0.12em;
  text-transform:uppercase; color:var(--chalk-mute); margin-bottom:6px;
}
input[type=text],input[type=password],input[type=datetime-local],input[type=number],select,textarea{
  width:100%; background:var(--pitch-dark); border:1px solid var(--line); color:var(--chalk);
  padding:11px 13px; border-radius:2px; font-size:0.95rem; font-family:'Work Sans',sans-serif;
}
input::placeholder,textarea::placeholder{color:rgba(245,242,234,0.3);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--amber); outline-offset:1px;}
input[type=file]{color:var(--chalk-soft); font-size:0.85rem; max-width:100%;}
input[type=file]::file-selector-button{
  background:var(--amber); color:var(--ink); border:none; padding:9px 14px; border-radius:2px;
  font-weight:700; font-family:'Work Sans',sans-serif; cursor:pointer; margin-right:10px;
}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:620px){.form-grid{grid-template-columns:1fr;}}
.checkline{display:flex; align-items:flex-start; gap:9px; font-size:0.88rem; color:var(--chalk-soft);}
.checkline input{margin-top:3px; accent-color:var(--amber);}

/* ---------- GATE (login / registrazione / setup) ---------- */
.gate{max-width:460px; margin:40px auto 0;}
.gate .lead{text-align:center; margin-bottom:22px;}
.gate .lead h1{font-size:clamp(2rem,7vw,2.9rem); line-height:0.98;}
.gate .lead h1 em{font-style:normal; color:var(--gazzetta);}
.gate .lead p{color:var(--chalk-soft); margin-top:10px; font-size:0.94rem;}
.switcher{display:flex; gap:0; border:1px solid var(--line); border-radius:2px; overflow:hidden; margin-bottom:18px;}
.switcher button{flex:1; padding:11px; background:transparent; color:var(--chalk-mute); font-family:'Space Mono',monospace; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase;}
.switcher button.on{background:var(--gazzetta); color:var(--chalk); font-weight:700;}

/* ---------- SCHEDINA (elemento firma) ---------- */
.slip{
  position:relative; background:var(--chalk); color:var(--ink);
  border-radius:2px; padding:22px 20px 20px; margin-top:8px; overflow:hidden;
}
.slip::before{
  content:""; position:absolute; top:-1px; left:0; right:0; height:9px;
  background-image:radial-gradient(circle at 8px 0, var(--ink) 5px, transparent 5.5px);
  background-size:16px 9px; background-repeat:repeat-x;
}
.slip.on-pitch::before{background-image:radial-gradient(circle at 8px 0, var(--pitch) 5px, transparent 5.5px);}
.slip-head{
  display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;
  border-bottom:2px solid var(--ink); padding-bottom:9px; margin-bottom:14px;
}
.slip-head .who-slip{font-family:'Anton',sans-serif; font-size:1.25rem; text-transform:uppercase;}
.slip-head .code{font-family:'Space Mono',monospace; font-size:0.7rem; letter-spacing:0.1em; color:rgba(11,36,28,0.6);}
.slip-pick{display:flex; align-items:center; gap:11px; font-family:'Anton',sans-serif; font-size:1.6rem; text-transform:uppercase;}
.slip-pick .dot{width:15px; height:15px; border-radius:50%; flex:none; box-shadow:0 0 0 1px rgba(11,36,28,0.35);}
.slip-meta{font-family:'Space Mono',monospace; font-size:0.72rem; color:rgba(11,36,28,0.62); margin-top:6px;}
.stamp{
  position:absolute; right:14px; bottom:14px; transform:rotate(-11deg);
  font-family:'Anton',sans-serif; font-size:0.9rem; letter-spacing:0.16em; text-transform:uppercase;
  border:3px double currentColor; border-radius:3px; padding:5px 12px; opacity:0.85;
}
.stamp.ok{color:#1E7F4E;}
.stamp.pending{color:#B07600;}
.stamp.ko{color:#B3312D;}
.stamp.win{color:#1E7F4E;}
.stamp.lose{color:#B3312D;}

/* ---------- SELETTORE SQUADRE ---------- */
.team-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:8px;}
.team-btn{
  display:flex; align-items:center; gap:8px; text-align:left;
  background:var(--pitch-dark); border:1px solid var(--line); color:var(--chalk);
  padding:10px 11px; font-size:0.86rem; font-weight:500; border-radius:2px;
}
.team-btn .dot{width:11px; height:11px; border-radius:50%; flex:none;}
.team-btn:hover:not(:disabled){border-color:var(--amber);}
.team-btn.on{background:var(--amber); color:var(--ink); border-color:var(--amber); font-weight:700;}
.team-btn.used{opacity:0.32; text-decoration:line-through; cursor:not-allowed;}

/* ---------- RIGHE RICHIESTA (tabellone) ---------- */
.board{display:flex; flex-direction:column; gap:8px;}
.req{
  display:grid; grid-template-columns:1.1fr 1fr auto; gap:12px; align-items:center;
  background:var(--pitch-dark); border:1px solid var(--line); border-left:3px solid var(--line);
  border-radius:2px; padding:12px 14px;
}
.req.pending{border-left-color:var(--amber);}
.req.approved{border-left-color:var(--ok);}
.req.rejected{border-left-color:var(--ko);}
.req.missing{border-left-color:rgba(245,242,234,0.2); opacity:0.75;}
.req .p-name{font-weight:600; font-size:0.95rem;}
.req .p-sub{font-family:'Space Mono',monospace; font-size:0.68rem; color:var(--chalk-mute); letter-spacing:0.06em;}
.req .p-team{display:flex; align-items:center; gap:9px; font-size:0.95rem;}
.req .p-team .dot{width:11px; height:11px; border-radius:50%; flex:none;}
.req .p-actions{display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap;}
@media (max-width:700px){
  .req{grid-template-columns:1fr; align-items:flex-start;}
  .req .p-actions{justify-content:flex-start;}
}
.tag{
  font-family:'Space Mono',monospace; font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase;
  padding:3px 7px; border-radius:2px; border:1px solid currentColor; white-space:nowrap;
}
.tag.ok{color:var(--ok);} .tag.pending{color:var(--amber);} .tag.ko{color:var(--ko);} .tag.mute{color:var(--chalk-mute);}
.warn-inline{color:var(--ko); font-size:0.76rem; font-family:'Space Mono',monospace;}

/* ---------- TABELLE / STORICO ---------- */
.table-scroll{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:0.88rem;}
.code-cell{letter-spacing:0.08em; color:var(--amber); cursor:pointer; user-select:all;}
.code-cell.hidden-code{letter-spacing:0.16em; color:var(--chalk-mute); cursor:pointer; user-select:none;}
th{
  text-align:left; font-family:'Space Mono',monospace; font-size:0.66rem; letter-spacing:0.1em;
  text-transform:uppercase; color:var(--chalk-mute); padding:9px 10px; border-bottom:1px solid var(--line);
}
td{padding:10px; border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
td.num{font-family:'Space Mono',monospace; color:var(--chalk-mute);}
.out-row{opacity:0.5;}
.chip-mini{
  display:inline-flex; align-items:center; gap:5px; font-family:'Space Mono',monospace; font-size:0.66rem;
  background:rgba(245,242,234,0.06); padding:3px 7px; border-radius:2px; margin:2px 3px 2px 0;
}
.chip-mini .dot{width:8px; height:8px; border-radius:50%;}
.res-win{color:var(--ok); font-weight:700;}
.res-lose{color:var(--ko); font-weight:700;}

/* ---------- SCOREBOARD ---------- */
.scoreboard{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1px; background:var(--line);}
.sb-cell{background:var(--ink); padding:15px 14px;}
.sb-cell .k{font-family:'Space Mono',monospace; font-size:0.62rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--chalk-mute);}
.sb-cell .v{font-family:'Anton',sans-serif; font-size:1.9rem; line-height:1.1; color:var(--amber); margin-top:3px;}
.sb-cell .v.small{font-size:1.1rem; color:var(--chalk);}
.sb-cell.alert .v{color:var(--gazzetta);}

/* ---------- BANNER / TOAST / MODALE ---------- */
.banner{border:1px solid var(--line); border-left:3px solid var(--amber); border-radius:2px; padding:12px 15px; font-size:0.87rem; color:var(--chalk-soft); background:rgba(255,182,39,0.06);}
.banner.err{border-left-color:var(--ko); background:rgba(242,99,95,0.08); color:#FFD3D1;}
.banner.ok{border-left-color:var(--ok); background:rgba(87,201,138,0.08); color:#CFF3E0;}
.toast-wrap{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; width:min(420px,calc(100% - 32px));}
.toast{background:var(--ink); border:1px solid var(--line); border-left:3px solid var(--amber); padding:12px 15px; font-size:0.87rem; box-shadow:0 12px 34px rgba(0,0,0,0.45); border-radius:2px;}
.toast.err{border-left-color:var(--ko);} .toast.ok{border-left-color:var(--ok);}
.overlay{position:fixed; inset:0; background:rgba(5,20,14,0.76); display:flex; align-items:center; justify-content:center; padding:20px; z-index:300;}
.modal{background:var(--ink); border:1px solid var(--line); border-top:3px solid var(--gazzetta); border-radius:2px; padding:22px; width:min(420px,100%); box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.modal h3{font-size:1.1rem; margin-bottom:8px;}
.modal p{font-size:0.88rem; color:var(--chalk-soft); margin-bottom:14px;}
.modal .btn-row{justify-content:flex-end; margin-top:16px;}
.hidden{display:none !important;}
.spinner{display:inline-block; width:14px; height:14px; border:2px solid rgba(245,242,234,0.25); border-top-color:var(--amber); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-2px;}
@keyframes spin{to{transform:rotate(360deg);}}
footer.site{max-width:1080px; margin:0 auto; padding:0 20px 40px; color:var(--chalk-mute); font-size:0.75rem; font-family:'Space Mono',monospace; letter-spacing:0.06em;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="dot"></span>
      <span>FantaList<small>Minigioco · ultimo in piedi</small></span>
    </div>
    <div class="who" id="who"></div>
  </div>
</div>

<main class="shell" id="app"><div class="empty">Caricamento…</div></main>
<footer class="site" id="foot"></footer>
<div class="toast-wrap" id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* =========================================================================
   1. CONFIGURAZIONE — L'UNICO BLOCCO DA MODIFICARE A MANO
   -------------------------------------------------------------------------
   Per far funzionare il sito online (più persone, più dispositivi) serve un
   archivio condiviso. Il modo più semplice e gratuito è Supabase:
   crea un progetto, esegui la query SQL che trovi nel README, poi incolla
   qui sotto l'URL del progetto e la chiave "anon public".
   Finché restano vuoti il sito funziona lo stesso, ma i dati restano
   solo su questo dispositivo (utile per provarlo).
   ========================================================================= */
const CONFIG = {
  supabaseUrl:     "https://blnrucninethpwvhlcsc.supabase.co",           // es. "https://abcdefgh.supabase.co"
  supabaseAnonKey: "sb_publishable_89xr7FlglRmI6xWdsbmEwQ_Yrkc1lDF",           // la chiave "anon public" del progetto
  tableName:       "fantalist_kv"
};

/* =========================================================================
   2. ARCHIVIO — un semplice magazzino chiave/valore con tre modalità
   ========================================================================= */
const Store = (() => {
  let mode = 'local', sb = null;

  function readLocalCfg(){
    try { return JSON.parse(localStorage.getItem('fantalist.backend') || 'null'); } catch(e){ return null; }
  }
  function writeLocalCfg(cfg){
    if(cfg) localStorage.setItem('fantalist.backend', JSON.stringify(cfg));
    else localStorage.removeItem('fantalist.backend');
  }
  function init(){
    const cfg = (CONFIG.supabaseUrl && CONFIG.supabaseAnonKey) ? CONFIG : readLocalCfg();
    if(cfg && cfg.supabaseUrl && cfg.supabaseAnonKey){
      sb = { url: String(cfg.supabaseUrl).trim().replace(/\/+$/,'').replace(/\/rest\/v1$/i,''), key: cfg.supabaseAnonKey, table: cfg.tableName || 'fantalist_kv' };
      mode = 'supabase';
    } else if(typeof window.storage === 'object' && window.storage && typeof window.storage.get === 'function'){
      mode = 'artifact';
    } else {
      mode = 'local';
    }
    return mode;
  }
  const H = () => ({ apikey: sb.key, Authorization: 'Bearer ' + sb.key, 'Content-Type': 'application/json' });
  async function sbFetch(path, opts){
    const r = await fetch(sb.url + '/rest/v1/' + sb.table + path, opts);
    if(!r.ok){
      let msg = 'HTTP ' + r.status;
      try { const j = await r.json(); msg = j.message || j.hint || msg; } catch(e){}
      throw new Error(msg);
    }
    return r;
  }

  const LP = 'fl:';
  return {
    init, mode: () => mode, config: () => sb,
    setConfig(cfg){ writeLocalCfg(cfg); },
    clearConfig(){ writeLocalCfg(null); },

    async get(key){
      try{
        if(mode === 'supabase'){
          const r = await sbFetch('?k=eq.' + encodeURIComponent(key) + '&select=v', { headers: H() });
          const j = await r.json();
          return j.length ? JSON.parse(j[0].v) : null;
        }
        if(mode === 'artifact'){
          const r = await window.storage.get(key, true);
          return (r && r.value) ? JSON.parse(r.value) : null;
        }
        const raw = localStorage.getItem(LP + key);
        return raw ? JSON.parse(raw) : null;
      }catch(e){
        if(mode === 'supabase') throw e;
        return null;   // chiave inesistente: le altre modalità lanciano eccezione
      }
    },

    async set(key, value){
      const s = JSON.stringify(value);
      if(mode === 'supabase'){
        await sbFetch('', { method:'POST', headers:{ ...H(), Prefer:'resolution=merge-duplicates,return=minimal' },
                            body: JSON.stringify({ k:key, v:s }) });
        return;
      }
      if(mode === 'artifact'){ await window.storage.set(key, s, true); return; }
      localStorage.setItem(LP + key, s);
    },

    async del(key){
      if(mode === 'supabase'){ await sbFetch('?k=eq.' + encodeURIComponent(key), { method:'DELETE', headers:H() }); return; }
      if(mode === 'artifact'){ try{ await window.storage.delete(key, true); }catch(e){} return; }
      localStorage.removeItem(LP + key);
    },

    /* restituisce [{key, value}] per tutte le chiavi che iniziano con "prefix" */
    async list(prefix){
      if(mode === 'supabase'){
        const r = await sbFetch('?k=like.' + encodeURIComponent(prefix + '*') + '&select=k,v', { headers:H() });
        const j = await r.json();
        return j.map(row => { try{ return { key: row.k, value: JSON.parse(row.v) }; }catch(e){ return null; } }).filter(Boolean);
      }
      if(mode === 'artifact'){
        let keys = [];
        try{ const res = await window.storage.list(prefix, true); keys = (res && res.keys) ? res.keys : []; }catch(e){ keys = []; }
        const out = [];
        for(const k of keys){
          try{ const r = await window.storage.get(k, true); if(r && r.value) out.push({ key:k, value: JSON.parse(r.value) }); }catch(e){}
        }
        return out;
      }
      const out = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(LP + prefix)){
          try{ out.push({ key:k.slice(LP.length), value: JSON.parse(localStorage.getItem(k)) }); }catch(e){}
        }
      }
      return out;
    }
  };
})();

/* =========================================================================
   3. PASSWORD — PBKDF2 (SHA-256, 150.000 giri) con sale casuale per utente
   ========================================================================= */
const toHex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
const fromHex = hex => new Uint8Array(hex.match(/.{1,2}/g).map(b => parseInt(b,16)));
function randomHex(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return toHex(a); }

async function derive(password, saltHex, iterations = 150000){
  if(!crypto.subtle) throw new Error('Il browser non supporta la cifratura richiesta: apri il sito su https.');
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name:'PBKDF2', salt: fromHex(saltHex), iterations, hash:'SHA-256' }, key, 256);
  return toHex(bits);
}

/* Codice di accesso facile da dettare al telefono: niente caratteri ambigui. */
function generateCode(){
  const A = 'abcdefghijkmnpqrstuvwxyz', N = '23456789';
  const pick = set => set[Math.floor(Math.random() * set.length)];
  let out = '';
  for(let i=0;i<4;i++) out += pick(A);
  for(let i=0;i<3;i++) out += pick(N);
  return out;
}

function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  return d.toLocaleString('it-IT', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function toInputDT(iso){
  if(!iso) return '';
  const d = new Date(iso); if(isNaN(d)) return '';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function copyText(text){
  const done = () => toast('Copiato negli appunti.', 'ok');
  if(navigator.clipboard?.writeText){ navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); }
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('Copia non riuscita: seleziona il testo a mano.', 'err'); }
  ta.remove();
}

function toast(message, kind = ''){
  const box = el(`<div class="toast ${kind}">${esc(message)}</div>`);
  document.getElementById('toasts').appendChild(box);
  setTimeout(() => box.remove(), 4200);
}
function modal({ title, message, input = null, placeholder = '', prefill = '', confirmText = 'Conferma', cancelText = 'Annulla' }){
  return new Promise(resolve => {
    const ov = el(`<div class="overlay"></div>`);
    const box = el(`
      <div class="modal" role="dialog" aria-modal="true">
        <h3>${esc(title)}</h3>
        ${message ? `<p>${esc(message)}</p>` : ''}
        ${input ? `<input type="${input}" placeholder="${esc(placeholder)}" value="${esc(prefill)}">` : ''}
        <div class="btn-row">
          <button class="btn btn-ghost" data-x>${esc(cancelText)}</button>
          <button class="btn btn-primary" data-y>${esc(confirmText)}</button>
        </div>
      </div>`);
    ov.appendChild(box); document.body.appendChild(ov);
    const inp = box.querySelector('input');
    if(inp) setTimeout(() => { inp.focus(); inp.select(); }, 40);
    const done = v => { ov.remove(); resolve(v); };
    box.querySelector('[data-x]').onclick = () => done(input ? null : false);
    box.querySelector('[data-y]').onclick = () => done(input ? inp.value : true);
    if(inp) inp.onkeydown = e => { if(e.key === 'Enter') done(inp.value); if(e.key === 'Escape') done(null); };
    ov.onclick = e => { if(e.target === ov) done(input ? null : false); };
  });
}

const team = id => (S.meta?.teams || []).find(t => t.id === id) || { id, name: id || '—', color:'#8A8A8A' };

function availableTeams(p){
  const used = new Set(p.usedTeamIds || []);
  return (S.meta.teams || []).map(t => ({ ...t, used: used.has(t.id) }));
}
function approvedPicks(){
  const out = {};
  for(const [pid, r] of Object.entries(S.requests)) if(r.status === 'approved') out[pid] = r.teamId;
  return out;
}
function allApproved(){
  const a = activePlayers();
  const ap = approvedPicks();
  return a.length > 0 && a.every(p => ap[p.id]);
}
function allResulted(){
  const ap = approvedPicks();
  const ids = [...new Set(Object.values(ap))];
  return ids.length > 0 && ids.every(t => S.results[t]);
}

const SESSION_KEY = 'fantalist.session';

async function findUser(username){
  return await Store.get(K.user(slug(username)));
}
/* Il nome utente di un partecipante non si sceglie: è il suo nome nel file Excel,
   normalizzato (Peppe Verbaro -> peppe-verbaro). Così l'organizzatore sa sempre
   con quale nome accede ciascuno. */
function usernameFor(p){ return String(p.id).replace(/^p-/, ''); }

async function createUser({ username, password, role, playerId, displayName }){
  const u = slug(username);
  if(u.length < 3) throw new Error('Il nome utente deve avere almeno 3 caratteri.');
  if(password.length < 6) throw new Error('Il codice di accesso deve avere almeno 6 caratteri.');
  if(await findUser(u)) throw new Error('Questo nome utente è già stato preso.');
  const salt = randomHex(16);
  const rec = {
    username: u, displayName: displayName || username, role: role || 'player',
    playerId: playerId || null, salt, hash: await derive(password, salt),
    password,                                  // leggibile: serve all'organizzatore
    createdAt: new Date().toISOString()
  };
  await Store.set(K.user(u), rec);
  if(playerId) await Store.set(K.claim(playerId), u);
  return rec;
}
async function login(username, password){
  const rec = await findUser(username);
  if(!rec) throw new Error('Nome utente o password non validi.');
  const h = await derive(password, rec.salt);
  if(h !== rec.hash) throw new Error('Nome utente o password non validi.');
  localStorage.setItem(SESSION_KEY, JSON.stringify({ username: rec.username, verifier: h }));
  S.me = rec;
  return rec;
}
async function restoreSession(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }catch(e){}
  if(!s) return null;
  const rec = await findUser(s.username);
  if(rec && rec.hash === s.verifier){ S.me = rec; return rec; }
  localStorage.removeItem(SESSION_KEY);
  return null;
}
function logout(){
  localStorage.removeItem(SESSION_KEY);
  S.me = null; S.tab = null;
  render();
}
async function changePassword(username, newPassword){
  const rec = await findUser(username);
  if(!rec) throw new Error('Account non trovato.');
  if(newPassword.length < 6) throw new Error('Il codice di accesso deve avere almeno 6 caratteri.');
  rec.salt = randomHex(16);
  rec.hash = await derive(newPassword, rec.salt);
  rec.password = newPassword;
  await Store.set(K.user(rec.username), rec);
  if(S.me && S.me.username === rec.username){
    localStorage.setItem(SESSION_KEY, JSON.stringify({ username: rec.username, verifier: rec.hash }));
    S.me = rec;
  }
  return rec;
}

async function submitRequest(playerId, teamId, byAdmin = false){
  const p = player(playerId);
  if(!p) throw new Error('Partecipante non trovato.');
  if((p.usedTeamIds || []).includes(teamId)) throw new Error('Questa squadra è già stata usata da ' + p.name + '.');
  if(!byAdmin && deadlinePassed()) throw new Error('Il termine per questa giornata è scaduto: scrivi all\'organizzatore.');
  const prev = S.requests[playerId];
  const rec = {
    teamId,
    status: (byAdmin || S.meta.autoApprove) ? 'approved' : 'pending',
    note: '',
    sentAt: new Date().toISOString(),
    sentBy: S.me ? S.me.username : 'sistema',
    decidedAt: (byAdmin || S.meta.autoApprove) ? new Date().toISOString() : null,
    decidedBy: (byAdmin || S.meta.autoApprove) ? (S.me ? S.me.username : 'sistema') : null,
    history: [ ...((prev && prev.history) || []), ...(prev ? [{ teamId: prev.teamId, status: prev.status, at: prev.sentAt }] : []) ]
  };
  await Store.set(K.req(S.meta.round, playerId), rec);
  S.requests[playerId] = rec;
}
async function decideRequest(playerId, status, note = ''){
  const rec = S.requests[playerId];
  if(!rec) return;
  rec.status = status; rec.note = note;
  rec.decidedAt = new Date().toISOString();
  rec.decidedBy = S.me ? S.me.username : 'organizzatore';
  await Store.set(K.req(S.meta.round, playerId), rec);
  S.requests[playerId] = rec;
}
async function setResult(teamId, result){
  if(S.results[teamId] === result){
    await Store.del(K.res(S.meta.round, teamId));
    delete S.results[teamId];
  } else {
    await Store.set(K.res(S.meta.round, teamId), result);
    S.results[teamId] = result;
  }
}

async function closeRound(){
  if(!allApproved() || !allResulted()) return;
  const ap = approvedPicks();
  const entries = [], eliminatedIds = [];
  activePlayers().forEach(p => {
    const teamId = ap[p.id];
    const result = S.results[teamId];
    entries.push({ playerId: p.id, teamId, result });
    p.usedTeamIds = [ ...(p.usedTeamIds || []), teamId ];
    if(result === 'lose'){ p.eliminated = true; p.eliminatedRound = S.meta.round; eliminatedIds.push(p.id); }
  });
  S.meta.history.push({ round: S.meta.round, entries, eliminatedIds, closedAt: new Date().toISOString() });

  const still = activePlayers();
  if(still.length <= 1){
    S.meta.phase = 'finished';
    S.meta.winners = still.length === 1 ? [still[0].id] : eliminatedIds;
  } else {
    S.meta.round += 1;
  }
  S.meta.deadline = null;
  await saveMeta();
  await loadRound();
  toast(S.meta.phase === 'finished' ? 'Minigioco concluso.' : 'Giornata chiusa. Si riparte dalla ' + S.meta.round + '.', 'ok');
  render();
}

async function reopenRound(){
  const last = S.meta.history[S.meta.history.length - 1];
  if(!last) return;
  if(S.meta.phase === 'finished'){ S.meta.phase = 'playing'; S.meta.winners = []; }
  else { S.meta.round = last.round; }
  last.entries.forEach(e => {
    const p = player(e.playerId);
    if(!p) return;
    const i = (p.usedTeamIds || []).lastIndexOf(e.teamId);
    if(i >= 0) p.usedTeamIds.splice(i, 1);
    if(p.eliminatedRound === last.round){ p.eliminated = false; p.eliminatedRound = null; }
  });
  S.meta.history.pop();
  await saveMeta();
  await loadRound();
  toast('Giornata ' + last.round + ' riaperta.', 'ok');
  render();
}

/* =========================================================================
   9. FOGLIO EXCEL — lettura e scrittura (formato FantaList_2627.xlsx)
   Il foglio "Minigioco" ha: colonna Partecipanti, una colonna per squadra
   (X = squadra già usata) e una colonna per giornata ("V (Squadra)" se la
   squadra ha vinto, "NV (Squadra)" se non ha vinto).
   ========================================================================= */
function b64FromBuffer(buffer){
  let bin = ''; const bytes = new Uint8Array(buffer), chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  return btoa(bin);
}
function parseGrid(ws){
  if(!ws || !ws['!ref']) return null;
  const range = XLSX.utils.decode_range(ws['!ref']);
  const scan = row => {
    let partCol = null; const teams = [], giornate = [];
    for(let c = range.s.c; c <= range.e.c; c++){
      const cell = ws[XLSX.utils.encode_cell({ r: row, c })];
      if(!cell || cell.v == null || cell.v === '') continue;
      const label = String(cell.v).trim();
      if(/^partecipant/i.test(label)) partCol = c;
      else if(/^giornata\s*\d+/i.test(label)) giornate.push({ col:c, num: parseInt(label.match(/\d+/)[0], 10) });
      else teams.push({ col:c, name: label });
    }
    return { partCol, teams, giornate };
  };
  for(let r = range.s.r; r <= Math.min(range.s.r + 3, range.e.r); r++){
    const res = scan(r);
    if(res.partCol != null && res.teams.length > 0){
      res.giornate.sort((a,b) => a.num - b.num);
      return { range, headerRow: r, firstDataRow: r + 1, ...res };
    }
  }
  return null;
}
function readEligibleNames(wb){
  /* Foglio "Partecipanti e Premi": tiene solo chi ha la x sulla quota minigiochi */
  const name = wb.SheetNames.find(n => /partecipant/i.test(n) && !/minigioco/i.test(n));
  if(!name) return null;
  const ws = wb.Sheets[name];
  if(!ws || !ws['!ref']) return null;
  const range = XLSX.utils.decode_range(ws['!ref']);
  for(let r = range.s.r; r <= Math.min(range.s.r + 4, range.e.r); r++){
    let nameCol = null, quotaCol = null;
    for(let c = range.s.c; c <= range.e.c; c++){
      const cell = ws[XLSX.utils.encode_cell({ r, c })];
      if(!cell || cell.v == null) continue;
      const lbl = String(cell.v).trim();
      if(/^partecipant/i.test(lbl) && nameCol === null) nameCol = c;
      else if(/minigioch/i.test(lbl)) quotaCol = c;
    }
    if(nameCol !== null && quotaCol !== null){
      const set = new Set();
      for(let rr = r + 1; rr <= range.e.r; rr++){
        const n = ws[XLSX.utils.encode_cell({ r: rr, c: nameCol })];
        const q = ws[XLSX.utils.encode_cell({ r: rr, c: quotaCol })];
        if(n && n.v && q && String(q.v).trim().toLowerCase() === 'x') set.add(String(n.v).trim().toLowerCase());
      }
      return set.size ? set : null;
    }
  }
  return null;
}

async function importWorkbook(file, opts){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:'array' });
  const sheetName = wb.SheetNames.find(n => /minigioco/i.test(n)) || wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const grid = parseGrid(ws);
  if(!grid) throw new Error('Nel foglio "' + sheetName + '" non trovo la riga di intestazione con "Partecipanti" e i nomi delle squadre.');

  const teams = grid.teams.map((t,i) => ({ id: slug(t.name), name: t.name, color: teamColor(t.name, i) }));
  const eligible = opts.onlyPaying ? readEligibleNames(wb) : null;

  const players = []; const seen = new Set(); let maxRound = 0;
  const historyByRound = {};

  for(let r = grid.firstDataRow; r <= grid.range.e.r; r++){
    const cell = ws[XLSX.utils.encode_cell({ r, c: grid.partCol })];
    if(!cell || cell.t === 'e' || cell.v == null) continue;
    const name = String(cell.v).trim();
    if(!name) continue;
    if(opts.skipPlaceholders && isPlaceholder(name)) continue;
    if(eligible && !eligible.has(name.toLowerCase())) continue;

    let id = 'p-' + slug(name), n = 2;
    while(seen.has(id)) id = 'p-' + slug(name) + '-' + (n++);
    seen.add(id);

    const p = { id, name, usedTeamIds: [], eliminated: false, eliminatedRound: null, rowIndex: r };

    const marked = [];
    grid.teams.forEach((t,i) => {
      const c = ws[XLSX.utils.encode_cell({ r, c: t.col })];
      if(c && c.v != null && String(c.v).trim().toUpperCase() === 'X') marked.push(teams[i].id);
    });

    const entries = [];
    grid.giornate.forEach(g => {
      const c = ws[XLSX.utils.encode_cell({ r, c: g.col })];
      if(!c || c.v == null) return;
      const m = String(c.v).trim().match(/^(V|NV)\s*\(([^)]+)\)$/i);
      if(!m) return;
      const label = m[2].trim();
      const t = teams.find(x => x.name.toLowerCase() === label.toLowerCase()) || teams.find(x => x.id === slug(label));
      if(!t) return;
      entries.push({ round: g.num, teamId: t.id, result: m[1].toUpperCase() === 'V' ? 'win' : 'lose' });
      if(g.num > maxRound) maxRound = g.num;
    });
    entries.sort((a,b) => a.round - b.round);

    p.usedTeamIds = entries.map(e => e.teamId);
    const lost = entries.find(e => e.result === 'lose');
    if(lost){ p.eliminated = true; p.eliminatedRound = lost.round; }

    entries.forEach(e => {
      (historyByRound[e.round] = historyByRound[e.round] || []).push({ playerId: p.id, teamId: e.teamId, result: e.result });
    });

    /* una X su una squadra senza esito = pronostico già dato per la giornata in corso */
    const usedSet = new Set(p.usedTeamIds);
    p._pending = !p.eliminated ? (marked.find(t => !usedSet.has(t)) || null) : null;
    players.push(p);
  }
  if(!players.length) throw new Error('Nessun partecipante trovato nel foglio "' + sheetName + '".');

  const history = Object.keys(historyByRound).map(k => {
    const entries = historyByRound[k];
    return { round: parseInt(k,10), entries, eliminatedIds: entries.filter(e => e.result === 'lose').map(e => e.playerId) };
  }).sort((a,b) => a.round - b.round);

  const meta = { ...emptyMeta(), ...(S.meta || {}) };
  meta.teams = teams;
  meta.players = players.map(p => { const c = { ...p }; delete c._pending; return c; });
  meta.history = history;
  meta.round = maxRound + 1;
  meta.deadline = null;
  meta.fileName = file.name;
  meta.sheetName = sheetName;
  meta.originalB64 = b64FromBuffer(buf);

  const alive = players.filter(p => !p.eliminated);
  if(players.length >= 2 && alive.length <= 1){
    meta.phase = 'finished';
    meta.winners = alive.length === 1 ? [alive[0].id] : [];
  } else {
    meta.phase = 'playing';
    meta.winners = [];
  }

  S.meta = meta;
  await saveMeta();

  /* le X senza esito diventano richieste già approvate della giornata in corso */
  if(meta.phase === 'playing'){
    for(const p of players){
      if(!p._pending) continue;
      await Store.set(K.req(meta.round, p.id), {
        teamId: p._pending, status:'approved', note:'Importata dal file Excel',
        sentAt: new Date().toISOString(), sentBy:'excel',
        decidedAt: new Date().toISOString(), decidedBy:'excel', history: []
      });
    }
  }
  await loadRound();
  await loadClaims();
  return { players: players.length, teams: teams.length, round: meta.round, sheetName };
}

function buildWorkbook(){
  let wb, ws, grid;
  if(S.meta.originalB64){
    wb = XLSX.read(S.meta.originalB64, { type:'base64' });
    ws = wb.Sheets[S.meta.sheetName] || wb.Sheets[wb.SheetNames.find(n => /minigioco/i.test(n)) || wb.SheetNames[0]];
    grid = parseGrid(ws);
  }
  if(!grid){
    const header = ['Partecipanti', ...S.meta.teams.map(t => t.name)];
    const last = Math.max(S.meta.round, ...S.meta.history.map(h => h.round), 1);
    for(let n=1;n<=last;n++) header.push('Giornata ' + n);
    const aoa = [['Tabella Minigioco - disponibilità'], header, ...S.meta.players.map(p => [p.name])];
    ws = XLSX.utils.aoa_to_sheet(aoa);
    wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Minigioco Attivo');
    grid = parseGrid(ws);
    S.meta.players.forEach((p,i) => { if(p.rowIndex == null) p.rowIndex = grid.firstDataRow + i; });
  }

  /* assicura una colonna per ogni giornata giocata o in corso */
  const needed = Math.max(S.meta.round, ...S.meta.history.map(h => h.round), 1);
  let lastCol = Math.max(grid.partCol, ...grid.teams.map(t => t.col), ...grid.giornate.map(g => g.col).concat([-1]));
  const have = new Set(grid.giornate.map(g => g.num));
  for(let n=1;n<=needed;n++){
    if(!have.has(n)){
      lastCol += 1;
      ws[XLSX.utils.encode_cell({ r: grid.headerRow, c: lastCol })] = { t:'s', v:'Giornata ' + n };
      grid.giornate.push({ col: lastCol, num: n });
    }
  }
  grid.giornate.sort((a,b) => a.num - b.num);

  const byName = {};
  for(let r = grid.firstDataRow; r <= grid.range.e.r; r++){
    const c = ws[XLSX.utils.encode_cell({ r, c: grid.partCol })];
    if(c && c.v != null) byName[String(c.v).trim().toLowerCase()] = r;
  }
  let appendRow = Math.max(grid.range.e.r, grid.firstDataRow - 1);
  const ap = approvedPicks();

  S.meta.players.forEach(p => {
    let row = byName[p.name.toLowerCase()];
    if(row == null){ row = ++appendRow; ws[XLSX.utils.encode_cell({ r: row, c: grid.partCol })] = { t:'s', v: p.name }; }

    const used = new Set(p.usedTeamIds || []);
    if(!p.eliminated && ap[p.id]) used.add(ap[p.id]);
    grid.teams.forEach(t => {
      const addr = XLSX.utils.encode_cell({ r: row, c: t.col });
      if(used.has(slug(t.name))) ws[addr] = { t:'s', v:'X' }; else delete ws[addr];
    });

    grid.giornate.forEach(g => {
      const addr = XLSX.utils.encode_cell({ r: row, c: g.col });
      const h = S.meta.history.find(h => h.round === g.num);
      const e = h && h.entries.find(x => x.playerId === p.id);
      if(e) ws[addr] = { t:'s', v: (e.result === 'win' ? 'V' : 'NV') + ' (' + team(e.teamId).name + ')' };
      else delete ws[addr];
    });
  });

  const maxRow = Math.max(grid.range.e.r, appendRow);
  const maxCol = Math.max(grid.range.e.c, lastCol);
  ws['!ref'] = XLSX.utils.encode_range({ s:{ r: grid.range.s.r, c: grid.range.s.c }, e:{ r: maxRow, c: maxCol } });
  return wb;
}
function downloadWorkbook(){
  try{
    const wb = buildWorkbook();
    const base = (S.meta.fileName || 'FantaList.xlsx').replace(/\.xlsx?$/i, '');
    XLSX.writeFile(wb, base + '_G' + S.meta.round + '.xlsx');
    toast('File Excel scaricato.', 'ok');
  }catch(e){ toast('Non riesco a generare il file: ' + e.message, 'err'); }
}

function storageBanner(){
  const m = Store.mode();
  if(m === 'supabase') return '';
  if(m === 'artifact') return `<div class="banner">Stai usando l'anteprima: i dati sono condivisi tra chi apre questa stessa anteprima. Per il sito pubblico collega un archivio Supabase (istruzioni nel README).</div>`;
  return `<div class="banner err">Archivio non collegato: quello che salvi resta <strong>solo su questo dispositivo</strong>. Per far giocare tutti serve un archivio condiviso — <button class="btn-link" data-cfg>collega Supabase</button>.</div>`;
}
function wireStorageBanner(root){
  const b = root.querySelector('[data-cfg]');
  if(b) b.onclick = openBackendSetup;
}
async function openBackendSetup(){
  const ov = el(`<div class="overlay"></div>`);
  ov.appendChild(el(`
    <div class="modal">
      <h3>Collega l'archivio condiviso</h3>

    </div>`));
  document.body.appendChild(ov);
  const cfg = Store.config();
  if(cfg){ ov.querySelector('#cfg-url').value = cfg.url; ov.querySelector('#cfg-key').value = cfg.key; }

    wrap.appendChild(box);

function viewMine(){
  const wrap = el(`<div class="stack"></div>`);
  const p = myPlayer();
  if(!p){
    wrap.appendChild(el(`<div class="empty">Il tuo account non è collegato a nessun partecipante. Chiedi all'organizzatore di collegarlo dalla sezione Partecipanti.</div>`));
    return wrap;
  }
  if(S.meta.phase === 'finished'){ wrap.appendChild(viewWinner()); return wrap; }
  if(p.eliminated){
    wrap.appendChild(el(`
      <div class="panel"><div class="panel-body" style="text-align:center; padding:34px 20px;">
        <h2 style="font-size:1.6rem; color:var(--ko);">Eliminato alla giornata ${p.eliminatedRound}</h2>
        <p class="note">Il tuo minigioco finisce qui. Puoi continuare a seguire chi resta in piedi dalla sezione Lega.</p>
      </div></div>`));
    wrap.appendChild(myHistoryPanel(p));
    return wrap;
  }

  const req = S.requests[p.id];
  let selected = req ? req.teamId : null;
  const closed = deadlinePassed();

  const panel = el(`
    <div class="panel">
      <div class="panel-head">
        <div><span class="eyebrow">Giornata ${S.meta.round}</span><h2>La tua schedina</h2></div>
        <span class="tag ${req ? (req.status === 'approved' ? 'ok' : req.status === 'pending' ? 'pending' : 'ko') : 'mute'}">
          ${req ? (req.status === 'approved' ? 'registrata' : req.status === 'pending' ? 'in attesa' : 'respinta') : 'da inviare'}</span>
      </div>
      <div class="panel-body"></div>
    </div>`);
  const body = panel.querySelector('.panel-body');
  body.appendChild(slipFor(p, req));

  if(req && req.status === 'rejected' && req.note)
    body.appendChild(el(`<div class="banner err">L'organizzatore ha respinto il pronostico: ${esc(req.note)}. Scegline un altro qui sotto.</div>`));
  if(closed)
    body.appendChild(el(`<div class="banner err">Il termine di invio è scaduto (${fmtDate(S.meta.deadline)}). Per cambiare, scrivi all'organizzatore.</div>`));
  else if(S.meta.deadline)
    body.appendChild(el(`<div class="banner">Hai tempo fino al <strong class="mono">${fmtDate(S.meta.deadline)}</strong>.</div>`));

  if(!closed){
    body.appendChild(el(`<p class="note">${req && req.status === 'approved'
      ? 'Puoi ancora cambiare idea: il nuovo pronostico tornerà in attesa di approvazione.'
      : 'Scegli la squadra su cui punti. Quelle sbarrate le hai già usate nelle giornate precedenti.'}</p>`));
    const picker = teamPicker(p, selected, id => {
      selected = id;
      picker.querySelectorAll('.team-btn').forEach(b => b.classList.toggle('on', b.dataset.team === id));
      send.disabled = false;
    });
    body.appendChild(picker);
    var send = el(`<button class="btn btn-primary" style="width:100%;" ${selected ? '' : 'disabled'}>${req ? 'Aggiorna il pronostico' : 'Invia il pronostico'}</button>`);
    send.onclick = async () => {
      if(!selected) return;
      send.disabled = true; send.innerHTML = '<span class="spinner"></span> Invio…';
      try{
        await submitRequest(p.id, selected);
        toast(S.meta.autoApprove ? 'Pronostico registrato.' : 'Pronostico inviato: aspetta l\'approvazione.', 'ok');
        render();
      }catch(e){ toast(e.message, 'err'); send.disabled = false; send.textContent = 'Invia il pronostico'; }
    };
    body.appendChild(send);
  }
  wrap.appendChild(panel);
  wrap.appendChild(myHistoryPanel(p));
  return wrap;
}

function myHistoryPanel(p){
  const rows = S.meta.history.map(h => {
    const e = h.entries.find(x => x.playerId === p.id);
    return e ? { round: h.round, ...e } : null;
  }).filter(Boolean);
  const used = (p.usedTeamIds || []).length;
  const panel = el(`
    <div class="panel">
      <div class="panel-head"><h2>Il tuo percorso</h2><span class="eyebrow">${used} usate · ${Math.max(S.meta.teams.length - used, 0)} ancora disponibili</span></div>
      <div class="panel-body"></div>
    </div>`);
  const body = panel.querySelector('.panel-body');
  if(!rows.length){ body.appendChild(el(`<div class="empty">Nessuna giornata giocata finora.</div>`)); return panel; }
  body.appendChild(el(`
    <table><thead><tr><th>G</th><th>Squadra</th><th style="text-align:right;">Esito</th></tr></thead>
      <tbody>${rows.map(r => `
        <tr><td class="num">G${String(r.round).padStart(2,'0')}</td>
