function requestsPanel(gameKey){
  const g = G(gameKey);
  const alive = aliveIn(gameKey);
  const pending = pendingIn(gameKey);
  const missing = missingIn(gameKey);
  const out = (S.core.players || []).filter(p => gstate(gameKey, p.id).eliminated);
  const absentNow = out.filter(p => gstate(gameKey, p.id).eliminatedRound === S.core.round && gstate(gameKey, p.id).eliminatedReason === 'assente');

  const panel = el(`
    <div class="panel">
      <div class="panel-head">
        <div><span class="eyebrow">giornate ${g.first}–${g.last}</span><h2>${esc(g.name)}</h2></div>
        <div class="btn-row">
          ${pending.length ? `<button class="btn btn-sm btn-ok" data-all>Approva tutte (${pending.length})</button>` : ''}
          ${missing.length && g.kind === 'lms' ? `<button class="btn btn-sm btn-ko" data-abs>Elimina i ${missing.length} assenti</button>` : ''}
          ${missing.length ? `<button class="btn btn-sm btn-ghost" data-copy>Promemoria</button>` : ''}
        </div>
      </div>
      <div class="panel-body"><div class="board"></div></div>
    </div>`);
  const board = panel.querySelector('.board');

  if(!gameOpen(gameKey)){
    board.appendChild(el(`<div class="empty">${
      S.core.round < g.first ? 'Comincia alla giornata ' + g.first + '.' :
      gmeta(gameKey)?.phase === 'finished' ? 'Minigioco concluso.' : 'Non in corso.'}</div>`));
    return panel;
  }

  alive.forEach(p => {
    const req = S.reqs[gameKey]?.[p.id];
    const state = req ? req.status : 'missing';
    const t = req ? team(req.teamId) : null;
    const row = el(`
      <div class="req ${state}">
        <div>
          <div class="p-name">${esc(p.name)}</div>
          <div class="p-sub">${req ? 'inviato ' + fmtDate(req.sentAt) : 'nessuna richiesta'}</div>
        </div>
        <div>${req
          ? `<div class="p-team"><span class="dot" style="background:${t.color}"></span>${esc(t.name)}</div>
             ${req.note ? `<div class="p-sub">nota: ${esc(req.note)}</div>` : ''}`
          : `<span class="tag mute">in attesa di risposta</span>`}</div>
        <div class="p-actions"></div>
      </div>`);
    const acts = row.querySelector('.p-actions');
    if(state === 'pending'){
      const ok = el(`<button class="btn btn-sm btn-ok">Approva</button>`);
      ok.onclick = async () => { await decidePick(gameKey, p.id, 'approved'); toast('Approvato: ' + p.name + ' → ' + t.name, 'ok'); render(); };
      const ko = el(`<button class="btn btn-sm btn-ko">Respingi</button>`);
      ko.onclick = async () => {
        const note = await modal({ title:'Respingi il pronostico', message:'Scrivi il motivo: ' + p.name + ' lo vedrà e potrà rifare la scelta.', input:'text', placeholder:'es. squadra non più disponibile', confirmText:'Respingi' });
        if(note === null) return;
        await decidePick(gameKey, p.id, 'rejected', note); toast('Richiesta respinta.', ''); render();
      };
      acts.append(ok, ko);
    } else if(state === 'approved'){
      acts.appendChild(el(`<span class="tag ok">registrato</span>`));
      const undo = el(`<button class="btn btn-sm btn-ghost">Annulla</button>`);
      undo.onclick = async () => { await decidePick(gameKey, p.id, 'pending'); render(); };
      acts.appendChild(undo);
    } else {
      acts.appendChild(el(`<span class="tag ${state === 'rejected' ? 'ko' : 'mute'}">${state === 'rejected' ? 'respinto' : 'manca'}</span>`));
    }
    const set = el(`<button class="btn btn-sm btn-ghost">Scegli tu</button>`);
    set.onclick = async () => {
      const tid = await pickForModal(gameKey, p);
      if(!tid) return;
      try{ await submitPick(gameKey, p.id, tid, true); toast(p.name + ' → ' + team(tid).name, 'ok'); render(); }
      catch(e){ toast(e.message, 'err'); }
    };
    acts.appendChild(set);
    board.appendChild(row);
  });

  if(absentNow.length){
    board.appendChild(el(`<div class="sub-head">Eliminati per assenza in questa giornata — ancora ripescabili</div>`));
    absentNow.forEach(p => {
      const row = el(`<div class="req missing"><div class="p-name">${esc(p.name)}</div>
        <div><span class="tag ko">eliminato per assenza</span></div>
        <div class="p-actions"><button class="btn btn-sm btn-ghost">Ripesca</button></div></div>`);
      row.querySelector('button').onclick = () => readmit(gameKey, p.id);
      board.appendChild(row);
    });
  }
  if(!alive.length) board.appendChild(el(`<div class="empty">Nessun partecipante ancora in gioco.</div>`));

  const all = panel.querySelector('[data-all]');
  if(all) all.onclick = async () => { all.disabled = true; for(const p of pending) await decidePick(gameKey, p.id, 'approved'); toast(pending.length + ' approvati.', 'ok'); render(); };
  const abs = panel.querySelector('[data-abs]');
  if(abs) abs.onclick = () => eliminateAbsent(gameKey);
  const cp = panel.querySelector('[data-copy]');
  if(cp) cp.onclick = () => copyText(`${g.name} — giornata ${S.core.round}\nManca il pronostico di: ${missing.map(p => p.name).join(', ')}.` +
    (S.core.deadline ? `\nTermine: ${fmtDate(S.core.deadline)}.` : ''));
  return panel;
}

function viewBoard(){
  const wrap = el(`<div class="stack"></div>`);
  if(!GAMES.some(g => gmeta(g.key))){
    wrap.appendChild(el(`<div class="empty">Nessun minigioco avviato.</div>`));
    return wrap;
  }
  const sw = el(`<div class="switcher"></div>`);
  GAMES.forEach(g => {
    const b = el(`<button class="${S.boardGame === g.key ? 'on' : ''}">${esc(g.short)}</button>`);
    b.onclick = () => { S.boardGame = g.key; render(); };
    sw.appendChild(b);
  });
  wrap.appendChild(sw);

  const key = S.boardGame, g = G(key), m = gmeta(key);
  if(!m){ wrap.appendChild(el(`<div class="empty">Minigioco non ancora avviato.</div>`)); return wrap; }

  const rows = (S.core.players || []).map(p => {
    const st = gstate(key, p.id);
    return { p, wins: winsIn(key, p.id), played: playedIn(key, p.id),
             used: (st.used || []).length, eliminated: st.eliminated, elimRound: st.eliminatedRound };
  });
  const dir = S.boardDir === 'asc' ? 1 : -1;
  const sorters = {
    wins:   (a,b) => (a.wins - b.wins) * dir || a.p.name.localeCompare(b.p.name),
    played: (a,b) => (a.played - b.played) * dir || a.p.name.localeCompare(b.p.name),
    name:   (a,b) => a.p.name.localeCompare(b.p.name) * dir,
    status: (a,b) => ((a.eliminated ? 1 : 0) - (b.eliminated ? 1 : 0)) * dir || b.wins - a.wins
  };
  rows.sort(sorters[S.boardSort] || sorters.wins);
  const best = Math.max(1, ...rows.map(r => r.wins));
  const me = myPlayer();

  const panel = el(`
    <div class="panel">
      <div class="panel-head">
        <div><span class="eyebrow">${g.kind === 'season' ? 'vittorie in stagione' : 'giornate superate'}</span><h2>Classifica — ${esc(g.short)}</h2></div>
        <span class="eyebrow">giornata ${S.core.round} / ${SEASON_ROUNDS}${m.phase === 'finished' ? ' · conclusa' : ''}</span>
      </div>
      <div class="panel-body" style="padding:0;">
        <div class="table-scroll"><table class="board-table">
          <thead><tr>
            <th style="width:38px;">#</th>
            <th data-s="name" class="sortable">Partecipante</th>
            <th data-s="wins" class="sortable num">Vittorie</th>
            <th data-s="played" class="sortable num">Giornate</th>
            ${g.kind === 'lms' ? `<th data-s="status" class="sortable" style="text-align:right;">Stato</th>` : ''}
          </tr></thead>
          <tbody></tbody>
        </table></div>
        <p class="note" style="padding:10px 16px 14px; margin:0;">Tocca l'intestazione di una colonna per riordinare, tocca una riga per vedere giornata per giornata.</p>
      </div>
    </div>`);
  panel.querySelectorAll('.sortable').forEach(th => {
    if(th.dataset.s === S.boardSort) th.classList.add('on', S.boardDir);
    th.onclick = () => {
      if(S.boardSort === th.dataset.s) S.boardDir = S.boardDir === 'desc' ? 'asc' : 'desc';
      else { S.boardSort = th.dataset.s; S.boardDir = th.dataset.s === 'name' ? 'asc' : 'desc'; }
      render();
    };
  });

  const tb = panel.querySelector('tbody');
  if(!rows.length) tb.appendChild(el(`<tr><td colspan="5" class="note" style="padding:14px;">Nessun partecipante.</td></tr>`));
  rows.forEach((r,i) => {
    const isMe = me && r.p.id === me.id;
    const open = !!S.boardOpen[key + ':' + r.p.id];
    const tr = el(`
      <tr class="rank-row ${isMe ? 'me' : ''} ${r.eliminated ? 'out' : ''} ${open ? 'open' : ''}">
        <td class="mono">${i+1}</td>
        <td><strong>${esc(r.p.name)}</strong>${isMe ? ' <span class="tag mute">tu</span>' : ''}
            <div class="bar"><span style="width:${Math.round(r.wins / best * 100)}%"></span></div></td>
        <td class="num wins">${r.wins}</td>
        <td class="num">${r.played}</td>
        ${g.kind === 'lms' ? `<td style="text-align:right;">${r.eliminated
          ? `<span class="tag ko">fuori G${r.elimRound}</span>`
          : `<span class="tag ok">in gioco</span>`}</td>` : ''}
      </tr>`);
    tr.onclick = () => { S.boardOpen[key + ':' + r.p.id] = !open; render(); };
    tb.appendChild(tr);
    if(open){
      const det = el(`<tr class="rank-detail"><td colspan="${g.kind === 'lms' ? 5 : 4}"></td></tr>`);
      det.querySelector('td').appendChild(historyTable(key, r.p.id));
      tb.appendChild(det);
    }
  });
  wrap.appendChild(panel);
  return wrap;
}

function fixturesListEl(round, editable){
  const list = matchesForRound(round);
  const box = el(`<div class="fixtures-list"></div>`);
  if(!list.length){
    box.appendChild(el(`<div class="empty">Nessuna partita caricata per questa giornata.</div>`));
  } else {
    list.forEach((m,i) => {
      const h = teamByName(m.home), a = teamByName(m.away);
      const rh = round === S.core.round ? S.results[h.id] : null;
      const ra = round === S.core.round ? S.results[a.id] : null;
      const esito = rh === 'win' ? `${esc(m.home)} ha vinto` : ra === 'win' ? `${esc(m.away)} ha vinto` : (rh || ra) ? 'nessuna delle due ha vinto' : null;
      const row = el(`
        <div class="fixture-row">
          <span class="fx-team"><span class="dot" style="background:${h.color}"></span>${esc(m.home)}</span>
          <span class="fx-vs">vs</span>
          <span class="fx-team"><span class="dot" style="background:${a.color}"></span>${esc(m.away)}</span>
          ${m.date ? `<span class="fx-date mono">${esc(m.date)}</span>` : ''}
          ${editable ? `<input type="text" class="fx-res mono" value="${esc(m.result || '')}" placeholder="2-1"
                          style="width:66px; padding:6px 8px; text-align:center; font-size:0.82rem;">` : ''}
          ${!editable && m.result ? `<span class="tag mute mono">${esc(m.result)}</span>` : ''}
          ${esito ? `<span class="tag ok">${esc(esito)}</span>` : ''}
          ${editable ? `<button class="btn btn-sm btn-ghost fx-rm">Rimuovi</button>` : ''}
        </div>`);
      if(editable){
        const ri = row.querySelector('.fx-res');
        /* Scrivendo il risultato di una partita della giornata in corso,
           l'esito delle due squadre viene segnato subito: vale per tutti
           i minigiochi, esattamente come l'import del calendario. */
        ri.onchange = async () => {
          const v = ri.value.trim();
          m.result = v;
          await saveCore();
          if(v && round === S.core.round){
            const o = parseScore(v);
            if(o){
              await writeTeamResult(teamByName(m.home).id, o.home, round);
              await writeTeamResult(teamByName(m.away).id, o.away, round);
              toast('Risultato salvato: esiti aggiornati.', 'ok');
            } else toast('Formato non riconosciuto: scrivi per esempio 2-1.', 'err');
          }
          render();
        };
        row.querySelector('.fx-rm').onclick = async () => {
          const idx = S.core.calendar.findIndex(x => x === m);
          if(idx >= 0) S.core.calendar.splice(idx, 1);
          await saveCore(); render();
        };
      }
      box.appendChild(row);
    });
  }
  return box;
}

  if(!S.core.round) S.core.round = 1;
  let shown = S.boardRound || S.core.round;

  if(isAdmin()){

          <div style="font-family:'Anton',sans-serif; font-size:1.6rem;">${String(shown).padStart(2,'0')} <span style="color:var(--chalk-mute); font-size:1rem;">/ ${SEASON_ROUNDS}</span></div>

  wrap.appendChild(nav);

  const panel = el(`
    <div class="panel">
      <div class="panel-head"><h2>Partite di Serie A</h2>${shown === S.core.round ? '<span class="tag ok">giornata in corso</span>' : ''}</div>
      <div class="panel-body"></div>
    </div>`);
  panel.querySelector('.panel-body').appendChild(fixturesListEl(shown, isAdmin()));
  wrap.appendChild(panel);

  if(isAdmin()){
    const add = el(`
      <div class="panel">
        <div class="panel-head"><h2>Aggiungi una partita alla giornata ${shown}</h2></div>
        <div class="panel-body">
          <div class="form-grid">
            <label class="field"><span>Squadra in casa</span>
              <select id="fx-home"><option value="">Scegli…</option>${S.core.teams.map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('')}</select>
            </label>
            <label class="field"><span>Squadra in trasferta</span>
              <select id="fx-away"><option value="">Scegli…</option>${S.core.teams.map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('')}</select>
            </label>
          </div>
          <label class="field"><span>Data/ora (opzionale)</span><input type="text" id="fx-date" placeholder="es. 23/08 15:00"></label>
          <button class="btn btn-primary" id="fx-add">Aggiungi partita</button>
          <p class="note-dim" style="margin-top:10px;">Più comodo per tutta la stagione: importa un foglio "Calendario" dal file Excel (colonne Giornata, Casa, Trasferta, Data) dalla scheda File Excel.</p>
        </div>
      </div>`);
    add.querySelector('#fx-add').onclick = async () => {
      const home = add.querySelector('#fx-home').value, away = add.querySelector('#fx-away').value;
      const date = add.querySelector('#fx-date').value.trim();
      if(!home || !away){ toast('Scegli entrambe le squadre.', 'err'); return; }
      if(home === away){ toast('Una squadra non può giocare contro se stessa.', 'err'); return; }
      if(!S.core.calendar) S.core.calendar = [];
      S.core.calendar.push({ round: shown, home, away, date });
      await saveCore();
      toast('Partita aggiunta.', 'ok');
      render();
    };
    wrap.appendChild(add);
  }
  return wrap;
}

function viewPlayers(){
  const wrap = el(`<div class="stack"></div>`);

  const add = el(`
    <div class="panel">
      <div class="panel-head"><h2>Aggiungi un partecipante</h2></div>
      <div class="panel-body">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <input type="text" id="np" placeholder="Nome e cognome" style="flex:1; min-width:200px;">
          <button class="btn btn-primary" id="np-go">Aggiungi</button>
        </div>
        <p class="note-dim" style="margin-top:10px;">Entra subito in tutti e tre i minigiochi, da questa giornata in poi.</p>
      </div>
    </div>`);
  const doAdd = async () => {
    const name = add.querySelector('#np').value.trim();
    if(!name) return;
    if(!S.core) S.core = emptyCore();
    let id = 'p-' + slug(name), n = 2;
    while(player(id)) id = 'p-' + slug(name) + '-' + (n++);
    S.core.players.push({ id, name });
    await saveCore();
    for(const g of GAMES){
      if(!S.games[g.key]) S.games[g.key] = emptyGame();
      gstate(g.key, id);
      await saveGame(g.key);
    }
    add.querySelector('#np').value = '';
    toast(name + ' aggiunto.', 'ok'); render();
  };
  add.querySelector('#np-go').onclick = doAdd;
  add.querySelector('#np').onkeydown = e => { if(e.key === 'Enter') doAdd(); };
  wrap.appendChild(add);

  const withUser = (S.core?.players || []).filter(p => S.claims[p.id]);
  const without  = (S.core?.players || []).filter(p => !S.claims[p.id]);

  const bulk = el(`
    <div class="panel">
      <div class="panel-head"><h2>Accessi</h2>
        <div class="btn-row">
          ${without.length ? `<button class="btn btn-sm btn-primary" id="mk">Crea i ${without.length} accessi mancanti</button>` : ''}
          ${withUser.length ? `<button class="btn btn-sm btn-ghost" id="show">${S.showCodes ? 'Nascondi' : 'Mostra'} i codici</button>
                               <button class="btn btn-sm btn-ghost" id="cpall">Copia elenco</button>` : ''}
        </div>
      </div>
      <div class="panel-body" style="padding:0;"><div class="table-scroll"><table>
        <thead><tr><th>Partecipante</th><th>Nome utente</th><th>Codice</th><th style="text-align:right;">Azioni</th></tr></thead>
        <tbody></tbody></table></div></div>
    </div>`);
  const tb = bulk.querySelector('tbody');
  (S.core?.players || []).forEach(p => {
    const uname = S.claims[p.id];
    const u = uname ? S.users.find(x => x.username === uname) : null;
    const tr = el(`
      <tr>
        <td><strong>${esc(p.name)}</strong></td>
        <td class="mono">${uname ? esc(uname) : '<span class="tag mute">nessun accesso</span>'}</td>
        <td class="mono">${u ? (S.showCodes ? esc(u.password || '—') : '••••••') : '—'}</td>
        <td style="text-align:right;"><div class="btn-row" style="justify-content:flex-end;"></div></td>
      </tr>`);
    const acts = tr.querySelector('.btn-row');
    if(u){
      const cp = el(`<button class="btn btn-sm btn-ghost">Copia</button>`);
      cp.onclick = () => copyText(`${p.name}\nSito: ${location.href}\nNome utente: ${u.username}\nCodice: ${u.password}`);
      const ch = el(`<button class="btn btn-sm btn-ghost">Cambia codice</button>`);
      ch.onclick = async () => {
        const np = await modal({ title:'Nuovo codice per ' + p.name, input:'text', prefill: generateCode(), confirmText:'Salva' });
        if(!np) return;
        try{ await changePassword(u.username, np); await loadUsers(); toast('Codice aggiornato.', 'ok'); render(); }
        catch(e){ toast(e.message, 'err'); }
      };
      acts.append(cp, ch);
    } else {
      const mk = el(`<button class="btn btn-sm btn-primary">Crea accesso</button>`);
      mk.onclick = async () => {
        const code = generateCode();
        try{
          await createUser({ username: p.id.replace(/^p-/,''), password: code, role:'player', playerId: p.id, displayName: p.name });
          await loadUsers(); await loadClaims();
          toast('Accesso creato per ' + p.name + '.', 'ok'); render();
        }catch(e){ toast(e.message, 'err'); }
      };
      acts.appendChild(mk);
    }
    const rm = el(`<button class="btn btn-sm btn-ko">Rimuovi</button>`);
    rm.onclick = async () => {
      if(!await confirmBox('Rimuovo ' + p.name + ' da tutti e tre i minigiochi? Lo storico di questo partecipante andrà perso.')) return;
      S.core.players = S.core.players.filter(x => x.id !== p.id);
      await saveCore();
      for(const g of GAMES){
        const m = gmeta(g.key); if(!m) continue;
        delete m.st[p.id];
        m.history.forEach(h => { h.entries = h.entries.filter(e => e.playerId !== p.id); });
        await saveGame(g.key);
      }
      await Store.del(K.claim(p.id));
      toast(p.name + ' rimosso.', ''); render();
    };
    acts.appendChild(rm);
    tb.appendChild(tr);
  });

  const mk = bulk.querySelector('#mk');
  if(mk) mk.onclick = async () => {
    mk.disabled = true;
    const lines = [];
    for(const p of without){
      const code = generateCode();
      try{
        await createUser({ username: p.id.replace(/^p-/,''), password: code, role:'player', playerId: p.id, displayName: p.name });
        lines.push(`${p.name} — utente: ${p.id.replace(/^p-/,'')} — codice: ${code}`);
      }catch(e){}
    }
    await loadUsers(); await loadClaims();
    if(lines.length) copyText(`FantaList — accessi al minigioco\nSito: ${location.href}\n\n` + lines.join('\n'));
    toast(lines.length + ' accessi creati e copiati negli appunti.', 'ok');
    render();
  };
  const sh = bulk.querySelector('#show');
  if(sh) sh.onclick = () => { S.showCodes = !S.showCodes; render(); };
  const cpall = bulk.querySelector('#cpall');
  if(cpall) cpall.onclick = () => {
    const lines = (S.core?.players || []).map(p => {
      const u = S.users.find(x => x.username === S.claims[p.id]);
      return u ? `${p.name} — utente: ${u.username} — codice: ${u.password}` : null;
    }).filter(Boolean);
    copyText(`FantaList — accessi al minigioco\nSito: ${location.href}\n\n` + lines.join('\n'));
  };
  wrap.appendChild(bulk);
  return wrap;
}

function importPanel(compact){
  const panel = el(`
    <div class="panel">
      <div class="panel-head"><h2>${compact ? 'Ricarica il file' : 'Carica il file della lega'}</h2><span class="eyebrow">.xlsx</span></div>
      <div class="panel-body">
        <p class="note">Un solo file comanda tutti e tre i minigiochi. Vengono cercati i fogli
          <span class="mono">Minigioco_LastManStanding</span> (MG_A, giornate 1–19),
          <span class="mono">…_Ritorno</span> (MG_R, giornate 20–38) e
          <span class="mono">Minigioco_Stagionale</span> (MG_S, giornate 1–38 + Totale Vittorie).
          I fogli mancanti vengono creati la prima volta che scarichi il file aggiornato.</p>
        <label class="checkline"><input type="checkbox" id="imp-ph" checked><span>Salta i nomi segnaposto ("partecipante 12", ecc.)</span></label>
        <label class="checkline"><input type="checkbox" id="imp-pay" checked><span>Tieni solo chi ha la x su "Quota MiniGiochi"</span></label>
        <input type="file" id="imp-file" accept=".xlsx,.xlsm">
        ${compact ? `<div class="banner err">Ricaricare il file sostituisce partecipanti e storico di tutti e tre i minigiochi. Gli account restano, ma solo se i nomi non cambiano.</div>` : ''}
      </div>
    </div>`);
  panel.querySelector('#imp-file').onchange = async e => {
    const f = e.target.files[0];
    if(!f) return;
    try{
      const res = await importWorkbook(f, {
        skipPlaceholders: panel.querySelector('#imp-ph').checked,
        onlyPaying: panel.querySelector('#imp-pay').checked });
      toast(`${res.players} partecipanti, ${res.teams} squadre. Fogli letti: ${res.sheets.join(', ') || 'nessuno'}. Si riparte dalla giornata ${res.round}.`, 'ok');
      S.tab = isAdmin() ? 'requests' : 'mine';
      render();
    }catch(err){ toast(err.message, 'err'); e.target.value = ''; }
  };
  return panel;
}
function viewExcel(){
  const wrap = el(`<div class="stack"></div>`);
  wrap.appendChild(el(`
    <div class="panel">
      <div class="panel-head"><h2>File collegato</h2>${S.core?.fileName ? `<span class="eyebrow mono">${esc(S.core.fileName)}</span>` : ''}</div>
      <div class="panel-body">
        <p class="note">${S.core?.fileName
          ? `Il sito lavora sulla copia di <strong>${esc(S.core.fileName)}</strong>. Il file che scarichi contiene i tre fogli aggiornati — X e conteggi sulle squadre usate, <span class="mono">V (Inter)</span> / <span class="mono">NV (Inter)</span> / <span class="mono">ASSENTE</span> sulle giornate, e il Totale Vittorie di WhoWin? — con gli altri fogli intatti.`
          : 'Nessun file caricato: il download genera comunque i tre fogli nel formato giusto.'}</p>
        <div class="btn-row" id="dl-row"></div>
      </div>
    </div>`));
  const dl = el(`<button class="btn btn-primary">Scarica il file aggiornato</button>`);
  dl.onclick = downloadWorkbook;

  return wrap;
}

/* Generatore con seme: lo stesso codice sfida dà a entrambi i partecipanti
   la stessa sequenza di squadre, così il confronto è sulla scelta, non sul
   sorteggio. */
function hashSeed(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function duelRng(seed){
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function shuffleOrder(seed){
  const rnd = duelRng(hashSeed(seed));
  const order = SQUADS.map((_,i) => i);
  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return order;
}

/* Stato della sfida in corso sul dispositivo: non è nell'archivio finché non
   si completa un turno di 11, solo allora diventa un record condiviso. */
const D = { screen:'menu', formation:null, code:null, order:[], cursor:0, current:null, squad:[], role:null, duelId:null, opponentId:null };

K.duel = id => 'duel-' + id;

async function loadDuels(){
  S.duels = {};
  (await Store.list('duel-')).forEach(({ key, value }) => { S.duels[key.slice('duel-'.length)] = value; });
}
const myDuels = () => {
  const me = myPlayer();
  if(!me) return [];
  return Object.values(S.duels || {}).filter(d => d.challengerId === me.id || d.opponentId === me.id);
};
const pendingForMe = () => { const me = myPlayer(); return me ? myDuels().filter(d => d.status === 'pending' && d.opponentId === me.id) : []; };
const waitingMine   = () => { const me = myPlayer(); return me ? myDuels().filter(d => d.status === 'pending' && d.challengerId === me.id) : []; };
const doneMine      = () => myDuels().filter(d => d.status === 'done');
function rivalOf(d){ const me = myPlayer(); return me && d.challengerId === me.id ? d.opponentId : d.challengerId; }
function opponentGroups(){
  const map = {};
  doneMine().forEach(d => { const r = rivalOf(d); (map[r] = map[r] || []).push(d); });
  Object.values(map).forEach(arr => arr.sort((a,b) => new Date(b.completedAt) - new Date(a.completedAt)));
  return map;
}

/* ---- regole di riempimento, identiche a quelle di un modulo qualsiasi ---- */
function openSlotsD(){
  const need = {};
  D.formation.slots.forEach(s => { need[s[0]] = (need[s[0]] || 0) + 1; });
  D.squad.forEach(x => { need[x.slot] -= 1; });
  return Object.keys(need).filter(r => need[r] > 0);
}
function slotForD(pl){
  const open = openSlotsD();
  if(open.includes(pl[1])) return pl[1];
  return open.find(r => canFill(pl[1], r)) || null;
}
const usableD = sq => sq.p.some(pl => slotForD(pl) !== null);
const totalD = () => D.squad.reduce((s,x) => s + ovrIn(x.pl, x.slot), 0);
function liveChips(){
  return D.squad.map(x => ({ slot:x.slot, name:x.pl[0], role:x.pl[1], ovr: ovrIn(x.pl, x.slot), club:x.squad.c, year:x.squad.y }));
}
/* Salta le rose che non hanno più nessun ruolo utile: nessun turno morto. */
function nextSquadD(){
  while(D.cursor < D.order.length){
    const sq = SQUADS[D.order[D.cursor++]];
    if(usableD(sq)){ D.current = sq; return true; }
  }
  D.current = null;
  return false;
}

/* ---- ciclo di vita di una sfida ---- */
function startDuel(opponentId, formation){
  D.opponentId = opponentId; D.formation = formation; D.code = generateCode(); D.role = 'challenger'; D.duelId = null;
  D.order = shuffleOrder(D.code); D.cursor = 0; D.squad = []; D.screen = 'draft';
  nextSquadD();
}
function respondToDuel(rec){
  D.opponentId = rec.challengerId; D.formation = FORMATIONS.find(f => f.key === rec.formation);
  D.code = rec.seed; D.role = 'opponent'; D.duelId = rec.id;
  D.order = shuffleOrder(D.code); D.cursor = 0; D.squad = []; D.screen = 'draft';
  nextSquadD();
}
async function finalizeAsChallenger(){
  const rec = {
    id: randomHex(6), challengerId: myPlayer().id, opponentId: D.opponentId, formation: D.formation.key, seed: D.code,
    status: 'pending',
    challengerSquad: liveChips(), challengerTotal: totalD(),
    opponentSquad: null, opponentTotal: null, winnerId: null,
    createdAt: new Date().toISOString(), completedAt: null
  };
  await Store.set(K.duel(rec.id), rec);
  S.duels[rec.id] = rec; D.duelId = rec.id; D.screen = 'sent'; render();
}
async function finalizeAsOpponent(){
  const rec = S.duels[D.duelId];
  if(!rec){ toast('Sfida non trovata: forse è stata ritirata.', 'err'); D.screen = 'menu'; render(); return; }
  rec.opponentSquad = liveChips(); rec.opponentTotal = totalD();
  rec.status = 'done'; rec.completedAt = new Date().toISOString();
  rec.winnerId = rec.challengerTotal === rec.opponentTotal ? null : (rec.challengerTotal > rec.opponentTotal ? rec.challengerId : rec.opponentId);
  await Store.set(K.duel(rec.id), rec); S.duels[rec.id] = rec; D.screen = 'result'; render();
}
function chooseD(pl){
  const slot = slotForD(pl);
  if(!slot) return;
  D.squad.push({ slot, pl, squad: D.current });
  if(D.squad.length === 11){ D.role === 'challenger' ? finalizeAsChallenger() : finalizeAsOpponent(); return; }
  if(!nextSquadD()){
    toast('Rose esaurite: la formazione resta incompleta.', 'err');
    D.role === 'challenger' ? finalizeAsChallenger() : finalizeAsOpponent();
    return;
  }
  render(true);
}
async function declineDuel(rec){
  if(!await confirmBox('Rifiuto la sfida di ' + (player(rec.challengerId)?.name || '?') + '. Non potrà più essere accettata.')) return;
  await Store.del(K.duel(rec.id)); delete S.duels[rec.id]; toast('Sfida rifiutata.', ''); render();
}

/* ---- pezzi di interfaccia riutilizzati fra estrazione e risultato ---- */
function fieldElD(chips, formation, highlightNext){
  const box = el(`<div class="field-wrap"><div class="midline"></div><div class="midcircle"></div></div>`);
  const used = {};
  formation.slots.forEach(([role, x, y]) => {
    used[role] = used[role] || 0;
    const mine = chips.filter(c => c.slot === role)[used[role]];
    used[role] += 1;
    const isNext = highlightNext && !mine && openSlotsD().includes(role);
    box.appendChild(el(`
      <div class="slot ${mine ? 'filled' : ''} ${isNext ? 'next' : ''}" style="left:${x}%; top:${y}%;">
        <div class="badge">${mine ? mine.ovr : ''}</div>
        ${mine ? `<div class="nm">${esc(mine.name)}</div><div class="sq">${esc(mine.club)} ${mine.year}</div>`
                : `<div class="rl">${role}</div>`}
      </div>`));
  });
  return box;
}
function rosterTable(chips){
  return el(`<table><thead><tr><th>Casella</th><th>Giocatore</th><th>Da</th><th style="text-align:right;">Ovr</th></tr></thead>
    <tbody>${chips.map(c => `<tr><td class="num">${c.slot}</td>

}

  const toRespond = pendingForMe();
  if(toRespond.length){
    const p = el(`<div class="panel"><div class="panel-head"><h2>Sfide da rispondere</h2><span class="eyebrow">${toRespond.length}</span></div><div class="panel-body"><div class="board"></div></div></div>`);

        <div class="p-actions"></div></div>`);
      const acts = row.querySelector('.p-actions');

      go.onclick = () => { respondToDuel(rec); render(true); };

      no.onclick = () => declineDuel(rec);
      acts.append(go, no);
      board.appendChild(row);
    });
    wrap.appendChild(p);
  }

  const waiting = waitingMine();
  if(waiting.length){
    const p = el(`<div class="panel"><div class="panel-head"><h2>In attesa dell'avversario</h2></div><div class="panel-body"><div class="board"></div></div></div>`);

        <div><span class="tag mute">tuo totale ${rec.challengerTotal}</span></div>
        <div></div></div>`));
    });
    wrap.appendChild(p);
  }

  const all = (S.core.players || []).filter(p => p.id !== me.id);

  const noAcc = all.filter(p => !S.claims[p.id]);
  const start = el(`
    <div class="panel">
      <div class="panel-head"><h2>Sfida un avversario</h2></div>
      <div class="panel-body">
        ${all.length ? `<p class="note">Scegli chi sfidare e il modulo: si parte subito, la formazione si costruisce turno per turno.</p>
          <p class="note-dim" style="margin-bottom:-6px;">Avversario</p>
          <div class="opp-grid" id="opp-grid"></div>
          ${noAcc.length ? `<p class="note-dim">${noAcc.map(p => esc(p.name)).join(', ')} ${noAcc.length === 1 ? 'non ha' : 'non hanno'} ancora un accesso: ${noAcc.length === 1 ? 'non può' : 'non possono'} rispondere a una sfida.</p>` : ''}
          <p class="note-dim" style="margin-bottom:-6px;">Modulo</p>
          <div class="form-grid" id="form-grid"></div>
          <button class="btn btn-primary" id="go-duel" style="width:100%;" disabled>Scegli avversario e modulo</button>`
          : `<div class="empty">Non ci sono altri partecipanti nella lega.</div>`}
      </div>
    </div>`);
  if(all.length){
    let chosenOpp = null, chosenForm = null;
    const oppGrid = start.querySelector('#opp-grid');
    avail.forEach(p => {
      const b = el(`<button class="opp-card"><span class="av">${esc((p.name.trim()[0] || '?'))}</span>${esc(p.name)}</button>`);
      b.onclick = () => { chosenOpp = p.id; oppGrid.querySelectorAll('.opp-card').forEach(x => x.classList.toggle('on', x === b)); sync(); };
      oppGrid.appendChild(b);
    });
    noAcc.forEach(p => {
      oppGrid.appendChild(el(`<button class="opp-card" disabled title="Non ha ancora un accesso">
        <span class="av">${esc((p.name.trim()[0] || '?'))}</span>${esc(p.name)}
        <span class="tag mute" style="margin-left:auto;">no accesso</span></button>`));
    });
    const formGrid = start.querySelector('#form-grid');
    FORMATIONS.forEach(f => {
      const b = el(`<button class="form-card"><span class="fm">${f.key}</span><span class="fd">${esc(f.desc)}</span></button>`);
      b.onclick = () => { chosenForm = f; formGrid.querySelectorAll('.form-card').forEach(x => x.classList.toggle('on', x === b)); sync(); };
      formGrid.appendChild(b);

    const btn = start.querySelector('#go-duel');

      btn.disabled = !(chosenOpp && chosenForm);
      btn.textContent = (chosenOpp && chosenForm) ? 'Sfida ' + player(chosenOpp).name + ' a ' + chosenForm.key : 'Scegli avversario e modulo';
    }
    btn.onclick = () => { startDuel(chosenOpp, chosenForm); render(true); };

  wrap.appendChild(start);

  const groups = opponentGroups();

  if(rivalIds.length){
    const hist = el(`<div class="panel"><div class="panel-head"><h2>Storico degli scontri</h2></div><div class="panel-body"></div></div>`);

      });
      det.appendChild(tbl);
      body.appendChild(det);
    });
    wrap.appendChild(hist);
  }
  return wrap;
}

   non da come l'ho vissuta io in diretta: così la si può riaprire da qui o
   dallo storico, in qualunque momento, da entrambi gli sfidanti. */

const guessDb = () => (S.core?.guessDb?.length ? S.core.guessDb : GUESS_DB_BUILTIN);

/* Il reparto serve al riscontro "ambra": un terzino destro tentato su un
   terzino sinistro è più vicino di un attaccante. */
const REPARTO = {
  'Portiere':'POR',
  'Difensore centrale':'DIF', 'Terzino destro':'DIF', 'Terzino sinistro':'DIF',
  'Mediano':'CEN', 'Centrocampista':'CEN', 'Trequartista':'CEN',
  'Ala destra':'ATT', 'Ala sinistra':'ATT', 'Punta':'ATT'
};
const repartoOf = r => REPARTO[r] || '?';
const fmtVal = v => v >= 1 ? v + ' mln €' : Math.round(v * 1000) + ' mila €';

/* ---- RICERCA CHE AIUTA A SCRIVERE ----
   "Buffon" deve bastare per Gianluigi Buffon: cerco sul nome intero e su
   ogni singola parola, così funziona sia col nome che col cognome. */
function nameMatches(q, name){
  const nq = slug(q);
  if(!nq) return false;
  const ns = slug(name);
  return ns.includes(nq) || ns.split('-').some(tok => tok.startsWith(nq));
}
function searchPlayers(q, exclude = new Set()){
  const nq = slug(q);
  if(!nq) return [];
  return guessDb()
    .filter(p => !exclude.has(slug(p[0])) && nameMatches(q, p[0]))
    .map(p => {
      const ns = slug(p[0]), toks = ns.split('-');
      /* prima le corrispondenze esatte, poi quelle che aprono una parola
         (il cognome), poi il resto */
      const rank = ns === nq ? 0 : toks.some(t => t === nq) ? 1 : toks.some(t => t.startsWith(nq)) ? 2 : 3;
      return { p, rank };
    })
    .sort((a,b) => a.rank - b.rank || a.p[0].localeCompare(b.p[0]))
    .map(x => x.p);
}
/* Cosa fare quando l'utente scrive e basta, senza toccare i suggerimenti. */
function resolveGuess(q){
  const nq = slug(q);
  if(!nq) return { kind:'vuoto' };
  const exact = guessDb().find(p => slug(p[0]) === nq);
  if(exact) return { kind:'ok', player: exact };      // "Ronaldo" resta Ronaldo
  const hits = searchPlayers(q);
  if(!hits.length) return { kind:'nessuno' };
  if(hits.length === 1) return { kind:'ok', player: hits[0] };
  return { kind:'ambiguo', hits };
}
const guessByName = n => guessDb().find(p => slug(p[0]) === slug(n)) || null;

/* Il misterioso esce dal seme: uguale per i due sfidanti, ignoto a entrambi. */
function answerForSeed(seed){
  const db = guessDb();
  return db[Math.floor(duelRng(hashSeed('gd:' + seed))() * db.length)];
}

/* ---- RISCONTRO SULLE SETTE COLONNE ---- */
function guessFeedback(g, t){
  const num = (gv, tv, tol, unit) => ({
    value: unit ? unit(gv) : String(gv),
    state: gv === tv ? 'ok' : (Math.abs(gv - tv) <= tol ? 'near' : 'no'),
    arrow: gv === tv ? '' : (gv > tv ? '↓' : '↑')
  });
  return [
    { label:'Nazione', value:g[1], state: g[1] === t[1] ? 'ok' : (g[2] === t[2] ? 'near' : 'no'), arrow:'',
      hint: g[1] !== t[1] && g[2] === t[2] ? 'stesso continente' : '' },
    { label:'Campionato', value:g[3], state: g[3] === t[3] ? 'ok' : 'no', arrow:'', hint:'' },
    { label:'Club', value:g[4], state: g[4] === t[4] ? 'ok' : (g[3] === t[3] ? 'near' : 'no'), arrow:'',
      hint: g[4] !== t[4] && g[3] === t[3] ? 'stesso campionato' : '' },
    { label:'Ruolo', value:g[5], state: g[5] === t[5] ? 'ok' : (repartoOf(g[5]) === repartoOf(t[5]) ? 'near' : 'no'), arrow:'',
      hint: g[5] !== t[5] && repartoOf(g[5]) === repartoOf(t[5]) ? 'stesso reparto' : '' },
    { label:'Età',    hint:'', ...num(g[6], t[6], 2) },
    { label:'Maglia', hint:'', ...num(g[7], t[7], 3) },
    { label:'Valore', hint:'', ...num(g[8], t[8], Math.max(5, t[8] * 0.25), fmtVal) }
  ];
}

K.gduel = id => 'gduel-' + id;

async function loadGuessDuels(){
  S.gduels = {};
  (await Store.list('gduel-')).forEach(({ key, value }) => { S.gduels[key.slice('gduel-'.length)] = value; });
}
const myGDuels = () => {
  const me = myPlayer();
  if(!me) return [];
  return Object.values(S.gduels || {}).filter(d => d.challengerId === me.id || d.opponentId === me.id);
};
const gPendingForMe = () => { const me = myPlayer(); return me ? myGDuels().filter(d => d.status === 'pending' && d.opponentId === me.id) : []; };
const gWaitingMine  = () => { const me = myPlayer(); return me ? myGDuels().filter(d => d.status === 'pending' && d.challengerId === me.id) : []; };
const gDoneMine     = () => myGDuels().filter(d => d.status === 'done');
function gRivalOf(d){ const me = myPlayer(); return me && d.challengerId === me.id ? d.opponentId : d.challengerId; }
function gOpponentGroups(){
  const map = {};
  gDoneMine().forEach(d => { const r = gRivalOf(d); (map[r] = map[r] || []).push(d); });
  Object.values(map).forEach(arr => arr.sort((a,b) => new Date(b.completedAt) - new Date(a.completedAt)));
  return map;
}
/* Il misterioso è scritto nella sfida: se l'archivio cambia dopo, le partite
   già giocate restano leggibili. Le vecchie sfide ricadono sul seme. */
const gAnswerOf = rec => guessByName(rec.answer) || answerForSeed(rec.seed);
const gMoves = (solved, guesses) => solved ? guesses.length : GUESS_MAX + 1;
const gLabel = (solved, n) => solved ? n + (n === 1 ? ' mossa' : ' mosse') : 'non trovato';

const GD = { screen:'menu', duelId:null, opponentId:null, role:null, seed:null, answer:null, guesses:[], solved:false, sugg:[] };

function startGuessDuel(opponentId){
  GD.opponentId = opponentId; GD.role = 'challenger'; GD.duelId = null;
  GD.seed = generateCode(); GD.answer = answerForSeed(GD.seed)[0];
  GD.guesses = []; GD.solved = false; GD.sugg = []; GD.screen = 'play';
}
function respondGuessDuel(rec){
  GD.opponentId = rec.challengerId; GD.role = 'opponent'; GD.duelId = rec.id;
  GD.seed = rec.seed; GD.answer = gAnswerOf(rec)[0];
  GD.guesses = []; GD.solved = false; GD.sugg = []; GD.screen = 'play';
}
const gTarget = () => guessByName(GD.answer) || answerForSeed(GD.seed);
const gOver = () => GD.solved || GD.guesses.length >= GUESS_MAX;

async function finalizeGuessChallenger(){
  const rec = {
    id: randomHex(6), challengerId: myPlayer().id, opponentId: GD.opponentId,
    seed: GD.seed, answer: GD.answer, status: 'pending',
    challengerGuesses: GD.guesses.slice(), challengerSolved: GD.solved,
    opponentGuesses: null, opponentSolved: null, winnerId: null,
    createdAt: new Date().toISOString(), completedAt: null
  };
  await Store.set(K.gduel(rec.id), rec);
  S.gduels[rec.id] = rec; GD.duelId = rec.id; GD.screen = 'sent'; render();
}
async function finalizeGuessOpponent(){
  const rec = S.gduels[GD.duelId];
  if(!rec){ toast('Sfida non trovata: forse è stata ritirata.', 'err'); GD.screen = 'menu'; render(); return; }
  rec.opponentGuesses = GD.guesses.slice(); rec.opponentSolved = GD.solved;
  rec.status = 'done'; rec.completedAt = new Date().toISOString();
  const cm = gMoves(rec.challengerSolved, rec.challengerGuesses);
  const om = gMoves(rec.opponentSolved, rec.opponentGuesses);
  rec.winnerId = cm === om ? null : (cm < om ? rec.challengerId : rec.opponentId);
  await Store.set(K.gduel(rec.id), rec);
  S.gduels[rec.id] = rec; GD.screen = 'result'; render();
}
async function playGuess(pl){
  if(GD.guesses.some(x => slug(x) === slug(pl[0]))){ toast('Hai già provato con questo nome.', 'err'); return; }
  GD.guesses.push(pl[0]);
  GD.sugg = [];
  if(slug(pl[0]) === slug(gTarget()[0])) GD.solved = true;
  if(gOver()){
    GD.role === 'challenger' ? await finalizeGuessChallenger() : await finalizeGuessOpponent();
    return;
  }
  render();
}
async function submitGuessText(q){
  const r = resolveGuess(q);
  if(r.kind === 'vuoto'){ toast('Scrivi un nome.', 'err'); return; }
  if(r.kind === 'nessuno'){ toast("Nessun calciatore con questo nome nell'archivio.", 'err'); return; }
  if(r.kind === 'ambiguo'){
    GD.sugg = r.hits.slice(0, 8);
    toast('Più calciatori corrispondono: scegli quale.', '');
    render();
    return;
  }
  await playGuess(r.player);
}
async function declineGuessDuel(rec){
  if(!await confirmBox('Rifiuto la sfida di ' + (player(rec.challengerId)?.name || '?') + '. Non potrà più essere accettata.')) return;
  await Store.del(K.gduel(rec.id)); delete S.gduels[rec.id]; toast('Sfida rifiutata.', ''); render();
}

async function importGuessDb(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:'array' });
  const sn = wb.SheetNames.find(n => /calciator|giocator|archivio/i.test(n));
  if(!sn) throw new Error('Non trovo un foglio "Calciatori".');
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval:'' });
  const pick = (r, ...names) => {
    for(const k of Object.keys(r)) if(names.some(n => new RegExp('^' + n + '$', 'i').test(String(k).trim()))) return r[k];
    return '';
  };
  const out = [];
  rows.forEach(r => {
    const nome = String(pick(r, 'nome', 'calciatore', 'giocatore')).trim();
    if(!nome) return;
    out.push([ nome,
      String(pick(r, 'nazione', 'nazionalit.', 'paese')).trim() || '—',
      String(pick(r, 'continente')).trim().toUpperCase() || 'EU',
      String(pick(r, 'campionato', 'lega', 'league')).trim() || '—',
      String(pick(r, 'club', 'squadra')).trim() || '—',
      String(pick(r, 'ruolo', 'posizione')).trim() || 'Punta',
      parseInt(pick(r, 'et.', 'anni'), 10) || 0,
      parseInt(pick(r, 'maglia', 'numero'), 10) || 0,
      Number(String(pick(r, 'valore', 'valore di mercato')).replace(',', '.')) || 0 ]);
  });
  if(out.length < 10) throw new Error('Servono almeno 10 calciatori: nel foglio ne ho trovati ' + out.length + '.');
  if(!S.core) S.core = emptyCore();
  S.core.guessDb = out;
  await saveCore();
  return { count: out.length };
}

  const cls = !rec.winnerId ? 'mute' : rec.winnerId === me.id ? 'ok' : 'ko';

  wrap.appendChild(el(`<div class="panel"><div class="panel-body" style="text-align:center; padding:28px 20px;">
    <span class="tag ${cls}" style="font-size:0.8rem; padding:6px 14px;">${outcome}</span>
    <h2 style="font-size:1.6rem; margin-top:10px;">${esc(gLabel(mineS, mineG.length))} — ${esc(gLabel(hisS, hisG.length))}</h2>
    <p class="note">contro ${esc(player(rivalId)?.name || '?')}</p>
    <p class="note" style="margin-top:10px;">Il misterioso era <strong style="color:var(--amber);">${esc(target[0])}</strong>
      — ${esc(target[1])}, ${esc(target[5])}, ${esc(target[4])}, ${target[6]} anni, maglia ${target[7]}, ${esc(fmtVal(target[8]))}.</p>
  </div></div>`));

  [ ['I tuoi tentativi', mineG], [esc(player(rivalId)?.name || 'Avversario') + ' — i suoi tentativi', hisG] ]
    .forEach(([title, gs]) => {
      const p = el(`<div class="panel"><div class="panel-head"><h2>${title}</h2></div><div class="panel-body"></div></div>`);
      p.querySelector('.panel-body').appendChild(gs.length ? guessGrid(gs, target) : el(`<div class="empty">Nessun tentativo.</div>`));
      wrap.appendChild(p);
    });

  const back = el(`<button class="btn btn-primary" style="width:100%;">Torna alle sfide</button>`);
  back.onclick = () => { GD.screen = 'menu'; GD.guesses = []; GD.solved = false; GD.sugg = []; render(); };
  wrap.appendChild(back);
  return wrap;
}

function viewGuessRoot(){
  if(GD.screen === 'play')   return viewGuessPlay();
  if(GD.screen === 'sent')   return viewGuessSent();
  if(GD.screen === 'result') return viewGuessResult();
  return viewGuessMenu();
}

/* =========================================================================
   19. RENDER PRINCIPALE
   ========================================================================= */
function renderWho(){
  const box = document.getElementById('who');
  box.innerHTML = '';

  if(!S.me){
    const btn = el(`<button class="who-login-btn">Accedi</button>`);
    btn.onclick = () => {
      S.gateTab = 'login';
      render();
      document.getElementById('li-user')?.focus();
    };
    box.appendChild(btn);
    return;
  }

  const btn = el(`
    <button class="who-btn" title="Clicca per uscire">
      <span class="badge-user ${S.me.role === 'admin' ? 'admin' : ''}">${esc(S.me.displayName || S.me.username)} · ${S.me.role === 'admin' ? 'organizzatore' : 'partecipante'}</span>
      <span class="logout-hint">esci ↦</span>
    </button>`);
  btn.onclick = logout;
  box.appendChild(btn);
  if(S.offline) box.appendChild(el(`<span class="who-role" style="color:var(--ko); font-size:0.75rem;">archivio offline</span>`));
}
function tabsFor(){
  const mine = myPlayer() ? [{ k:'mine', l:'I miei pronostici' }] : [];
  const duel = myPlayer() ? [{ k:'duel', l:'Undici 1v1', c: pendingForMe().length }] : [];
  const guess = myPlayer() ? [{ k:'indovina', l:'Indovina 1v1', c: gPendingForMe().length }] : [];
  if(isAdmin()){
    return [...mine, ...duel, ...guess,
            { k:'requests', l:'Richieste', c: totalPending() }, { k:'results', l:'Esiti' },
            { k:'board', l:'Classifiche' }, { k:'calendar', l:'Calendario' }, { k:'players', l:'Partecipanti' },
            { k:'excel', l:'File Excel' }, { k:'settings', l:'Impostazioni' }];
  }
  return [...mine, ...duel, ...guess, { k:'board', l:'Classifiche' }, { k:'calendar', l:'Calendario' }, { k:'settings', l:'Impostazioni' }];
}
function render(reveal){
  renderWho();
  const app = document.getElementById('app');
  app.innerHTML = '';
  document.getElementById('foot').textContent =
    'FantaList · 2 Last Man Standing + WhoWin?' + (S.core?.fileName ? ' · ' + S.core.fileName : '') + ' · archivio: ' + Store.mode();

  if(!S.me){ app.appendChild(renderGate()); return; }

  const tabs = tabsFor();
  if(!S.tab || !tabs.find(t => t.k === S.tab)) S.tab = tabs[0].k;
  const bar = el(`<div class="tabs"></div>`);
  tabs.forEach(t => {
    const b = el(`<button class="tab ${S.tab === t.k ? 'on' : ''}">${t.l}${t.c ? `<span class="count">${t.c}</span>` : ''}</button>`);
    b.onclick = () => { S.tab = t.k; render(); };
    bar.appendChild(b);
  });
  app.appendChild(bar);

  const empty = !S.core || !S.core.players.length;
  if(empty && S.tab !== 'settings' && S.tab !== 'calendar'){
    const w = el(`<div class="stack"></div>`);
    if(isAdmin()){
      w.appendChild(el(`
        <div class="panel"><div class="panel-body">
          <span class="eyebrow">passo 2 di 2</span>
          <h2 style="font-size:1.5rem; margin:4px 0 8px;">Apri i minigiochi</h2>
          <p class="note">Carica il file Excel della lega: da lì escono partecipanti, squadre e le giornate già giocate di tutti e tre i minigiochi.</p>
        </div></div>`));
      w.appendChild(importPanel(false));
    } else {
      w.appendChild(el(`<div class="empty">L'organizzatore non ha ancora aperto i minigiochi. Torna più tardi.</div>`));
    }
    app.appendChild(w);
    return;
  }

  if(isAdmin() && !empty && !['settings','duel','indovina'].includes(S.tab)) app.appendChild(scoreboard());

  const views = { mine: viewMine, duel: viewDuelRoot, indovina: viewGuessRoot,
                  requests: viewRequests, results: viewResults,
                  board: viewBoard, calendar: viewCalendar, players: viewPlayers, excel: viewExcel, settings: viewSettings };
  app.appendChild((views[S.tab] || viewMine)());
  if(reveal && S.tab === 'duel' && D.screen === 'draft') rollRevealD();
}

/* =========================================================================
   20. AVVIO
   ========================================================================= */
async function boot(){
  Store.init();
  try{
    await loadUsers();
    await loadClaims();
    await restoreSession();
    const fixed = await reconcileClaims();
    if(fixed) toast(fixed + ' collegamenti fra partecipanti e accessi ripristinati.', 'ok');
    await ensureMyClaim();
    await loadCore();
    await loadGames();
    await loadRound();
    await loadDuels();
    await loadGuessDuels();
  }catch(e){
    S.offline = true;
    toast('Archivio non raggiungibile: ' + e.message, 'err');
  }
  if(!S.core && S.me) { S.core = emptyCore(); }
  render();
  setInterval(async () => {
    const a = document.activeElement;
    if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    if(document.querySelector('.overlay')) return;
    if(S.me) await refresh(true);
  }, 8000);
}
boot();

</script>
